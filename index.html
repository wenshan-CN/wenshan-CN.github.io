<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#007AFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>学校信息化设备管理工作台</title>
<style>

/* ============ Apple 风格全局变量 ============ */
:root{
  --primary:#007AFF;
  --primary-d:#0062cc;
  --primary-l:#E8F2FF;
  --accent:#5AC8FA;
  --danger:#FF3B30;
  --danger-bg:#FFF2F1;
  --warn:#FF9500;
  --warn-bg:#FFF8ED;
  --ok:#34C759;
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --text:#1C1C1E;
  --muted:#8E8E93;
  --line:rgba(60,60,67,.12);
  --line-strong:rgba(60,60,67,.18);
  --radius:14px;
  --radius-sm:10px;
  --radius-lg:18px;
  --nav-w:240px;
  --nav-w-sm:68px;
  --shadow:0 1px 3px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08);
  --ease:cubic-bezier(.25,.1,.25,1);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{ -webkit-text-size-adjust:100%; }
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.47;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
a{color:var(--primary);text-decoration:none}

/* 侧边栏 */
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:var(--nav-w);
  background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:40;
  padding-bottom:var(--safe-b);
}
.brand{display:flex;align-items:center;gap:12px;padding:18px 16px 14px;border-bottom:1px solid var(--line)}
.brand .logo{
  width:36px;height:36px;flex:none;border-radius:10px;
  background:linear-gradient(145deg,#007AFF,#5AC8FA);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,122,255,.28);
}
.brand .tit{font-size:15px;font-weight:650;letter-spacing:-.02em}
.brand .sub{font-size:11px;color:var(--muted);margin-top:1px}
.nav{flex:1;overflow-y:auto;padding:10px 10px;scrollbar-width:thin}
.nav-item{
  display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;
  color:#3A3A3C;font-size:14px;text-align:left;cursor:pointer;
  padding:12px 12px;border-radius:12px;margin-bottom:2px;min-height:48px;font-family:inherit;
  transition:background .18s var(--ease), color .18s var(--ease);
}
.nav-item:hover{background:rgba(0,0,0,.04)}
.nav-item.active{background:var(--primary-l);color:var(--primary-d);font-weight:600}
.nav-item.active svg{stroke:var(--primary)}
.nav-item svg{width:21px;height:21px;flex:none;stroke:#8E8E93;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-badge{
  margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:600;
  border-radius:10px;padding:2px 7px;min-width:20px;text-align:center;line-height:16px;
}
.nav-foot{padding:12px;border-top:1px solid var(--line)}
.nav-foot button{
  width:100%;border:0;background:rgba(0,0,0,.04);color:var(--muted);
  border-radius:12px;padding:11px;font-size:13px;cursor:pointer;font-family:inherit;min-height:44px;
  transition:all .15s var(--ease);
}
.nav-foot button:hover{color:var(--danger);background:var(--danger-bg)}

/* 主区 */
.main{margin-left:var(--nav-w);min-height:100vh;display:flex;flex-direction:column}
.header{
  position:sticky;top:0;z-index:30;
  background:rgba(242,242,247,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);
  padding:14px 22px;padding-top:calc(14px + var(--safe-t));
}
.header .hd-in{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.header h1{font-size:22px;font-weight:700;letter-spacing:-.03em;color:var(--text)}
.header p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.hd-actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{
  border:0;border-radius:12px;padding:9px 15px;font-size:14px;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:6px;min-height:40px;white-space:nowrap;
  transition:transform .12s var(--ease), opacity .12s, background .15s;
  font-weight:500;
}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn-ghost{background:rgba(0,0,0,.05);color:var(--text)}
.btn-ghost:hover{background:rgba(0,0,0,.08)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 1px 3px rgba(0,122,255,.25)}
.btn-primary:hover{background:var(--primary-d)}
.btn-line{background:var(--card);color:var(--text);border:1px solid var(--line-strong);box-shadow:var(--shadow)}
.btn-line:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger{background:var(--danger);color:#fff}
.btn-warn{background:var(--warn);color:#fff}
.btn-sm{padding:7px 12px;font-size:13px;min-height:34px;border-radius:10px}

/* 提醒栏 */
.alerts{padding:12px 22px 0}
.alert{
  border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;font-size:14px;
  display:flex;gap:10px;align-items:flex-start;
  box-shadow:var(--shadow);
}
.alert svg{width:18px;height:18px;flex:none;margin-top:1px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.alert-danger{background:var(--danger-bg);border:1px solid rgba(255,59,48,.15);color:#C41E16}
.alert-warn{background:var(--warn-bg);border:1px solid rgba(255,149,0,.2);color:#A05A00}
.alert-tip{background:#FFFBEB;border:1px solid rgba(255,204,0,.25);color:#8A6D00}
.alert b{font-weight:650}
.alert .chip{
  display:inline-block;background:#fff;border-radius:8px;padding:2px 8px;margin:3px 4px 0 0;
  font-size:12px;border:1px solid currentColor;opacity:.9;
}
.alert .close{margin-left:auto;background:transparent;border:0;color:inherit;cursor:pointer;font-size:18px;line-height:1;padding:0 4px;opacity:.6}

/* 内容 */
.view{padding:16px 22px 48px;flex:1}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
  margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow);
}
.card-hd{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--line);
}
.card-hd h2{font-size:16px;display:flex;align-items:center;gap:8px;font-weight:650}
.card-hd h2::before{content:"";width:3px;height:14px;background:var(--primary);border-radius:2px;display:inline-block}
.card-bd{padding:16px 18px}
.muted{color:var(--muted);font-size:13px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type=text],.toolbar select{min-width:140px}
input,select,textarea{
  font-family:inherit;font-size:16px;
  padding:10px 12px;border:1px solid var(--line-strong);border-radius:12px;background:#fff;color:var(--text);
  width:100%;min-height:44px;transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(0,122,255,.15);
}
textarea{min-height:76px;resize:vertical}
label.fl{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{
  background:rgba(242,242,247,.8);color:var(--muted);font-weight:600;text-align:left;
  padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;
  letter-spacing:.01em;
}
tbody td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:rgba(0,0,0,.015)}
tr.row-danger{background:#FFF2F1;color:#C41E16}
tr.row-danger:hover{background:#FFE8E6}
tr.row-warn{background:#FFF8ED;color:#A05A00}
tr.row-warn:hover{background:#FFF0D6}
tr.row-scrap{background:#2C2C2E;color:#F5F5F7}
tr.row-scrap:hover{background:#1C1C1E}
tr.row-borrow{background:#FFF9E6;color:#9A6700}
tr.row-borrow:hover{background:#FFF3CC}
tr.row-out{background:#F0F5FF;color:#003DA5}
tr.row-out:hover{background:#E0EBFF}
tr.row-scrap .cellsub{color:rgba(255,255,255,.65)}
tr.row-scrap .btn-line{color:#F5F5F7 !important;border-color:rgba(255,255,255,.3) !important;background:transparent !important}
tr.row-borrow .cellsub{color:#8A6D00}
tr.row-out .cellsub{color:#3A5A8C}
.cellsub{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.flow-note{line-height:2;font-size:13px;color:var(--muted)}
.flow-note b{color:var(--text);font-weight:600}
.flow-note .n{color:var(--primary);font-weight:700;margin-right:4px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.lock-box{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:#FFFBEB;border:1px dashed #FFD60A;border-radius:10px;padding:9px 12px}
.lock-tip{font-size:12px;color:#8A6D00;line-height:1.45}

.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;line-height:18px;white-space:nowrap;font-weight:500}
.tag-gray{background:#F2F2F7;color:#636366}
.tag-teal{background:var(--primary-l);color:var(--primary-d)}
.tag-red{background:#FFE8E6;color:#C41E16}
.tag-orange{background:#FFF0D6;color:#A05A00}
.tag-green{background:#E5F8EB;color:#1B7A36}
.tag-blue{background:#E8F2FF;color:#0055B3}
.tag-dark{background:#3A3A3C;color:#fff}
.tag-scrap{background:#EDE9FE;color:#5E35B1}
.qty{display:inline-flex;gap:4px;flex-wrap:wrap}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:16px}
.kpi{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);transition:transform .15s var(--ease);
}
.kpi:hover{transform:translateY(-1px)}
.kpi .k-t{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:500}
.kpi .k-v{font-size:28px;font-weight:700;margin-top:6px;line-height:1.1;letter-spacing:-.03em}
.kpi .k-u{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi.k-red .k-v{color:var(--danger)}
.kpi.k-orange .k-v{color:var(--warn)}
.kpi.k-teal .k-v,.kpi.k-blue .k-v{color:var(--primary)}
.kpi.k-gray .k-v{color:#636366}
.kpi.k-dark .k-v{color:#3A3A3C}
.kpi.k-scrap .k-v{color:#5E35B1}

.chart-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:130px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px}
.pie-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bar-row{margin-bottom:10px}
.bar-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar-bg{height:12px;background:#F2F2F7;border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .4s var(--ease)}

.group-tit{
  display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--primary-d);
  background:var(--primary-l);padding:9px 14px;border-radius:12px;margin:14px 0 8px;
}
.group-tit:first-child{margin-top:0}

/* 弹窗 */
.mask{
  position:fixed;inset:0;background:rgba(0,0,0,.36);z-index:80;
  display:flex;align-items:center;justify-content:center;padding:16px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  animation:fadeIn .2s var(--ease);
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:20px;width:100%;max-width:720px;max-height:88vh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.2);
  animation:slideUp .28s var(--ease);
}
@keyframes slideUp{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.modal.narrow{max-width:420px}
.modal-hd{
  padding:16px 18px;border-bottom:1px solid var(--line);font-weight:650;font-size:17px;
  display:flex;align-items:center;justify-content:space-between;
}
.modal-hd button{background:rgba(0,0,0,.06);border:0;width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
.modal-hd button:hover{background:rgba(0,0,0,.1)}
.modal-bd{padding:18px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.modal-ft{
  padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;
  padding-bottom:calc(14px + var(--safe-b));
}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:32px;
  background:rgba(28,28,30,.92);color:#fff;padding:12px 20px;border-radius:14px;
  font-size:14px;z-index:99;opacity:0;transition:.25s var(--ease);pointer-events:none;
  max-width:88vw;text-align:center;backdrop-filter:blur(12px);box-shadow:var(--shadow-md);
}
.toast.show{opacity:1;bottom:42px}

.empty{text-align:center;color:var(--muted);padding:48px 12px;font-size:14px}
.empty svg{width:44px;height:44px;stroke:#C7C7CC;fill:none;stroke-width:1.4;display:block;margin:0 auto 10px}

.ledger-wrap{display:flex;gap:16px;align-items:flex-start;margin-top:14px}
.ledger-main{flex:1;min-width:0}
.ledger-side{width:340px;flex:none;position:sticky;top:72px}
.reg-tip{font-size:13px;color:var(--primary-d);background:var(--primary-l);border-radius:12px;padding:11px 13px;margin-bottom:12px;line-height:1.55}
.reg-stat{display:flex;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.reg-stat .s{flex:1;min-width:92px;text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px 6px;background:#fff}
.reg-stat .s b{display:block;font-size:22px;color:var(--primary);line-height:1.2;letter-spacing:-.02em}
.reg-stat .s span{font-size:11px;color:var(--muted)}
.reg-form .grid-2{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.reg-actions{display:flex;flex-direction:column;gap:9px}

/* 月历 */
.cal-card{
  background:rgba(242,242,247,.7);border:1px solid var(--line);border-radius:14px;
  padding:12px 10px 10px;margin:0 10px 10px;color:var(--text);flex-shrink:0;
}
.cal-hd{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.cal-nav{
  flex:0 0 auto;width:28px;height:28px;border-radius:8px;border:0;background:rgba(0,0,0,.05);
  color:var(--text);cursor:pointer;font-size:16px;line-height:1;
}
.cal-nav:hover{background:rgba(0,0,0,.08)}
.cal-title{flex:1;display:flex;gap:4px}
.cal-title select{
  flex:1;min-width:0;background:#fff;color:var(--text);border:1px solid var(--line);
  border-radius:8px;padding:4px 4px;font-size:12px;cursor:pointer;min-height:28px;
}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--muted);text-align:center;margin-bottom:3px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-cell{
  position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  font-size:12px;border-radius:8px;cursor:pointer;color:var(--text);
}
.cal-cell.other{color:#C7C7CC}
.cal-cell.today{background:var(--primary);font-weight:700;color:#fff}
.cal-cell.has{font-weight:650}
.cal-cell:hover{background:rgba(0,0,0,.05)}
.cal-cell.today:hover{background:var(--primary-d)}
.cal-dots{position:absolute;left:0;right:0;bottom:2px;display:flex;justify-content:center;gap:2px;pointer-events:none}
.cal-dots i{width:4px;height:4px;border-radius:50%;display:block}
.dot-red{background:#FF3B30}.dot-yel{background:#FF9500}.dot-grn{background:#34C759}
.cal-legend{display:flex;flex-wrap:wrap;gap:5px 8px;margin-top:8px;font-size:10px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:3px}
.cal-legend i{width:6px;height:6px;border-radius:50%;display:block}

/* 响应式 */
@media (max-width:1100px){
  .ledger-wrap{flex-direction:column}
  .ledger-side{width:100%;position:static;order:-1}
}
@media (max-width:900px){
  .sidebar{width:var(--nav-w-sm)}
  .main{margin-left:var(--nav-w-sm)}
  .nav-label,.brand .txt,.nav-foot .t{display:none}
  .brand{justify-content:center;padding:16px 6px}
  .nav-item{justify-content:center;padding:14px 6px;min-height:54px}
  .nav-item svg{width:24px;height:24px}
  .nav-badge{position:absolute;margin:0;transform:translate(16px,-14px);font-size:10px;padding:1px 5px}
  .nav-item{position:relative}
  .nav-foot button{font-size:11px;padding:10px 2px}
  .cal-card{display:none}
  .header h1{font-size:18px}
}
@media (max-width:760px){
  .view{padding:12px 12px 52px}
  .alerts{padding:10px 12px 0}
  .header{padding:12px 12px}
  .btn{padding:11px 14px;font-size:14px;min-height:46px}
  .btn-sm{padding:9px 12px;font-size:13px;min-height:40px}
  .hd-actions{width:100%}
  .hd-actions .btn{flex:1;justify-content:center;min-width:0;font-size:12px;padding:10px 8px}
  .kpi .k-v{font-size:24px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tbody tr{
    border:1px solid var(--line);border-radius:14px;margin-bottom:10px;
    padding:6px 4px;background:#fff;box-shadow:var(--shadow);
  }
  tbody tr.row-danger{background:#FFF2F1}
  tbody tr.row-warn{background:#FFF8ED}
  tbody tr.row-scrap{background:#2C2C2E}
  tbody tr.row-borrow{background:#FFF9E6}
  tbody tr.row-out{background:#F0F5FF}
  tbody td{
    border:0;padding:8px 14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;
  }
  tbody td::before{content:attr(data-label);color:var(--muted);font-size:12px;flex:none;min-width:78px;font-weight:500}
  tbody td>*{text-align:right}
  .acts{justify-content:flex-end}
  .modal{border-radius:16px 16px 0 0;max-height:92vh;margin-top:auto}
  .mask{align-items:flex-end;padding:0}
}
@media print{.sidebar,.hd-actions,.alerts{display:none}.main{margin:0}}

</style>
</head>
<body>

<!-- 左侧导航 -->
<aside class="sidebar">
  <div class="brand">
    <span class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="13" rx="2"></rect><path d="M8 21h8M12 16v5"></path>
      </svg>
    </span>
    <span class="txt">
      <span class="tit">信息化设备管理</span><br>
      <span class="sub">中高职 · IT 运维台</span>
    </span>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="cal-card" id="calCard">
    <div class="cal-hd">

<script>
/* =========================================================================
   学校信息化设备管理工作台 —— 全部逻辑内联，无任何外部依赖，断网可用
   数据存储：localStorage(key = wb_school_it_v1)
   ========================================================================= */
'use strict';

var LS_KEY = 'wb_school_it_v1';
var BACKUP_TIP_STEP = 20;   // 数据每累计 20 条提醒一次导出备份
var WARRANTY_DAYS = 60;     // 距质保到期 60 天内视为"即将过保"
var ADMIN_PWD = 'ws012736';    // 管理密码：删除出入库/借用流水需此密码

/* 下拉选项常量 */
var CATS = ['智慧教室设备','机房电脑','办公电脑','笔记本电脑','服务器','录播设备','投影','交互大屏','网络交换机','摄像头','便携摄像机','打印机','音响功放','电子班牌','其他'];
var LOCS = ['教学楼4-13教室','教学楼4-15教室','教学楼4-17教室','教学楼4-19教室'];
var REPAIR_STATUS = ['待处理','维修中','已修复','报废'];
var STATUS_DEV = ['在用','闲置','故障','已损坏','已出库','报废','借出','逾期'];
// 手动可设置的状态：在用 / 闲置 / 故障 / 已损坏 / 报废
// 「借出 / 逾期」为借用派生态、「已出库」为出入库登记派生态，均不在此列——必须由对应业务产生，禁止手动篡改
var STATUS_DEV_MANUAL = ['在用','闲置','故障','已损坏','报废'];
/* 生成「使用状态」下拉选项：仅含手动状态；
   若设备遗留 借出/逾期/已出库（早期手动数据或非锁定态），将其作为禁用项保留显示，既不丢失也不允许改 */
function statusManualOptions(cur){
  var list = STATUS_DEV_MANUAL.slice();
  if(STATUS_DEV_MANUAL.indexOf(cur)<0) list.push(cur);
  return list.map(function(x){
    var dis = STATUS_DEV_MANUAL.indexOf(x)<0 ? ' disabled' : '';
    return '<option'+(x===(cur||'在用')?' selected':'')+dis+'>'+x+'</option>';
  }).join('');
}
function statusDevTag(s){
  var m={'在用':'tag-teal','闲置':'tag-blue','故障':'tag-red','已损坏':'tag-dark','已出库':'tag-gray','报废':'tag-scrap','借出':'tag-orange','借出中':'tag-orange','逾期':'tag-red'};
  return '<span class="tag '+(m[s]||'tag-gray')+'">'+esc(s||'未设')+'</span>';
}
/* 状态统计以「派生运行状态」为准：被借用设备自动归入借出中/逾期，保证账实自洽 */
function cntStatus(s){ return metrics.countRuntime(s); }
function inStock(){ return metrics.inStock(); }

/* 统一指标层：所有「台数类」KPI 经此对象或下方兼容包装函数取数，避免口径分叉 */
var metrics = {
  total: function(){ return DB.devices.length; },
  countRuntime: function(st){
    return DB.devices.filter(function(d){ return devRuntimeStatus(d)===st; }).length;
  },
  outCount: function(){
    return DB.devices.filter(function(d){
      return isOutByFlow(d.id) && !activeBorrowOf(d.id);
    }).length;
  },
  borrowActiveCount: function(){
    var ids={};
    DB.borrows.forEach(function(b){
      if(!b.inDate && borrowStatus(b)!=='逾期') ids[b.devId]=1;
    });
    return Object.keys(ids).length;
  },
  overdueCount: function(){
    var ids={};
    DB.borrows.forEach(function(b){
      if(!b.inDate && borrowStatus(b)==='逾期') ids[b.devId]=1;
    });
    return Object.keys(ids).length;
  },
  scrapCount: function(){ return metrics.countRuntime('报废'); },
  inStock: function(){
    return metrics.total()
      - metrics.outCount()
      - metrics.scrapCount()
      - metrics.borrowActiveCount()
      - metrics.overdueCount();
  }
};

/* 运行期状态 */
var DB = null;
var PAGE = 'ledger';
var UI = { kw:'', cat:'', loc:'', group:false, flowType:'in', repairFilter:'', borrowFilter:'', calYear:new Date().getFullYear(), calMonth:new Date().getMonth()+1 };

/* ======================= 侧边栏月历（与出入库 / 借用记录联动） ======================= */
function pad2(n){ return (n<10?'0':'')+n; }
function fmtDate(dt){ return dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate()); }
function dateKey(s){ return (''+(s||'')).slice(0,10); }
var calReady = false;

function collectDots(){
  var map = {};
  function set(ds, k){ if(!ds) return; if(!map[ds]) map[ds]={red:false,yel:false,grn:false}; map[ds][k]=true; }
  DB.flows.forEach(function(f){
    var ds = dateKey(f.time);
    if(f.type==='in') set(ds,'grn'); else set(ds,'red');            // 入库=绿，出库=红
  });
  DB.borrows.forEach(function(b){
    set(dateKey(b.outDate),'yel');                                  // 借出日 = 橙
    if(b.inDate) set(dateKey(b.inDate),'grn');                      // 归还 = 绿
    else if(borrowStatus(b)==='逾期') set(dateKey(b.expectDate),'red'); // 逾期应还日 = 红
  });
  return map;
}
function calBuildCell(yRaw, mRaw, d, other, dots, todayStr){
  var y=yRaw, m=mRaw;
  if(m<1){ y--; m=12; } else if(m>12){ y++; m=1; }
  var dt = new Date(y, m-1, d);
  var ds = fmtDate(dt);
  var d0 = dots[ds] || {};
  var cls = 'cal-cell' + (other?' other':'') + (ds===todayStr?' today':'') + ((d0.red||d0.yel||d0.grn)?' has':'');
  var dh = '';
  if(d0.red||d0.yel||d0.grn){
    dh = '<span class="cal-dots">';
    if(d0.red) dh += '<i class="dot-red"></i>';
    if(d0.yel) dh += '<i class="dot-yel"></i>';
    if(d0.grn) dh += '<i class="dot-grn"></i>';
    dh += '</span>';
  }
  return '<div class="'+cls+'" data-date="'+ds+'">'+d+dh+'</div>';
}
function calYearRange(){
  var y0 = 2024, y1 = new Date().getFullYear()+1;
  function span(y){ if(y>=2000){ if(y<y0)y0=y; if(y>y1)y1=y; } }
  DB.flows.forEach(function(f){ span(+dateKey(f.time).slice(0,4)); });
  DB.borrows.forEach(function(b){ span(+dateKey(b.outDate).slice(0,4)); span(+dateKey(b.expectDate).slice(0,4)); if(b.inDate) span(+dateKey(b.inDate).slice(0,4)); });
  if(UI.calYear<y0) y0=UI.calYear; if(UI.calYear>y1) y1=UI.calYear;
  return [y0,y1];
}
function fillYearOptions(ySel){
  var rng = calYearRange();
  var yo=''; for(var y=rng[0];y<=rng[1];y++) yo += '<option value="'+y+'"'+(y===UI.calYear?' selected':'')+'>'+y+'年</option>';
  ySel.innerHTML = yo;
}
function initCalOnce(){
  if(calReady) return;
  var ySel = $('calYear'), mSel = $('calMonth');
  fillYearOptions(ySel);
  var mo=''; for(var m=1;m<=12;m++) mo += '<option value="'+m+'"'+(m===UI.calMonth?' selected':'')+'>'+m+'月</option>';
  mSel.innerHTML = mo;
  ySel.addEventListener('change', function(e){ UI.calYear=+e.target.value; renderCal(); });
  mSel.addEventListener('change', function(e){ UI.calMonth=+e.target.value; renderCal(); });
  document.addEventListener('click', function(e){
    var nav = e.target.closest && e.target.closest('[data-cal]');
    if(nav){
      if(nav.getAttribute('data-cal')==='prev') shiftMonth(-1);
      else if(nav.getAttribute('data-cal')==='next') shiftMonth(1);
      return;
    }
    var c = e.target.closest && e.target.closest('.cal-cell[data-date]');
    if(c) openCalDay(c.getAttribute('data-date'));
  });
  calReady = true;
}
function shiftMonth(d){
  var m = UI.calMonth + d, y = UI.calYear;
  if(m<1){ m=12; y--; } else if(m>12){ m=1; y++; }
  UI.calYear = y; UI.calMonth = m;
  renderCal();
}
function renderCal(){
  initCalOnce();
  var ySel=$('calYear'), mSel=$('calMonth');
  if(ySel){ fillYearOptions(ySel); ySel.value = UI.calYear; }
  if(mSel) mSel.value = UI.calMonth;
  var y=UI.calYear, m=UI.calMonth, grid=$('calGrid');
  if(!grid) return;
  var dots = collectDots();
  var todayStr = fmtDate(new Date());
  var startDow = (new Date(y, m-1, 1).getDay() + 6) % 7;
  var daysInMonth = new Date(y, m, 0).getDate();
  var prevDays = new Date(y, m-1, 0).getDate();
  var html = '';
  for(var i=0;i<startDow;i++){ html += calBuildCell(y, m-1, prevDays-startDow+1+i, true, dots, todayStr); }
  for(var d=1; d<=daysInMonth; d++){ html += calBuildCell(y, m, d, false, dots, todayStr); }
  var made = startDow + daysInMonth;
  var tail = (7 - made%7) % 7; if(tail===0 && made<42) tail = 7;
  for(var i=1;i<=tail;i++){ html += calBuildCell(y, m+1, i, true, dots, todayStr); }
  grid.innerHTML = html;
}
function openCalDay(ds){
  var dm = devMap();
  var lines = [];
  function dn(id){ var d=dm[id]; return d ? (d.code+' '+d.name) : '(未知设备)'; }
  DB.flows.forEach(function(f){
    if(dateKey(f.time)===ds){
      var who = f.person ? (' · '+(f.type==='in'?'经办':'领用')+'：'+esc(f.person)) : '';
      lines.push((f.type==='in'?'入库':'出库')+'：'+esc(dn(f.devId))+who);
    }
  });
  DB.borrows.forEach(function(b){
    if(dateKey(b.outDate)===ds) lines.push('借出：'+esc(dn(b.devId))+(b.person?(' · '+esc(b.person)):''));
    if(b.inDate && dateKey(b.inDate)===ds) lines.push('归还：'+esc(dn(b.devId))+(b.person?(' · '+esc(b.person)):''));
    if(!b.inDate && borrowStatus(b)==='逾期' && dateKey(b.expectDate)===ds) lines.push('逾期应还：'+esc(dn(b.devId))+(b.person?(' · '+esc(b.person)):''));
  });
  var body = lines.length
    ? '<div style="font-size:13px;line-height:1.95">'+lines.map(function(t){return '<div style="padding:3px 0;border-bottom:1px dashed #eee">'+(t.indexOf('逾期')===0?'<b style="color:var(--danger)">':'')+t+(t.indexOf('逾期')===0?'</b>':'')+'</div>';}).join('')+'</div>'
    : '<div class="muted">当天无出入库 / 借用记录</div>';
  openModal({ title:'记录明细 · '+ds, body:body, okText:'确定', okOnly:true });
}

/* ---------------- 基础工具 ---------------- */
function $(id){ return document.getElementById(id); }
function uid(p){ return (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function today(){ var d=new Date(); return fmtDate(d); }
function nowStr(){
  var d=new Date(), h=d.getHours(), mi=d.getMinutes();
  return fmtDate(d)+' '+(h<10?'0':'')+h+':'+(mi<10?'0':'')+mi;
}
/* 日期归一化：把 Excel / 手工输入的各种分隔写法统一为标准 YYYY-MM-DD。
   兼容 2024-01-15 / 2024/01/15 / 2024.01.15 / 2024年01月15日 等；无法解析返回 '' */
function normDate(s){
  if(s===null||s===undefined) return '';
  s=(''+s).trim();
  if(!s) return '';
  var m = s.match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/);
  if(m){ var y=+m[1], mo=+m[2], d=+m[3]; if(mo>=1&&mo<=12&&d>=1&&d<=31) return y+'-'+pad2(mo)+'-'+pad2(d); }
  var dt = new Date(s);
  if(!isNaN(dt.getTime())) return fmtDate(dt);
  return '';
}
/* 日期时间归一化：保留时间部分，日期部分交给 normDate，输出 YYYY-MM-DD HH:MM */
function normDateTime(s){
  if(s===null||s===undefined) return '';
  s=(''+s).trim();
  if(!s) return '';
  var sp = s.split(/[ T]/);
  var ds = normDate(sp[0]);
  if(!ds) return '';
  var parts = (sp[1]||'00:00').split(':');
  var hh = pad2(+parts[0]||0), mi = pad2(+parts[1]||0);
  return ds + ' ' + hh + ':' + mi;
}
/* 全量归一化 DB 中各日期字段，防止 Excel 斜杠日期入库/再导入时丢失 */
function normalizeDates(db){
  (db.devices||[]).forEach(function(d){ d.buyDate=normDate(d.buyDate); d.warranty=normDate(d.warranty); });
  (db.flows||[]).forEach(function(f){ f.time=normDateTime(f.time); f.returnDate=normDate(f.returnDate); });
  (db.repairs||[]).forEach(function(r){ r.time=normDateTime(r.time); });
  (db.borrows||[]).forEach(function(b){ b.outDate=normDate(b.outDate); b.expectDate=normDate(b.expectDate); b.inDate=normDate(b.inDate); });
  return db;
}
function daysTo(dateStr){ // 距今还有多少天（负数=已过期）
  if(!dateStr) return null;
  var t = new Date(dateStr+'T00:00:00').getTime();
  if(isNaN(t)) return null;
  var n = new Date(today()+'T00:00:00').getTime();
  return Math.round((t-n)/86400000);
}
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(function(){ t.classList.remove('show'); },2200);
}
function addDays(n){ var d=new Date(); d.setDate(d.getDate()+n); return fmtDate(d); }

/* ---------------- 存储 ---------------- */
function save(){
  try{ normalizeDates(DB); localStorage.setItem(LS_KEY, JSON.stringify(DB)); pushSnapshot(); }
  catch(e){ toast('保存失败：浏览器存储空间可能已满，请先导出备份'); }
}
function totalCount(){ return DB.devices.length + DB.flows.length + DB.repairs.length + DB.borrows.length; }
/* ---------------- 本地自动快照（防误删/误改，仅本浏览器） ---------------- */
var LS_SNAP = 'wb_device_snapshots';
var SNAP_MAX = 5;
var _lastSnapSig = '';
function snapSig(){
  var len = 0; try{ len = JSON.stringify(DB).length; }catch(e){ len = 0; }
  return DB.devices.length+'|'+DB.flows.length+'|'+DB.repairs.length+'|'+DB.borrows.length+'|'+len;
}
function pushSnapshot(){
  try{
    if(totalCount()===0) return;                 // 空数据不浪费快照
    var sig = snapSig();
    if(sig === _lastSnapSig) return;             // 数据未变化，避免重复快照
    var arr = [];
    try{ arr = JSON.parse(localStorage.getItem(LS_SNAP)||'[]'); }catch(e){ arr = []; }
    if(!Array.isArray(arr)) arr = [];
    if(arr.length && arr[arr.length-1].sig === sig){ _lastSnapSig = sig; return; }
    arr.push({ ts: nowStr(), sig: sig, data: JSON.parse(JSON.stringify(DB)) });
    if(arr.length > SNAP_MAX) arr = arr.slice(arr.length - SNAP_MAX);
    localStorage.setItem(LS_SNAP, JSON.stringify(arr));
    _lastSnapSig = sig;
  }catch(e){ /* 快照写入失败不影响主保存 */ }
}
function loadSnapshots(){ try{ var a=JSON.parse(localStorage.getItem(LS_SNAP)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function restoreSnapshot(i){
  var arr = loadSnapshots(); var s = arr[i]; if(!s) return;
  DB = { devices:s.data.devices||[], flows:s.data.flows||[], repairs:s.data.repairs||[], borrows:s.data.borrows||[], meta:s.data.meta||{} };
  _lastSnapSig=''; save(); render(); toast('已从 '+s.ts+' 的快照恢复');
}
function deleteSnapshot(i){ var arr=loadSnapshots(); arr.splice(i,1); localStorage.setItem(LS_SNAP, JSON.stringify(arr)); openSnaps(); }
function clearSnapshots(){ localStorage.removeItem(LS_SNAP); _lastSnapSig=''; openSnaps(); }
function openSnaps(){
  var arr = loadSnapshots();
  var html = '<div style="line-height:1.6">'
    + '<p class="muted" style="margin:0 0 10px">系统每次保存会自动留存最近 <b>'+SNAP_MAX+'</b> 份快照（仅本浏览器），用于误删/误改后恢复。快照<b>不会</b>随「清空全部数据」被删，是本地的第二层保险。</p>';
  if(!arr.length){ html += '<p style="margin:8px 0">暂无快照，录入或改动数据后会自动生成。</p>'; }
  else {
    html += '<div style="max-height:60vh;overflow:auto">';
    for(var i=arr.length-1;i>=0;i--){
      var s=arr[i]; var d=s.data||{};
      var cnt=((d.devices||[]).length+(d.flows||[]).length+(d.repairs||[]).length+(d.borrows||[]).length);
      html += '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)">'
        + '<div style="flex:1;min-width:0"><b>'+esc(s.ts)+'</b><br><span class="muted" style="font-size:12px">共 '+cnt+' 条数据</span></div>'
        + '<button class="btn btn-line btn-sm" data-act="snapRestore" data-i="'+i+'">恢复</button>'
        + '<button class="btn btn-ghost btn-sm" data-act="snapDel" data-i="'+i+'">删除</button>'
        + '</div>';
    }
    html += '</div><div style="margin-top:12px"><button class="btn btn-ghost btn-sm" data-act="snapClear">清空所有快照</button></div>';
  }
  html += '</div>';
  openModal({ title:'本地快照恢复', okText:'关闭', body:html });
}
function load(){
  var raw = null;
  try{ raw = localStorage.getItem(LS_KEY); }catch(e){}
  if(raw){
    try{
      DB = JSON.parse(raw);
      DB.devices = DB.devices || []; DB.flows = DB.flows || []; DB.repairs = DB.repairs || []; DB.borrows = DB.borrows || [];
      DB.meta = DB.meta || {};
      migrate();
      normalizeDates(DB);   // 启动即把本地可能残留的斜杠日期归一化，避免回填表单时被日期控件吞掉
      recalcAllDevStatus();   // 出库真相源：依据流水回写设备基底状态（已出库/在用/故障）
      reconcileAllRepairDev(); // 工单→设备状态对账，与导入路径保持一致
      return;
    }catch(e){
      // 数据损坏：先保留原始副本（键名 .corrupt）便于恢复，再提示用户，绝不静默覆盖
      try{ localStorage.setItem(LS_KEY+'.corrupt', raw); }catch(e2){}
      toast('⚠️ 本地数据已损坏，已为你保留副本（键名 '+LS_KEY+'.corrupt）。请通过「导入恢复」找回数据，或将该副本交予技术支持。当前已载入空白工作台。');
    }
  }
  DB = seed();
  // 仅在全新（无 raw）时写回；损坏时不覆盖，保留原始 raw 以便恢复
  if(!raw) save();
}
function migrate(){
  DB.devices.forEach(function(d){
    if(d.status===undefined || d.status===null || d.status==='') d.status='在用';
    if(d.machineNo===undefined) d.machineNo='';
    if(d.serial===undefined) d.serial='';
    if(d.manager===undefined) d.manager='';
    if(d.dept===undefined) d.dept='';
  });
  DB.flows.forEach(function(f){
    if(f.devCode===undefined) f.devCode='';
    if(f.devName===undefined) f.devName='';
  });
  DB.borrows.forEach(function(b){
    if(b.inDate===undefined) b.inDate='';
    if(b.dept===undefined) b.dept='';
    if(b.purpose===undefined) b.purpose='';
    if(b.remark===undefined) b.remark='';
  });
  // 旧版用 type='in' 表示归还且可能未改 out.ret：有 in 则将该设备未还 out 标为已归还
  DB.devices.forEach(function(d){
    var hasIn = DB.flows.some(function(f){ return f.devId===d.id && f.type==='in'; });
    if(!hasIn) return;
    DB.flows.forEach(function(f){
      if(f.devId===d.id && f.type==='out' && f.ret!=='已归还'){ f.ret='已归还'; }
    });
  });
  DB.devices.forEach(function(d){ unifyDevStatus(d.id); });
}

/* ---------------- 预置示例数据（seed:true 的可被"清空示例数据"一键清除） ---------------- */
function seed(){
  // 已按需清空示例数据：全新打开即为空白工作台，可直接录入真实设备/流水/工单/借用数据
  return { devices:[], flows:[], repairs:[], borrows:[], meta:{ createdAt:nowStr(), tipAt:0 } };
}

/* ---------------- 业务计算 ---------------- */
function devById(id){
  for(var i=0;i<DB.devices.length;i++){ if(DB.devices[i].id===id) return DB.devices[i]; }
  return null;
}
function devMap(){
  var m={};
  DB.devices.forEach(function(d){ m[d.id]=d; });
  return m;
}
/* 根据资产编号(devCode)重新关联没有 devId 的流水/工单/借用（解决 CSV 导入顺序问题） */
function relinkOrphans(){
  var dm=devMap();
  DB.flows.forEach(function(f){ if(!f.devId && f.devCode){ for(var k in dm){ if(dm[k].code===f.devCode){ f.devId=k; break; } } } });
  DB.repairs.forEach(function(r){ if(!r.devId && r.devCode){ for(var k in dm){ if(dm[k].code===r.devCode){ r.devId=k; break; } } } });
  DB.borrows.forEach(function(b){ if(!b.devId && b.devCode){ for(var k in dm){ if(dm[k].code===b.devCode){ b.devId=k; break; } } } });
}
function devLabel(id){
  var d=devById(id);
  return d ? (d.code+' '+d.name) : '（设备已删除）';
}
function warnDevices(){   // 仅统计「距质保到期 60 天内且未过保」的设备（已过保不再提醒）
  return DB.devices.filter(function(d){
    var n=daysTo(d.warranty); return n!==null && n>=0 && n<=WARRANTY_DAYS;
  });
}
function brokenDevices(){ return DB.devices.filter(function(d){ return d.status==='故障'; }); }
function pendingRepairs(){ return DB.repairs.filter(function(r){ return r.status==='待处理'||r.status==='维修中'; }); }
function sum(arr,key){ var s=0; for(var i=0;i<arr.length;i++) s+=(+arr[i][key]||0); return s; }
function borrowStatus(b){ if(b.inDate) return '已归还'; if(b.expectDate && daysTo(b.expectDate)<0) return '逾期'; return '借出中'; }
function pendingBorrows(){ return DB.borrows.filter(function(b){ return borrowStatus(b)!=='已归还'; }); }
function overdueBorrows(){ return DB.borrows.filter(function(b){ return borrowStatus(b)==='逾期'; }); }

/* 取某设备当前未归还（在借）的借用记录，取最近一笔 */
function activeBorrowOf(devId){
  var ab=null;
  for(var i=0;i<DB.borrows.length;i++){
    var b=DB.borrows[i];
    if(b.devId===devId && !b.inDate){
      if(!ab || (b.outDate||'')>(ab.outDate||'')) ab=b;
    }
  }
  return ab;
}

/* ===== Phase1/2 核心：出库真相源 / 借用互斥 / 删除门禁 / 编号唯一 ===== */
function isOutByFlow(devId){
  if(!devId) return false;
  return DB.flows.some(function(f){ return f.devId===devId && f.type==='out' && f.ret!=='已归还'; });
}
function devHasOpenRepair(devId){
  if(!devId) return false;
  return DB.repairs.some(function(r){ return r.devId===devId && (r.status==='待处理'||r.status==='维修中'); });
}
/* 按流水回写设备基底状态：借用仅影响展示（devRuntimeStatus），不写「借出中」进 d.status。
   调用：出库提交、归还、删流水、借用归还、migrate 后、load 后 */
function unifyDevStatus(devId){
  var d = devById(devId);
  if(!d) return;
  if(isOutByFlow(devId)){ d.status='已出库'; return; }
  if(d.status==='已出库'){ d.status='在用'; }
  if(devHasOpenRepair(devId) && (d.status==='在用'||d.status==='闲置')){ d.status='故障'; }
}
function getDeviceBlockers(devId){
  var borrowing = DB.borrows.filter(function(b){ return b.devId===devId && !b.inDate; });
  var outbound = DB.flows.filter(function(f){ return f.devId===devId && f.type==='out' && f.ret!=='已归还'; });
  var repairs = DB.repairs.filter(function(r){ return r.devId===devId && (r.status==='待处理'||r.status==='维修中'); });
  return { borrowing:borrowing, outbound:outbound, repairs:repairs, blocked:!!(borrowing.length||outbound.length||repairs.length) };
}
/* opts.force / opts.cascade：force 时必须 cascade（防止强删主数据留业务单） */
function deleteDevice(devId, opts){
  opts = opts || {};
  var force = !!opts.force, cascade = !!opts.cascade;
  if(!devById(devId)) return { ok:false, msg:'设备不存在' };
  var bl = getDeviceBlockers(devId);
  if(bl.blocked && !force) return { ok:false, msg:'设备存在未闭环业务，不能删除' };
  if(force && bl.blocked && !cascade) return { ok:false, msg:'强制删除必须同时清除关联记录' };
  DB.devices = DB.devices.filter(function(x){ return x.id!==devId; });
  if(cascade){
    DB.flows = DB.flows.filter(function(x){ return x.devId!==devId; });
    DB.repairs = DB.repairs.filter(function(x){ return x.devId!==devId; });
    DB.borrows = DB.borrows.filter(function(x){ return x.devId!==devId; });
  }
  return { ok:true };
}
function assertCodeUnique(code, excludeId){
  code = String(code||'').trim();
  if(!code) return { ok:false, msg:'资产编号不能为空' };
  if(DB.devices.some(function(d){ return d.code===code && d.id!==excludeId; })){
    return { ok:false, msg:'资产编号「'+code+'」已存在' };
  }
  return { ok:true };
}
function syncRedundantLabels(devId){
  var d = devById(devId);
  if(!d) return;
  DB.flows.forEach(function(f){ if(f.devId===devId){ f.devCode=d.code; f.devName=d.name; } });
  DB.repairs.forEach(function(r){ if(r.devId===devId){ if(r.devCode!==undefined) r.devCode=d.code; if(r.devName!==undefined) r.devName=d.name; } });
  DB.borrows.forEach(function(b){ if(b.devId===devId){ if(b.devCode!==undefined) b.devCode=d.code; if(b.devName!==undefined) b.devName=d.name; } });
}
/* 删除设备弹窗：展示 blockers + 强制门禁（替换旧的「只校验密码」逻辑） */
function openDeleteDeviceModal(id){
  var d = devById(id);

  var bl = getDeviceBlockers(id);

    ? '<div class="alert alert-danger" style="margin-bottom:12px">'+ICON.warn+'<div><b>该设备存在未闭环业务，删除前须先处理：</b><br>'
      + (bl.borrowing.length?chip('借用未还 '+bl.borrowing.length+' 笔'):'')
      + (bl.outbound.length?chip('出库未归还 '+bl.outbound.length+' 笔'):'')
      + (bl.repairs.length?chip('报修未闭环 '+bl.repairs.length+' 张'):'')
      + '</div></div>'
    : '<div class="muted" style="margin-bottom:12px">该设备当前无未闭环业务，可直接删除。</div>';

      + '<input type="checkbox" id="delForce"> 我确认强制删除所有出入库流水 / 维修工单 / 借用记录</label>'
    : '';
  openModal({
    title:'删除设备', narrow:true, danger:true, okText:'确认删除',
    body: blockersHtml
      + '<div style="margin-bottom:10px">该操作不可恢复，请输入管理密码：</div>'
      + '<input id="pwdInput" type="password" class="inp" placeholder="请输入管理密码" style="font-size:16px;width:100%">'
      + '<div id="pwdHint" class="muted" style="margin-top:6px;color:#dc2626;min-height:18px"></div>'
      + '<label style="display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.5;margin-top:10px">'
      + '<input type="checkbox" id="delLinked" checked> 同时删除关联记录（出入库流水 / 维修工单 / 借用记录）</label>'
      + forceBlock,
    onOk:function(){
      if(v('pwdInput')!==ADMIN_PWD){ var h=$('pwdHint'); if(h) h.textContent='管理密码错误，已取消本次删除'; return false; }
      var force = bl.blocked;
      if(force){
        var fb=$('delForce');
        if(!fb || !fb.checked){ var h2=$('pwdHint'); if(h2) h2.textContent='存在未闭环业务，请勾选「强制删除」确认框'; return false; }
      }
      var cascade = !$('delLinked') || $('delLinked').checked;
      var r = deleteDevice(id, { force:force, cascade:cascade });
      if(!r.ok){ toast(r.msg); return false; }
      save(); render(); toast('设备已删除');
      return true;
    }
  });
}

/* 设备状态是否「锁定」：① 有未归还的借用记录（借出中/逾期）；② 有未归还的出库流水（已出库）；
   ③ 存在「待处理 / 维修中」的报修工单。锁定时状态字段禁止手动编辑，由对应的借用/出入库/报修业务自动维护。 */
function devStatusLocked(d){
  if(!d || !d.id) return false;
  if(activeBorrowOf(d.id)) return true;
  if(isOutByFlow(d.id)) return true;
  if(devHasOpenRepair(d.id)) return true;
  return false;
}
function devLockReason(d){
  if(activeBorrowOf(d.id)) return '该设备当前有未归还的借用记录';
  if(isOutByFlow(d.id)) return '该设备已出库（存在未归还的出库登记）';
  return '该设备有「待处理 / 维修中」的报修工单未闭环';
}
/* 设备台账「状态」列根据业务记录自动叠加关联状态：逾期=红、借出未还=橙、已出库=灰；
   借用与出库均不写进 d.status（d.status 仅由 unifyDevStatus 依据流水回写），展示态在此派生 */
function devRuntimeStatus(d){
  if(!d) return '在用';
  var b=activeBorrowOf(d.id);
  if(b){
    var st=borrowStatus(b);
    if(st==='逾期') return '逾期';
    if(st==='借出中') return '借出中';
  }
  if(isOutByFlow(d.id)) return '已出库';
  return d.status;
}

/* ======================= 模块1：设备台账总览 ======================= */
function devRowClass(d){
  var rs = devRuntimeStatus(d);   // 实际展示状态（含借用派生的「借出中/逾期」）
  // 优先级：报废 > 故障/已损坏 > 借出/逾期 > 已出库 > 质保临期（状态色优先于通用质保橙）
  if(d.status==='报废') return 'row-scrap';                                   // 深灰底白字
  if(d.status==='故障' || d.status==='已损坏') return 'row-danger';            // 红底
  if(rs==='借出中' || rs==='逾期' || d.status==='借出') return 'row-borrow';  // 浅黄底红字
  if(d.status==='已出库') return 'row-out';                                   // 浅灰底蓝字
  var n=daysTo(d.warranty);                                                   // 橙底：质保临期(60天内)
  if(n!==null && n>=0 && n<=WARRANTY_DAYS) return 'row-warn';
  return '';
}
function warrantyCell(d){
  var n=daysTo(d.warranty);
  if(n===null) return '<span class="muted">未填写</span>';

  if(n<=WARRANTY_DAYS) return '<span class="tag tag-orange">'+esc(d.warranty)+' 剩'+n+'天</span>';
  return esc(d.warranty);
}
function statusCell(d){ return statusDevTag(devRuntimeStatus(d)); }
function filterDevices(){

function devSubmit(id){
  if(!v('f_name') || !v('f_code')){ toast('设备名称和资产编号必填'); return false; }
  var codeChk = assertCodeUnique(v('f_code'), id||null);
  if(!codeChk.ok){ toast(codeChk.msg); return false; }
  var obj = {
    name:v('f_name'), model:v('f_model'), code:v('f_code'), cat:v('f_cat'), loc:v('f_loc'),
    supplier:v('f_supplier'), status:v('f_status')||'在用', manager:v('f_manager'), dept:v('f_dept'), machineNo:v('f_machine'), serial:v('f_serial'),
    buyDate:normDate(v('f_buyDate')), warranty:normDate(v('f_warranty')), remark:v('f_remark')
  };
  if(obj.status==='已出库'){
    var _tid = id;
    if(!_tid){ toast('新登记的设备不能直接设为「已出库」，请先保存为在用，再到「出入库登记」登记出库。'); return false; }
    if(!isOutByFlow(_tid)){ toast('未找到该设备的出库（借领用）记录，不能手动设为「已出库」。请先在「出入库登记」中登记出库。'); return false; }
  }
  if(obj.status==='借出' || obj.status==='逾期'){
    if(!id || !DB.borrows.some(function(b){ return b.devId===id && !b.inDate; })){
      toast('「借出/逾期」是借用派生状态，不能手动设置；请到「设备借用登记」登记借用，逾期会自动标红。'); return false;
    }
  }
  var _devId;
  if(id){
    var d = devById(id);
    if(devStatusLocked(d)){ obj.status = d.status; }  // 锁定设备：状态禁止手动改，强制保持原值
    for(var k in obj) d[k]=obj[k];
    _devId = id;
  }else{
    obj.id = uid('dev');
    DB.devices.unshift(obj);
    _devId = obj.id;
  }
  syncRedundantLabels(_devId);   // 编号/名称变更后，同步更新关联流水/工单/借用上的冗余标签
  save(); render(); toast(id?'设备信息已更新':'设备已新增');
  return true;
}

function flowSubmit(type){
  var isIn = type==='in';
  if(isIn){
    // 方案 A：选中已出库设备后，找到一笔未归还 out，按 doFlowReturn 同款字段闭环；
    // 不再新增 type:'in' 重复行，也不直接写 d.status='在用'，最后统一走 unifyDevStatus 回写
    var devId=v('f_dev'); if(!devId){ toast('请选择要归还的设备'); return false; }
    var d=devById(devId); if(!d){ toast('设备不存在'); return false; }
    if(!isOutByFlow(devId)){ toast('该设备当前没有未归还的出库登记，无需归还'); return false; }
    var openOut=null;
    for(var i=0;i<DB.flows.length;i++){ var f=DB.flows[i]; if(f.devId===devId && f.type==='out' && f.ret!=='已归还'){ openOut=f; break; } }
    if(!openOut){ toast('未找到该设备的未归还出库记录'); return false; }
    openOut.ret='已归还';
    openOut.returnPerson=(v('f_person')||'').trim();
    openOut.returnDate=normDate(v('f_time'))||today();
    openOut.remark=v('f_remark2')||openOut.remark||'';
    unifyDevStatus(devId);
    save(); render(); toast('归还登记成功，设备状态已按流水回写为「在用」');
    return true;
  } else {
    var devId=v('f_dev'); if(!devId){ toast('请选择要出库的设备'); return false; }
    var d=devById(devId); if(!d){ toast('设备不存在'); return false; }
    if(activeBorrowOf(devId)){ toast('该设备当前在借用中，请先在「设备借用登记」归还，再登记出库'); return false; }
    if(isOutByFlow(devId)){ toast('该设备已有未归还的出库登记，不可重复出库'); return false; }
    if(d.status!=='在用' && d.status!=='闲置'){ toast('仅「在用 / 闲置」设备可登记出库；当前为「'+d.status+'」状态，请先恢复'); return false; }
    DB.flows.unshift({id:uid('fl'),seed:false,type:'out',devId:devId,devCode:d.code,devName:d.name,qty:1,
      time: normDateTime(v('f_time'))||nowStr(),person:v('f_person'),dept:v('f_dept'),
      ret:'未归还',machineNo:d.machineNo||'',serial:d.serial||'',purpose:v('f_purpose'),remark:v('f_remark2')});
    unifyDevStatus(devId);
    save(); render(); toast('出库登记成功，设备已标记为「已出库」');
    return true;
  }
}

  var d = devById(f.devId) || {};
  openModal({

      + '<div class="grid-2">'
      + fld('归还人姓名 *','<input id="rret_person" placeholder="如：李老师 / 教务处" value="'+esc(f.returnPerson||'')+'">')
      + fld('归还日期 *','<input id="rret_date" type="date" value="'+esc(f.returnDate||today())+'">')
      + '</div>'

      + fld('管理人员（归还后）','<input id="rret_manager" placeholder="如：王老师" value="'+esc(d.manager||'')+'">')
      + fld('备注','<textarea id="rret_remark">'+esc(f.remark||'')+'</textarea>'),

function doFlowReturn(id){
  var person=v('rret_person'); if(!person || !person.trim()){ toast('请填写归还人姓名'); return false; }
  var date=normDate(v('rret_date'))||today();
  var remark=v('rret_remark')||'';
  var loc=(v('rret_loc')||'').trim();
  var manager=(v('rret_manager')||'').trim();
  var f = DB.flows.filter(function(x){return x.id===id;})[0];
  if(!f) return false;
  if(f.ret==='已归还'){ toast('该出库登记已登记归还，无需重复操作'); return false; }
  // 闭环原出库流水：标记已归还 + 记录归还人/日期/备注（账实状态唯一真源，不额外生成入库记录）
  f.ret='已归还';
  f.returnPerson=person.trim();
  f.returnDate=date;
  if(remark){ f.remark = remark; }
  // 按流水重新核算设备状态（兼容该设备仍有其他未归还出库的情形）
  unifyDevStatus(f.devId);
  // 同步更新设备存放位置 / 管理人员（如填写且与现不一致）
  var d=devById(f.devId);
  var changed=[];
  if(d){
    if(loc && loc!==(d.loc||'')){ d.loc=loc; changed.push('存放位置'); }
    if(manager && manager!==(d.manager||'')){ d.manager=manager; changed.push('管理人员'); }
  }
  save(); render(); toast('已登记归还（'+esc(person.trim())+' · '+date+'）'+(changed.length?'，已更新设备'+changed.join('/'):''));
  return true;
}

function rpSubmit(id){
  if(!v('r_dev')){ toast('请先在设备台账中新增设备'); return false; }
  if(!v('r_desc')){ toast('故障描述必填'); return false; }
  var obj={
    devId:v('r_dev'), time: normDateTime(v('r_time'))||nowStr(), reporter:v('r_reporter'),
    status:v('r_status')||'待处理', worker:v('r_worker'), cost:n('r_cost'), desc:v('r_desc'),
    result:v('r_result'), remark:v('r_remark')
  };
  if(id){
    var r = DB.repairs.filter(function(x){return x.id===id;})[0];
    var oldStatus = r.status;
    for(var k in obj) r[k]=obj[k];
    // 编辑保存时若工单状态发生变化，需同步闭环设备状态（与列表快捷改状态一致）
    if(obj.status!==oldStatus){
      var dEdit = devById(obj.devId);
      reconcileRepairDev(dEdit, oldStatus, obj.status, id);
    }
  }else{
    obj.id=uid('rp');
    DB.repairs.unshift(obj);
    // 新建工单时，仅当设备当前为「在用/闲置」才置为故障，避免误召回已出库/借用中的设备
    var d=devById(obj.devId);
    if(d && obj.status!=='已修复' && (d.status==='在用'||d.status==='闲置')){ d.status='故障'; }
  }
  save(); render(); toast(id?'工单已更新':'报修工单已创建，设备已标记故障');
  return true;
}
// 报修工单 → 设备状态联动（保证「编辑工单保存」与「列表快捷改状态」两条路径行为一致）
// 仅在工单状态真正变化时由调用方触发；newSt 为变更后的工单状态；selfId 为当前工单 id（用于排除自身判断其余工单）
function reconcileRepairDev(d, oldSt, newSt, selfId){
  if(!d) return;
  if(newSt==='已修复'){
    if(d.status==='故障'||d.status==='已损坏'){
      // 仅当该设备没有「其它」未闭环工单时才回退为「在用」，避免多工单场景被误标回可用
      var stillOpen = DB.repairs.some(function(x){
        return x.devId===d.id && x.id!==selfId && (x.status==='待处理'||x.status==='维修中');
      });
      if(!stillOpen) d.status='在用';
    }
  } else if(newSt==='报废'){
    d.status='报废';
  } else {
    // 待处理 / 维修中：仅当设备当前仍是在用/闲置（即尚未被修好投入使用），才重新置为故障，
    // 避免把「已修复后已投入使用」的设备误标回故障
    if(d.status==='在用'||d.status==='闲置') d.status='故障';
  }
}
function rpChangeStatus(id, st){
  var r = DB.repairs.filter(function(x){return x.id===id;})[0];
  if(!r || r.status===st) return;
  var old = r.status;
  var apply = function(){
    r.status = st;
    reconcileRepairDev(devById(r.devId), old, st, r.id);
    save(); render(); toast('工单状态已更新为「'+st+'」');
  };
  if(st==='报废') openConfirm('状态流转','标记为「报废」，同时把设备状态置为「报废」（资产销账，移出可用库存）。', apply, render);
  else apply();
}

/* ======================= 模块4：统计分析看板（内联 SVG / CSS 绘图） ======================= */
var PALETTE = ['#0d9488','#0891b2','#14b8a6','#0e7490','#22d3ee','#f59e0b','#ef4444','#8b5cf6','#64748b','#84cc16'];

function pieSVG(data){   // data: [{label, value}]
  var total = data.reduce(function(s,x){return s+x.value;},0);
  if(!total) return '<div class="empty">'+ICON.empty+'暂无数据</div>';
  var cx=100, cy=100, r=80, acc=0, paths='';
  if(data.length===1){
    paths = '<circle cx="100" cy="100" r="80" fill="'+(data[0].color||PALETTE[0])+'"></circle>';
  }else{
    data.forEach(function(x,i){
      var a0 = acc/total*360, a1 = (acc+x.value)/total*360; acc+=x.value;
      paths += '<path d="'+arcPath(cx,cy,r,a0,a1)+'" fill="'+(x.color||PALETTE[i%PALETTE.length])+'" stroke="#fff" stroke-width="1.5"></path>';
    });
  }
  var legend = data.map(function(x,i){
    var pct = (x.value/total*100).toFixed(1);
    return '<div><i style="background:'+(x.color||PALETTE[i%PALETTE.length])+'"></i>'+esc(x.label)+' <b>'+x.value+'</b> <span class="muted">'+pct+'%</span></div>';
  }).join('');
  return '<div class="pie-box">'
    + '<svg viewBox="0 0 200 200" style="width:180px;height:180px;flex:none">'+paths
    + '<circle cx="100" cy="100" r="42" fill="#fff"></circle>'
    + '<text x="100" y="95" text-anchor="middle" font-size="12" fill="#6b7280">总台数</text>'
    + '<text x="100" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">'+total+'</text>'
    + '</svg><div class="legend">'+legend+'</div></div>';
}
function arcPath(cx,cy,r,a0,a1){
  var p0=polar(cx,cy,r,a0), p1=polar(cx,cy,r,a1);
  var large = (a1-a0)>180 ? 1 : 0;
  return 'M '+cx+' '+cy+' L '+p0.x.toFixed(2)+' '+p0.y.toFixed(2)+' A '+r+' '+r+' 0 '+large+' 1 '+p1.x.toFixed(2)+' '+p1.y.toFixed(2)+' Z';
}
function polar(cx,cy,r,deg){ var a=(deg-90)*Math.PI/180; return {x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)}; }

function hBars(data){    // 纯 CSS 水平柱状图，长标签也能看清
  if(!data.length) return '<div class="empty">'+ICON.empty+'暂无数据</div>';
  var max = Math.max.apply(null, data.map(function(x){return x.value;})) || 1;
  return data.map(function(x){
    var w = Math.max(2, x.value/max*100);
    return '<div class="bar-row"><div class="bar-top"><span>'+esc(x.label)+'</span><b>'+x.value+' 台</b></div>'
         + '<div class="bar-bg"><div class="bar-fill" style="width:'+w+'%"></div></div></div>';
  }).join('');
}
function vBarSVG(data){  // 内联 SVG 竖直柱状图（工单状态）
  var max = Math.max.apply(null, data.map(function(x){return x.value;})) || 1;
  var W=340, H=200, pad=30, bw=44, gap=(W-pad*2-bw*data.length)/(data.length+1);
  var bars='';
  data.forEach(function(x,i){
    var h = x.value/max*(H-70);
    var bx = pad+gap*(i+1)+bw*i, by = H-34-h;
    bars += '<rect x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+bw+'" height="'+Math.max(h,1).toFixed(1)+'" rx="5" fill="'+x.color+'"></rect>'
         +  '<text x="'+(bx+bw/2).toFixed(1)+'" y="'+(by-7).toFixed(1)+'" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">'+x.value+'</text>'
         +  '<text x="'+(bx+bw/2).toFixed(1)+'" y="'+(H-14)+'" text-anchor="middle" font-size="12" fill="#6b7280">'+esc(x.label)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:420px;height:auto">'
    + '<line x1="'+pad+'" y1="'+(H-34)+'" x2="'+(W-pad+10)+'" y2="'+(H-34)+'" stroke="#e5e7eb"></line>'
    + bars + '</svg>';
}
function renderDash(){
  var devs = DB.devices;
  var byCat={}, byLoc={};
  devs.forEach(function(d){
    byCat[d.cat||'未分类'] = (byCat[d.cat||'未分类']||0) + 1;

function importFromObject(obj){
  if(!obj || (!obj.devices && !obj.flows && !obj.repairs && !obj.borrows)){ toast('文件格式不正确，缺少设备/流水/工单/借用数据'); return; }
  var c = (obj.devices||[]).length + (obj.flows||[]).length + (obj.repairs||[]).length + (obj.borrows||[]).length;
  openModal({
    title:'导入数据', narrow:true, okText:'覆盖导入',
    body:'<div style="line-height:1.8">备份文件包含：<br>设备 <b>'+(obj.devices||[]).length+'</b> 条 / 出入库 <b>'+(obj.flows||[]).length+'</b> 条 / 工单 <b>'+(obj.repairs||[]).length+'</b> 条 / 借用 <b>'+(obj.borrows||[]).length+'</b> 条，共 '+c+' 条。<br><br>'
      + '<span style="color:var(--danger)">覆盖导入会替换当前全部数据</span>，也可以选择「追加合并」保留现有数据。</div>'
      + '<div style="margin-top:12px"><button class="btn btn-line btn-sm" id="mergeBtn">追加合并（不删除现有数据）</button></div>',
    onOk:function(){
      DB = { devices:obj.devices||[], flows:obj.flows||[], repairs:obj.repairs||[], borrows:obj.borrows||[], meta:obj.meta||{} };
      normalizeDates(DB);
      relinkOrphans();
      recalcAllDevStatus();
      reconcileAllRepairDev();
      save(); render(); toast('已覆盖导入 '+c+' 条数据');
    }
  });
  $('mergeBtn').onclick = function(){
    var add=0;
    ['devices','flows','repairs','borrows'].forEach(function(k){
      var ids={};
      DB[k].forEach(function(x){ ids[x.id]=1; });
      (obj[k]||[]).forEach(function(x){ if(x.id && !ids[x.id]){ DB[k].push(x); ids[x.id]=1; add++; } });
    });
    normalizeDates(DB);
    relinkOrphans();
    recalcAllDevStatus();
    reconcileAllRepairDev();
    save(); closeModal(); render(); toast('已追加合并 '+add+' 条新数据');
  };
}
function recalcAllDevStatus(){
  DB.devices.forEach(function(d){ recalcDevStatus(d.id); });
}
/* 导入后按「维修工单」对账设备状态（与界面 reconcileRepairDev 同样的口径）：
   报废工单→报废（资产销账，最高优先）；有待处理/维修中→在用/闲置置故障；
   无未闭环工单但存在已修复工单→故障/已损坏回退在用。已出库由流水账实重算负责，此处不覆盖。 */
function reconcileAllRepairDev(){
  DB.devices.forEach(function(d){
    if(d.status==='已出库') return;
    if(DB.repairs.some(function(x){ return x.devId===d.id && x.status==='报废'; })){ d.status='报废'; return; }
    if(DB.repairs.some(function(x){ return x.devId===d.id && (x.status==='待处理'||x.status==='维修中'); })){
      if(d.status==='在用'||d.status==='闲置') d.status='故障';
      return;
    }
    if(DB.repairs.some(function(x){ return x.devId===d.id && x.status==='已修复'; })){
      if(d.status==='故障'||d.status==='已损坏') d.status='在用';
    }
  });
}
function doImport(file){
  var fr = new FileReader();
  fr.onload = function(){
    var obj;
    try{ obj = JSON.parse(fr.result); }
    catch(e){ toast('文件解析失败：不是有效的 JSON 备份（.json / .txt 内容均需为 JSON）'); return; }
    importFromObject(obj);
  };
  fr.readAsText(file, 'utf-8');
}

function csvNum(v){ var x=parseFloat(v); return isNaN(x)?0:x; }
function downloadCSV(name, headers, rows){
  var lines=[headers.join(',')];
  rows.forEach(function(r){ lines.push(r.map(csvCell).join(',')); });
  var blob=new Blob(['﻿'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;

}

function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1); // 去 UTF-8 BOM
  var rows=[], row=[], field='', q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else q=false; }
      else field+=c;
    } else {
      if(c==='"') q=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\r'){ /* skip */ }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.length>1 || (r.length===1 && r[0].trim()!==''); });
}
function detectCSVType(head){
  var h=head.join('|');
  if(h.indexOf('预计归还')>=0||h.indexOf('借用人')>=0) return 'borrows';
  if(h.indexOf('报修时间')>=0||h.indexOf('故障描述')>=0||h.indexOf('维修状态')>=0) return 'repairs';
  if(h.indexOf('经办人')>=0||h.indexOf('领用部门')>=0||h.indexOf('归还状态')>=0||h.indexOf('入库')>=0||h.indexOf('出库')>=0) return 'flows';
  if(h.indexOf('使用状态')>=0||h.indexOf('资产编号')>=0||h.indexOf('质保到期')>=0) return 'devices';
  return null;
}
function doImportCSV(file, forceType){
  var fr=new FileReader();
  fr.onload=function(){
    var rows=parseCSV(fr.result||'');
    if(rows.length<2){ toast('CSV 内容为空或只有表头'); return; }
    var head=rows[0].map(function(h){ return h.trim(); });
    var type=forceType||detectCSVType(head);
    if(!type){ toast('无法识别该 CSV 类型：请使用本工具导出的格式（表头含「资产编号/使用状态」或「经办人/归还状态」或「报修时间」）'); return; }
    var map=CSV_MAP[type], idx={};
    head.forEach(function(h,i){ if(map[h]!=null) idx[map[h]]=i; });
    var dm=devMap(), added=0, skipped=0;
    if(type==='devices'){
      var seen={}; DB.devices.forEach(function(d){ seen[d.code]=1; });
      rows.slice(1).forEach(function(r){
        var code=(r[idx.code]||'').trim();
        if(!code||seen[code]){ skipped++; return; }
        seen[code]=1;
        DB.devices.push({id:uid('dev'),seed:false,name:r[idx.name]||'',model:r[idx.model]||'',code:code,cat:r[idx.cat]||'',loc:r[idx.loc]||'',status:(r[idx.status]||'在用'),manager:r[idx.manager]||'',dept:r[idx.dept]||'',machineNo:r[idx.machineNo]||'',serial:r[idx.serial]||'',buyDate:normDate(r[idx.buyDate]||''),warranty:normDate(r[idx.warranty]||''),supplier:r[idx.supplier]||'',remark:r[idx.remark]||''});
        added++;
      });
      relinkOrphans(); // 新导入的设备可能补齐此前 CSV 导入的 orphan 流水/工单/借用
    } else if(type==='flows'){
      var _touched={};
      rows.slice(1).forEach(function(r){
        var dc=(r[idx.devCode]||'').trim(), dn=(r[idx.devName]||'').trim(), devId='';
        for(var k in dm){ if(dm[k].code===dc){ devId=k; break; } }
        var tp=(r[idx.type]||'').indexOf('出')>=0?'out':'in';
        DB.flows.push({id:uid('fl'),seed:false,type:tp,devId:devId,devCode:dc,devName:dn,qty:csvNum(r[idx.qty]),time:normDateTime(r[idx.time]||''),person:r[idx.person]||'',dept:r[idx.dept]||'',source:r[idx.source]||'',ret:r[idx.ret]||'',returnPerson:r[idx.returnPerson]||'',returnDate:normDate(r[idx.returnDate]||''),machineNo:r[idx.machineNo]||'',serial:r[idx.serial]||'',purpose:r[idx.purpose]||'',remark:r[idx.remark]||''});
        if(devId) _touched[devId]=1;
        added++;
      });
      // CSV 内的「入库(归还)」流水需回写设备状态，保证账实一致（与界面「登记归还」一致）
      for(var _td in _touched){ recalcDevStatus(_td); }
    } else if(type==='repairs'){
      var seenId={}; DB.repairs.forEach(function(x){ seenId[x.id]=1; });
      rows.slice(1).forEach(function(r){
        var rid=(r[idx.id]||'').trim();
        if(seenId[rid]){ skipped++; return; }
        if(rid) seenId[rid]=1; else rid=uid('rp');
        var dc=(r[idx.devCode]||'').trim(), dn=(r[idx.devName]||'').trim(), devId='';
        for(var k in dm){ if(dm[k].code===dc){ devId=k; break; } }
        DB.repairs.push({id:rid,seed:false,devId:devId,devCode:dc,devName:dn,time:normDateTime(r[idx.time]||''),desc:r[idx.desc]||'',reporter:r[idx.reporter]||'',status:r[idx.status]||'待处理',worker:r[idx.worker]||'',result:r[idx.result]||'',cost:csvNum(r[idx.cost]),remark:r[idx.remark]||''});
        added++;
      });
      // 导入工单后按工单状态对账设备（与界面报修闭环一致：有待处理/维修中→故障）
      reconcileAllRepairDev();
    } else if(type==='borrows'){
      rows.slice(1).forEach(function(r){
        var dc=(r[idx.devCode]||'').trim(), dn=(r[idx.devName]||'').trim(), devId='';
        for(var k in dm){ if(dm[k].code===dc){ devId=k; break; } }
        DB.borrows.push({id:uid('br'),seed:false,devId:devId,devCode:dc,devName:dn,person:r[idx.person]||'',dept:r[idx.dept]||'',outDate:normDate(r[idx.outDate]||''),expectDate:normDate(r[idx.expectDate]||''),inDate:normDate(r[idx.inDate]||''),purpose:r[idx.purpose]||'',remark:r[idx.remark]||''});
        added++;
      });
    }
    if(added===0){ toast('导入完成：'+skipped+' 行因编号重复/缺失被跳过，无新增'); save(); render(); return; }
    openModal({ title:'导入 CSV 确认', narrow:true, okText:'确认追加',
      body:'识别为【'+TYPE_NAME[type]+'】数据，将<b>追加</b>到当前工作台：<br><br>新增 <b>'+added+'</b> 条'
        +(skipped?('，跳过 <b>'+skipped+'</b> 条（编号重复/缺失）'):'')
        +'<br><br><span style="color:var(--muted)">CSV 导入为追加模式，不会删除现有数据；如需整体替换请用「导入数据文件(JSON)」。</span>',
      onOk:function(){ save(); render(); toast('已追加导入 '+added+' 条（'+TYPE_NAME[type]+'）'); } });
  };
  fr.readAsText(file, 'utf-8');
}

/* 管理密码验证弹窗：删除出入库/借用流水时调用，输入正确才执行回调 */
function askAdminPwd(onPass, title){
  openModal({
    title: title||'管理密码验证', narrow:true, danger:true, okText:'确认删除',
    body:'<div style="margin-bottom:10px">该删除操作不可恢复，请输入管理密码以继续：</div>'
      + '<input id="pwdInput" type="password" class="inp" placeholder="请输入管理密码" style="font-size:16px;width:100%">'
      + '<div id="pwdHint" class="muted" style="margin-top:6px;color:#dc2626;min-height:18px"></div>',
    onOk:function(){
      if(v('pwdInput')!==ADMIN_PWD){ var h=$('pwdHint'); if(h) h.textContent='管理密码错误，已取消本次删除'; var el=$('pwdInput'); if(el) el.focus(); return false; }
      onPass&&onPass();
      return true;
    }
  });
  setTimeout(function(){ var el=$('pwdInput'); if(el) el.focus(); }, 60);
}
function flowDelPwd(id){
  var f = DB.flows.filter(function(x){return x.id===id;})[0];
  if(!f) return;
  askAdminPwd(function(){
    var _dev = f.devId;
    DB.flows = DB.flows.filter(function(x){return x.id!==id;});
    unifyDevStatus(_dev);
    save(); closeModal(); render(); toast('出入库记录已删除，设备状态已按流水重新核算');
  }, '删除出入库记录');
}
function borrowDelPwd(id){
  var b = DB.borrows.filter(function(x){return x.id===id;})[0];
  if(!b) return;
  askAdminPwd(function(){
    DB.borrows = DB.borrows.filter(function(x){return x.id!==id;});
    save(); closeModal(); render(); toast('借用记录已删除');
  }, '删除借用记录');
}
function wipeAll(){
  var total = DB.devices.length + DB.flows.length + DB.repairs.length + DB.borrows.length;
  if(total===0){
    openConfirm('清空全部数据', '当前没有任何数据，确认清空？', function(){
      DB = { devices:[], flows:[], repairs:[], borrows:[], meta:{createdAt:nowStr(), tipAt:0} };
      save(); render(); toast('全部数据已清空');
    });
    return;
  }
  openModal({
    title:'清空全部数据（需先备份）', danger:true, okText:'确认清空',
    body:'<div style="line-height:1.7">'
      +'<p style="margin:0 0 8px">将删除本机保存的<b>全部</b>数据（设备台账、出入库流水、维修工单、借用记录），<span style="color:var(--danger)">清空后无法恢复</span>。</p>'
      +'<p style="margin:0 0 10px">为防止误删或清理浏览器导致数据<b>永久丢失</b>，系统要求清空前<b>必须先备一份</b>：</p>'
      +'<div style="margin:0 0 12px"><button class="btn btn-primary" id="wipeBackupBtn" type="button">① 导出备份 (JSON)</button>'
      +'<span id="wipeBackupState" class="muted" style="margin-left:10px" data-done="0">尚未备份</span></div>'
      +'<label style="display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14px"><input type="checkbox" id="wipeSkip"> 我已单独备份过，可跳过导出</label>'
      +'<input type="text" id="wipeType" class="inp" placeholder=\'请输入「确认清空」四个字\' style="font-size:16px;width:100%">'
      +'</div>',
    onOk:function(){
      var skip = $('wipeSkip') && $('wipeSkip').checked;
      var okBackup = $('wipeBackupState') && $('wipeBackupState').getAttribute('data-done')==='1';
      if(!skip && !okBackup){ toast('请先点「① 导出备份」，或勾选「我已单独备份过」'); return false; }
      if(($('wipeType').value||'').trim() !== '确认清空'){ toast('请在输入框输入「确认清空」四个字'); return false; }
      DB = { devices:[], flows:[], repairs:[], borrows:[], meta:{createdAt:nowStr(), tipAt:0} };
      save(); render(); toast('全部数据已清空');
    }
  });
  var bb = $('wipeBackupBtn');
  if(bb) bb.onclick = function(){
    // 直接触发下载，不调用 doExport()（doExport 会整体替换 modalHost，把当前清空弹窗本身抹掉）
    downloadBackup(JSON.stringify(DB, null, 2), 'json');
    var st = $('wipeBackupState');
    st.textContent = '✓ 已导出备份'; st.setAttribute('data-done','1'); st.style.color = 'var(--ok)';
    bb.disabled = true; bb.textContent = '① 已备份';
  };
}

/* ======================= IMA 知识库备份（由小台代存） ======================= */
/* 说明：IMA 接口不开放浏览器跨域，纯静态页无法直接调 IMA；故由已接入你 IMA 知识库的
   小台（WorkBuddy）代你中转：你导出 JSON 发我 → 我存入 IMA；恢复时我取回发你 → 你导入。
   手动 JSON 导出/导入始终可用。 */
function copyText(str){
  function fb(){
    var ta=document.createElement('textarea'); ta.value=str; ta.style.position='fixed'; ta.style.top='-9999px';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok=false; try{ ok=document.execCommand('copy'); }catch(e){ ok=false; } ta.remove(); return ok;
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(str).then(function(){ toast('已复制备份内容，发给小台即可存入 IMA'); },
      function(){ if(fb()) toast('已复制备份内容，发给小台即可存入 IMA'); else toast('复制失败，请手动选择文本复制'); });
  } else { if(fb()) toast('已复制备份内容，发给小台即可存入 IMA'); else toast('复制失败，请手动选择文本复制'); }
}
function imaBackup(){
  var json = JSON.stringify(DB, null, 2);
  var total = DB.devices.length + DB.flows.length + DB.repairs.length + DB.borrows.length;
  var safe = json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  openModal({
    title:'IMA 知识库 · 云端保险',
    okText:'关闭',
    body:'<div style="line-height:1.7">'
      +'<p style="margin:0 0 10px">把所有数据备份到你的 <b>IMA 知识库</b>（由已接入你 IMA 的小台代存）。换手机 / 清浏览器后，找我要回即可还原。当前共 <b>'+total+'</b> 条数据。</p>'
      +'<div style="font-size:13px;color:var(--muted);margin:0 0 6px"><b>① 备份到 IMA 云</b></div>'
      +'<textarea id="imaJson" readonly class="inp" style="width:100%;height:150px;font-family:monospace;font-size:12px">'+safe+'</textarea>'
      +'<div style="margin:8px 0 14px;display:flex;gap:8px;flex-wrap:wrap">'
      +'<button class="btn btn-primary" id="imaCopy" type="button">复制全部内容</button>'
      +'<button class="btn btn-line" id="imaDl" type="button">下载 .json</button>'
      +'</div>'
      +'<div style="font-size:13px;color:var(--muted);margin:0 0 6px"><b>② 从 IMA 云恢复</b>（把小台发给你的 JSON 粘贴到下面）</div>'
      +'<textarea id="imaPaste" class="inp" placeholder="在此粘贴小台从 IMA 取回的备份 JSON…" style="width:100%;height:110px;font-family:monospace;font-size:12px"></textarea>'
      +'<div style="margin-top:8px"><button class="btn btn-primary" id="imaRestore" type="button">从粘贴内容恢复</button></div>'
      +'<p class="muted" style="margin:12px 0 0">流程：点「复制全部内容」→ 发给我（小台）→ 我存入 IMA；恢复时对我喊「从 IMA 恢复」→ 我把 JSON 发回 → 粘贴到上方点恢复。</p>'
      +'</div>'
  });
  var copyBtn=$('imaCopy'); if(copyBtn) copyBtn.onclick=function(){ copyText(json); };
  var dlBtn=$('imaDl'); if(dlBtn) dlBtn.onclick=function(){ doExport(); };
  var rsBtn=$('imaRestore'); if(rsBtn) rsBtn.onclick=function(){
    var t=($('imaPaste').value||'').trim();
    if(!t){ toast('请先粘贴备份内容'); return; }
    var obj; try{ obj=JSON.parse(t); }catch(e){ toast('粘贴内容不是有效的 JSON'); return; }
    importFromObject(obj);
  };
}

function devSetStatus(id, st){
  var d = devById(id);
  if(!d){ return; }
  if(devStatusLocked(d)){ toast('该设备状态已锁定（借出 / 已出库 / 报修处理中），禁止手动修改，请先到对应的业务模块处理。'); renderLedger(); return; }
  if(st==='已出库'){
    if(!isOutByFlow(id)){ toast('未找到该设备「未归还」的出库（借领用）记录，不能手动设为「已出库」。请先在「出入库登记」中登记出库。'); renderLedger(); return; }
  }
  if(st==='借出' || st==='逾期'){
    if(!activeBorrowOf(id)){ toast('「借出/逾期」是借用派生状态，不能手动设置；请到「设备借用登记」登记借用。'); renderLedger(); return; }
  }
  d.status = st;
  save(); render(); toast('状态已更新为「'+st+'」');
}
/* 删除出入库流水后，依据剩余流水重新核算设备「已出库/在用」状态（统一转调 unifyDevStatus） */
function recalcDevStatus(devId){ unifyDevStatus(devId); }

/* ======================= 事件委托 ======================= */
document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!el) return;
  var act = el.getAttribute('data-act');
  var id = el.getAttribute('data-id');

  if(act==='go'){ PAGE = el.getAttribute('data-page'); render(); }
  else if(act==='export'){ doExport(); }
  else if(act==='import'){ $('fileInput').click(); }
  else if(act==='exportCsv'){ exportCSV(); }
  else if(act==='importCsv'){ $('csvInput').click(); }
  else if(act==='imaBackup'){ imaBackup(); }
  else if(act==='snaps'){ openSnaps(); }
  else if(act==='snapRestore'){ restoreSnapshot(parseInt(el.getAttribute('data-i'),10)); closeModal(); }
  else if(act==='snapDel'){ deleteSnapshot(parseInt(el.getAttribute('data-i'),10)); }
  else if(act==='snapClear'){ clearSnapshots(); }
  else if(act==='wipeAll'){ wipeAll(); }
  else if(act==='hideTip'){ DB.meta.tipHidden=true; save(); renderAlerts(); }
  else if(act==='closeModal'){ closeModal(); }
  else if(act==='toggleGroup'){ UI.group=!UI.group; renderLedger(); }
  else if(act==='resetFilter'){ UI.kw=''; UI.cat=''; UI.loc=''; renderLedger(); }
  else if(act==='devNew'){ openModal({title:'新增设备台账', body:devForm(), onOk:function(){ return devSubmit(null); }}); }
  else if(act==='devEdit'){ var d=devById(id); openModal({title:'编辑设备 · '+d.code, body:devForm(d), onOk:function(){ return devSubmit(id); }}); }
  else if(act==='devQuickAdd'){ devQuickSubmit(); }
  else if(act==='importCsvDevice'){ $('csvDeviceInput').click(); }
  else if(act==='exportDeviceCsv'){ exportOne('devices'); }
  else if(act==='devDel'){ openDeleteDeviceModal(id); }
  else if(act==='flowNew'){
    var tp = el.getAttribute('data-type');
    openModal({title: tp==='in'?'入库登记':'出库领用登记', body:flowForm(tp), onOk:function(){ return flowSubmit(tp); }});
  }
  else if(act==='flowReturn'){ flowReturn(id); }
  else if(act==='flowView'){ flowView(id); }
  else if(act==='flowEdit'){ flowEdit(id); }
  else if(act==='flowDelPwd'){ flowDelPwd(id); }
  else if(act==='expFlows'){ exportOne('flows'); }
  else if(act==='flowReport'){ viewFlowReport(); }
  else if(act==='flowReportCsv'){ exportFlowReport(); }
  else if(act==='expRepairs'){ exportOne('repairs'); }
  else if(act==='rpReport'){ viewRepairReport(); }
  else if(act==='rpReportCsv'){ exportRepairReport(); }
  else if(act==='rpNew'){ openModal({title:'新建报修工单', body:rpForm(), onOk:function(){ return rpSubmit(null); }}); }
  else if(act==='rpEdit'){
    var r=DB.repairs.filter(function(x){return x.id===id;})[0];
    openModal({title:'编辑工单', body:rpForm(r), onOk:function(){ return rpSubmit(id); }});
  }
  else if(act==='rpFilter'){ UI.repairFilter = el.getAttribute('data-s'); renderRepair(); }
  else if(act==='borrowNew'){ openModal({title:'新建借用登记', body:borrowForm(), onOk:function(){ return borrowSubmit(null); }}); }
  else if(act==='borrowEdit'){ var bb=DB.borrows.filter(function(x){return x.id===id;})[0]; openModal({title:'编辑借用记录', body:borrowForm(bb), onOk:function(){ return borrowSubmit(id); }}); }
  else if(act==='borrowReturn'){ borrowReturn(id); }
  else if(act==='borrowDelPwd'){ borrowDelPwd(id); }
  else if(act==='borrowFilter'){ UI.borrowFilter = el.getAttribute('data-s'); renderBorrow(); }
  else if(act==='borrowReport'){ viewBorrowReport(); }
  else if(act==='borrowReportCsv'){ exportBorrowReport(); }
  else if(act==='expBorrows'){ exportOne('borrows'); }
});
document.addEventListener('change', function(e){
  var el=e.target;
  if(el.getAttribute && el.getAttribute('data-act')==='rpStatus'){
    rpChangeStatus(el.getAttribute('data-id'), el.value);
  }
});
$('fileInput').addEventListener('change', function(e){
  if(e.target.files && e.target.files[0]) doImport(e.target.files[0]);
  e.target.value='';
});
$('csvInput').addEventListener('change', function(e){
  if(e.target.files && e.target.files[0]) doImportCSV(e.target.files[0]);
  e.target.value='';
});
$('csvDeviceInput').addEventListener('change', function(e){
  if(e.target.files && e.target.files[0]) doImportCSV(e.target.files[0], 'devices');
  e.target.value='';
});

/* ======================= 启动 ======================= */
load();
render();

</script>
