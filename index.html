<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d9488">
<title>学校留存周转设备-管理工作台</title>
<style>
/* ============ 全局变量与基础样式（全部内联，无任何外部依赖） ============ */
:root{
  --primary:#0d9488;        /* 主色 蓝绿 */
  --primary-d:#0f766e;
  --primary-l:#e8fbf7;
  --accent:#0891b2;         /* 辅助 青蓝 */
  --danger:#dc2626;         /* 警告红 */
  --danger-bg:#fef2f2;
  --warn:#ea580c;           /* 提醒橙 */
  --warn-bg:#fff7ed;
  --ok:#16a34a;
  --bg:#f5f7f8;             /* 背景浅灰 */
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --line:#e6eaec;
  --radius:12px;
  --nav-w:216px;
  --nav-w-sm:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;
}
h1,h2,h3,h4{margin:0;font-weight:600}
a{color:var(--primary);text-decoration:none}

/* ============ 左侧固定导航 ============ */
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:var(--nav-w);
  background:#ffffff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:40;
  padding-bottom:env(safe-area-inset-bottom);
}
.brand{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid var(--line)}
.brand .logo{width:34px;height:34px;flex:none;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center}
.brand .tit{font-size:14px;font-weight:700;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--muted)}
.nav{flex:1;overflow-y:auto;padding:10px 8px}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;
  color:#374151;font-size:14px;text-align:left;cursor:pointer;
  padding:11px 10px;border-radius:10px;margin-bottom:4px;min-height:46px;font-family:inherit;
}
.nav-item:hover{background:#f1f5f5}
.nav-item.active{background:var(--primary-l);color:var(--primary-d);font-weight:600}
.nav-item.active svg{stroke:var(--primary-d)}
.nav-item svg{width:20px;height:20px;flex:none;stroke:#6b7280;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;border-radius:9px;padding:1px 6px;min-width:18px;text-align:center}
.nav-foot{padding:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.nav-foot button{width:100%;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:9px;padding:9px;font-size:12px;cursor:pointer;font-family:inherit;min-height:40px}
.nav-foot button:hover{color:var(--danger);border-color:#fecaca}
/* 左侧日历：借出/出库日期视图 */
.side-cal{margin:4px 8px 10px;padding:10px 9px 11px;border:1px solid var(--line);border-radius:12px;background:#fbfdfd}
.side-cal .sc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.side-cal .sc-title{font-size:13px;font-weight:700;color:var(--ink)}
.side-cal .sc-nav{display:flex;gap:5px}
.side-cal .sc-nav button{width:26px;height:26px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;font-family:inherit}
.side-cal .sc-nav button:hover{color:var(--primary-d);border-color:var(--primary)}
.side-cal .sc-wk{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px}
.side-cal .sc-wk span{font-size:10px;text-align:center;color:var(--muted);padding:2px 0}
.side-cal .sc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.side-cal .sc-cell{position:relative;aspect-ratio:1/1;min-height:25px;border:0;background:transparent;border-radius:7px;font-size:12px;color:#374151;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;padding:0}
.side-cal .sc-cell:hover{background:#eef6f5}
.side-cal .sc-cell.muted{color:#cbd5e1;cursor:default}
.side-cal .sc-cell.muted:hover{background:transparent}
.side-cal .sc-cell.today{background:var(--primary-l);color:var(--primary-d);font-weight:700}
.side-cal .sc-dots{position:absolute;bottom:2px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.side-cal .sc-dots i{display:inline-block;width:6px;height:6px;border-radius:50%}
.side-cal .d-out{background:#dc2626}
.side-cal .d-bw{background:#f59e0b}
.side-cal .sc-legend{display:flex;gap:12px;margin-top:8px;font-size:10px;color:var(--muted);align-items:center}
.side-cal .sc-legend i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px;vertical-align:middle}
/* 弹窗中日历放大，避免沿用侧边栏小尺寸 */
.modal-bd .side-cal{margin:0;padding:14px 12px 16px;background:#f9fbfc;border-radius:12px}
.modal-bd .side-cal .sc-title{font-size:16px}
.modal-bd .side-cal .sc-wk span{font-size:12px;padding:4px 0}
.modal-bd .side-cal .sc-cell{font-size:15px;min-height:42px;border-radius:9px}
.modal-bd .side-cal .sc-dots{bottom:5px;gap:4px}
.modal-bd .side-cal .sc-dots i{width:8px;height:8px}
.modal-bd .side-cal .sc-legend{margin-top:14px;font-size:13px;gap:18px}
.modal-bd .side-cal .sc-legend i{width:10px;height:10px}
.modal-bd .side-cal .sc-nav button{width:32px;height:32px}
/* 手机端：弹窗已移除，把左下角小日历移入主区顶部显示，避免手机端看不到日历 */
.side-cal.cal-mobile{display:none;margin:10px 12px}
.cal-row{margin:5px 0;font-size:13px;line-height:1.5}

/* ============ 右侧主区 ============ */
.main{margin-left:var(--nav-w);min-height:100vh;display:flex;flex-direction:column}
.header{position:relative;overflow:hidden;background:linear-gradient(120deg,#0d9488 0%,#0e7490 100%);color:#fff;padding:18px 20px}
.header .hd-bg{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.header .hd-in{position:relative;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.header h1{font-size:18px;letter-spacing:.5px}
.header p{margin:2px 0 0;font-size:12px;opacity:.85}
.hd-actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{
  border:0;border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:6px;min-height:40px;white-space:nowrap;transition:.15s;
}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn-ghost{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn-ghost:hover{background:rgba(255,255,255,.28)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-d)}
.btn-line{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn-line:hover{border-color:var(--primary);color:var(--primary-d)}
.btn-danger{background:var(--danger);color:#fff}
.btn-warn{background:var(--warn);color:#fff}
.btn-sm{padding:6px 10px;font-size:12px;min-height:34px;border-radius:8px}

/* ============ 全局提醒栏 ============ */
.alerts{padding:12px 20px 0}
.fsa-bar{padding:10px 16px;margin:12px 20px 0;border-radius:12px;font-size:13px;line-height:1.6;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fsa-bar.fsa-on{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
.fsa-bar.fsa-off{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.fsa-bar.fsa-unsupported{background:#f3f4f6;border:1px solid #e5e7eb;color:#4b5563}
.fsa-bar .btn{margin-left:auto}
.alert{
  border-radius:var(--radius);padding:11px 14px;margin-bottom:10px;font-size:13px;
  display:flex;gap:10px;align-items:flex-start;
}
.alert svg{width:18px;height:18px;flex:none;margin-top:1px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.alert-danger{background:var(--danger-bg);border:1px solid #fecaca;color:#991b1b}
.alert-warn{background:var(--warn-bg);border:1px solid #fed7aa;color:#9a3412}
.alert-tip{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.alert b{font-weight:700}
.alert .chip{display:inline-block;background:#fff;border-radius:7px;padding:1px 7px;margin:2px 4px 0 0;font-size:12px;border:1px solid currentColor;opacity:.95}
.alert .close{margin-left:auto;background:transparent;border:0;color:inherit;cursor:pointer;font-size:18px;line-height:1;padding:0 4px}

/* ============ 内容区 ============ */
.view{padding:14px 20px 40px;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.card-hd{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line)}
.card-hd h2{font-size:15px;display:flex;align-items:center;gap:8px}
.card-hd h2::before{content:"";width:4px;height:15px;background:var(--primary);border-radius:2px;display:inline-block}
.card-bd{padding:14px 16px}
.muted{color:var(--muted);font-size:12px}

/* 工具条 */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type=text],.toolbar select{min-width:150px}
input,select,textarea{
  font-family:inherit;font-size:16px;/* 16px 防止 iOS 自动缩放 */
  padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);
  width:100%;min-height:42px;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-l);border-color:var(--primary)}
textarea{min-height:70px;resize:vertical}
label.fl{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}

/* 表格：PC 表格 / 手机卡片 */
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:#f8fafa;color:var(--muted);font-weight:600;text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
tbody td{padding:10px;border-bottom:1px solid #f0f3f4;vertical-align:middle}
tbody tr:hover{background:#fafcfc}
tr.row-danger{background:var(--danger-bg)}
tr.row-danger:hover{background:#fde8e8}
tr.row-warn{background:var(--warn-bg)}
tr.row-warn:hover{background:#ffedd5}
.cellsub{font-size:11px;color:var(--muted);display:block}
.acts{display:flex;flex-wrap:wrap;gap:6px}

/* 徽章 */
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;line-height:18px;white-space:nowrap}
.tag-gray{background:#f1f5f5;color:#4b5563}
.tag-teal{background:var(--primary-l);color:var(--primary-d)}
.tag-red{background:#fee2e2;color:#b91c1c}
.tag-orange{background:#ffedd5;color:#9a3412}
.tag-green{background:#dcfce7;color:#15803d}
.tag-blue{background:#e0f2fe;color:#0369a1}
.tag-dark{background:#334155;color:#fff}
.tag-scrap{background:#ede9fe;color:#6d28d9}
.qty{display:inline-flex;gap:4px;flex-wrap:wrap}

/* 指标卡片 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.kpi .k-t{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .k-v{font-size:28px;font-weight:700;margin-top:6px;line-height:1.1}
.kpi .k-u{font-size:12px;font-weight:400;color:var(--muted);margin-left:3px}
.kpi.k-red .k-v{color:var(--danger)}
.kpi.k-orange .k-v{color:var(--warn)}
.kpi.k-teal .k-v{color:var(--primary-d)}
.kpi.k-gray .k-v{color:#475569}
.kpi.k-dark .k-v{color:#334155}
.kpi.k-scrap .k-v{color:#6d28d9}

/* 图表 */
.chart-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;min-width:130px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px}
.pie-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bar-row{margin-bottom:10px}
.bar-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.bar-bg{height:14px;background:#f1f5f5;border-radius:7px;overflow:hidden}
.bar-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .4s}

/* 分组 */
.group-tit{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--primary-d);background:var(--primary-l);padding:8px 12px;border-radius:9px;margin:14px 0 8px}
.group-tit:first-child{margin-top:0}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:720px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal.narrow{max-width:420px}
.modal-hd{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center;justify-content:space-between}
.modal-hd button{background:transparent;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.modal-bd{padding:16px;overflow-y:auto;flex:1}
.modal-ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;padding-bottom:calc(12px + env(safe-area-inset-bottom))}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:#111827;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:.95;bottom:38px}

.empty{text-align:center;color:var(--muted);padding:36px 10px;font-size:13px}
.empty svg{width:40px;height:40px;stroke:#cbd5e1;fill:none;stroke-width:1.5;display:block;margin:0 auto 8px}

/* ============ 台账总览：左侧列表 + 右侧设备资产登记 ============ */
.ledger-wrap{display:flex;gap:14px;align-items:flex-start;margin-top:14px}
.ledger-main{flex:1;min-width:0}
.ledger-side{width:340px;flex:none;position:sticky;top:14px}
.reg-tip{font-size:12px;color:var(--primary-d);background:var(--primary-l);border-radius:9px;padding:9px 11px;margin-bottom:12px;line-height:1.6}
.reg-stat{display:flex;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.reg-stat .s{flex:1;min-width:92px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 6px;background:#fff}
.reg-stat .s b{display:block;font-size:22px;color:var(--primary-d);line-height:1.2}
.reg-stat .s span{font-size:11px;color:var(--muted)}
.reg-form .grid-2{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.reg-actions{display:flex;flex-direction:column;gap:9px}
@media (max-width:1100px){
  .ledger-wrap{flex-direction:column}
  .ledger-side{width:100%;position:static;order:-1}
}

/* ============ 响应式：手机端导航收缩为图标，按钮加大 ============ */
@media (max-width:900px){
  .sidebar{width:var(--nav-w-sm)}
  .main{margin-left:var(--nav-w-sm)}
  .side-cal{display:none}
  .main .cal-mobile{display:block!important}
  .cal-mobile .sc-nav{width:100%;justify-content:space-between;margin:8px 0 2px}
  .cal-mobile .sc-nav button{width:auto;min-width:118px;height:44px;font-size:19px;padding:0 16px}
  .cal-mobile .sc-cell{font-size:14px;min-height:38px}
  .cal-mobile .sc-legend{font-size:12px;gap:16px}
  .nav-label,.brand .txt,.nav-foot .t{display:none}
  .brand{justify-content:center;padding:14px 6px}
  .nav-item{justify-content:center;padding:12px 6px;min-height:52px}
  .nav-item svg{width:23px;height:23px}
  .nav-badge{position:absolute;margin:0;transform:translate(14px,-14px)}
  .nav-item{position:relative}
  .nav-foot button{font-size:11px;padding:8px 2px}
}
@media (max-width:760px){
  .view{padding:12px 12px 44px}
  .alerts{padding:10px 12px 0}
  .fsa-bar{padding:9px 12px;margin:10px 12px 0}
  .header{padding:14px 12px}
  .btn{padding:11px 14px;font-size:14px;min-height:46px}   /* 手机端按钮加大 */
  .btn-sm{padding:9px 12px;font-size:13px;min-height:42px}
  .hd-actions{width:100%}
  .hd-actions .btn{flex:1;justify-content:center}
  .kpi .k-v{font-size:24px}
  /* 表格转卡片 */
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tbody tr{border:1px solid var(--line);border-radius:11px;margin-bottom:10px;padding:6px 4px;background:#fff}
  tbody tr.row-danger{background:var(--danger-bg)}
  tbody tr.row-warn{background:var(--warn-bg)}
  tbody td{border:0;padding:7px 12px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
  tbody td::before{content:attr(data-label);color:var(--muted);font-size:12px;flex:none;min-width:74px}
  tbody td>*{text-align:right}
  .acts{justify-content:flex-end}
}
@media print{.sidebar,.hd-actions{display:none}.main{margin:0}}
</style>

<body>

<!-- ============ 左侧导航 ============ -->
<aside class="sidebar">
  <div class="brand">
    <span class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="13" rx="2"></rect><path d="M8 21h8M12 16v5"></path>
      </svg>
    </span>
    <span class="txt">
      <span class="tit">学校留存周转设备</span><br>
      <span class="sub">School IT Asset</span>
    </span>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="side-cal" id="sideCal"></div>
  <div class="nav-foot">
    <button type="button" data-act="wipeAll" title="清空全部数据">
      <span class="t">清空全部数据</span><span style="display:none">清空</span>
    </button>
  </div>
</aside>

<!-- ============ 右侧主区 ============ -->
<div class="main">
  <header class="header">
    <!-- 克制简约的页头 SVG 背景 -->
    <svg class="hd-bg" viewBox="0 0 1200 160" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <rect width="1200" height="160" fill="url(#hg)"/>
      <g stroke="#ffffff" stroke-opacity="0.18" fill="none" stroke-width="1">
        <path d="M0 130 Q 300 60 600 110 T 1200 70"/>
        <path d="M0 150 Q 320 90 640 130 T 1200 100"/>
        <circle cx="1060" cy="46" r="42"/>
        <circle cx="1060" cy="46" r="66"/>
      </g>
      <g fill="#ffffff" fill-opacity="0.1">
        <rect x="900" y="104" width="42" height="6" rx="3"/>
        <rect x="950" y="104" width="18" height="6" rx="3"/>
      </g>
    </svg>

<script>
/* =========================================================================
   学校留存周转设备管理工作台 —— 全部逻辑内联，无任何外部依赖，断网可用
   本地运行版：在 Chrome / Edge 下点「启用本地文件存储」一次授权后，
   数据自动读写到网页同目录的 data.json（刷新/重开自动读回）；
   未启用 FSA 时回落到浏览器 localStorage 兜底。
   ========================================================================= */
'use strict';

var LS_KEY = 'wb_school_it_v1';
var BACKUP_TIP_STEP = 20;   // 数据每累计 20 条提醒一次导出备份
var WARRANTY_DAYS = 60;     // 距质保到期 60 天内视为"即将过保"
var ADMIN_PWD = 'ws012736';    // 管理密码：删除出入库/借用流水需此密码

/* 下拉选项常量 */
var CATS = ['智慧教室设备','机房电脑','办公电脑','笔记本电脑','服务器','录播设备','投影','交互大屏','网络交换机','摄像头','便携摄像机','打印机','音响功放','电子班牌','其他'];
var LOCS = ['教学楼4-13教室','教学楼4-15教室','教学楼4-17教室','教学楼4-19教室'];
var REPAIR_STATUS = ['待处理','维修中','已修复','报废'];
var STATUS_DEV = ['在用','闲置','故障','已损坏','已出库','报废'];  /* 设备自身基础状态仅6值；"借出/逾期"为派生状态，必须由"设备借用登记"的借用记录驱动，不允许在台账手动设置 */
function statusDevTag(s){
  var m={'在用':'tag-teal','闲置':'tag-blue','故障':'tag-red','已损坏':'tag-dark','已出库':'tag-gray','报废':'tag-scrap','借出':'tag-orange','逾期':'tag-red'};
  return '<span class="tag '+(m[s]||'tag-gray')+'">'+esc(s||'未设')+'</span>';
}
function cntStatus(s){ return DB.devices.filter(function(d){ return d.status===s; }).length; }
function inStock(){ return DB.devices.filter(function(d){ return d.status!=='已出库' && d.status!=='报废' && borrowDevIds().indexOf(d.id)<0; }).length; }
/* 在用数量：基础状态为"在用"且当前未被借出/逾期（派生状态设备不计入在用） */
function inUseCount(){ return DB.devices.filter(function(d){ return d.status==='在用' && borrowDevIds().indexOf(d.id)<0; }).length; }

/* 运行期状态 */
var DB = null;
var PAGE = 'ledger';
var UI = { kw:'', cat:'', loc:'', group:false, flowType:'in', repairFilter:'', borrowFilter:'' };

/* ---------------- 基础工具 ---------------- */
function $(id){ return document.getElementById(id); }
function uid(p){ return (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function today(){ var d=new Date(); return fmtDate(d); }
function fmtDate(d){
  var m=d.getMonth()+1, day=d.getDate();
  return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;
}
function nowStr(){
  var d=new Date(), h=d.getHours(), mi=d.getMinutes();
  return fmtDate(d)+' '+(h<10?'0':'')+h+':'+(mi<10?'0':'')+mi;
}
function daysTo(dateStr){ // 距今还有多少天（负数=已过期）
  if(!dateStr) return null;
  var t = new Date(dateStr+'T00:00:00').getTime();
  if(isNaN(t)) return null;
  var n = new Date(today()+'T00:00:00').getTime();
  return Math.round((t-n)/86400000);
}
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(function(){ t.classList.remove('show'); },2200);
}
function addDays(n){ var d=new Date(); d.setDate(d.getDate()+n); return fmtDate(d); }

/* ---------------- 存储 ---------------- */
function save(){
  try{ DB.meta = DB.meta || {}; DB.meta.savedAt = Date.now(); }catch(e){}
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); pushSnapshot(); }
  catch(e){ /* 浏览器缓存写入失败不致命（FSA 仍是主存档） */ }
  if(FSA.active && FSA.fileHandle){ fsaScheduleWrite(); }
}
function totalCount(){ return DB.devices.length + DB.flows.length + DB.repairs.length + DB.borrows.length; }
/* ---------------- 本地自动快照（防误删/误改，仅本浏览器） ---------------- */
var LS_SNAP = 'wb_device_snapshots';
var SNAP_MAX = 5;
var _lastSnapSig = '';
function snapSig(){
  var len = 0; try{ len = JSON.stringify(DB).length; }catch(e){ len = 0; }
  return DB.devices.length+'|'+DB.flows.length+'|'+DB.repairs.length+'|'+DB.borrows.length+'|'+len;
}
function pushSnapshot(){
  try{
    if(totalCount()===0) return;                 // 空数据不浪费快照
    var sig = snapSig();
    if(sig === _lastSnapSig) return;             // 数据未变化，避免重复快照
    var arr = [];
    try{ arr = JSON.parse(localStorage.getItem(LS_SNAP)||'[]'); }catch(e){ arr = []; }
    if(!Array.isArray(arr)) arr = [];
    if(arr.length && arr[arr.length-1].sig === sig){ _lastSnapSig = sig; return; }
    arr.push({ ts: nowStr(), sig: sig, data: JSON.parse(JSON.stringify(DB)) });
    if(arr.length > SNAP_MAX) arr = arr.slice(arr.length - SNAP_MAX);
    localStorage.setItem(LS_SNAP, JSON.stringify(arr));
    _lastSnapSig = sig;
  }catch(e){ /* 快照写入失败不影响主保存 */ }
}
function loadSnapshots(){ try{ var a=JSON.parse(localStorage.getItem(LS_SNAP)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function restoreSnapshot(i){
  var arr = loadSnapshots(); var s = arr[i]; if(!s) return;
  DB = { devices:s.data.devices||[], flows:s.data.flows||[], repairs:s.data.repairs||[], borrows:s.data.borrows||[], meta:s.data.meta||{} };
  _lastSnapSig=''; save(); render(); toast('已从 '+s.ts+' 的快照恢复');
}
function deleteSnapshot(i){ var arr=loadSnapshots(); arr.splice(i,1); localStorage.setItem(LS_SNAP, JSON.stringify(arr)); openSnaps(); }
function clearSnapshots(){ localStorage.removeItem(LS_SNAP); _lastSnapSig=''; openSnaps(); }
function openSnaps(){
  var arr = loadSnapshots();
  var html = '<div style="line-height:1.6">'
    + '<p class="muted" style="margin:0 0 10px">系统每次保存会自动留存最近 <b>'+SNAP_MAX+'</b> 份快照（仅本浏览器），用于误删/误改后恢复。快照<b>不会</b>随「清空全部数据」被删，是本地的第二层保险。</p>';
  if(!arr.length){ html += '<p style="margin:8px 0">暂无快照，录入或改动数据后会自动生成。</p>'; }
  else {
    html += '<div style="max-height:60vh;overflow:auto">';
    for(var i=arr.length-1;i>=0;i--){
      var s=arr[i]; var d=s.data||{};
      var cnt=((d.devices||[]).length+(d.flows||[]).length+(d.repairs||[]).length+(d.borrows||[]).length);
      html += '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)">'
        + '<div style="flex:1;min-width:0"><b>'+esc(s.ts)+'</b><br><span class="muted" style="font-size:12px">共 '+cnt+' 条数据</span></div>'
        + '<button class="btn btn-line btn-sm" data-act="snapRestore" data-i="'+i+'">恢复</button>'
        + '<button class="btn btn-ghost btn-sm" data-act="snapDel" data-i="'+i+'">删除</button>'
        + '</div>';
    }
    html += '</div><div style="margin-top:12px"><button class="btn btn-ghost btn-sm" data-act="snapClear">清空所有快照</button></div>';
  }
  html += '</div>';
  openModal({ title:'本地快照恢复', okText:'关闭', body:html });
}
function load(){
  var raw = null;
  try{ raw = localStorage.getItem(LS_KEY); }catch(e){}
  if(raw){
    try{
      DB = JSON.parse(raw);
      DB.devices = DB.devices || []; DB.flows = DB.flows || []; DB.repairs = DB.repairs || []; DB.borrows = DB.borrows || [];
      DB.meta = DB.meta || {};
      migrate();
      return;
    }catch(e){ /* 数据损坏则重建 */ }
  }
  DB = seed();
  save();
}
function migrate(){
  DB.devices.forEach(function(d){
    if(d.status===undefined || d.status===null || d.status==='') d.status='在用';
    // 设备自身状态枚举仅 6 个基础值；"借出/逾期"是派生状态（由借用记录计算），不属于设备自身状态。
    // 历史数据中若残留 status='借出'/'逾期'（或任何非法值），统一归为「在用」，其真实借用状态由 borrow 记录叠加显示。
    if(STATUS_DEV.indexOf(d.status)<0) d.status='在用';
    if(d.machineNo===undefined) d.machineNo='';
    if(d.serial===undefined) d.serial='';
    if(d.manager===undefined) d.manager='';
    if(d.dept===undefined) d.dept='';
  });
  DB.flows.forEach(function(f){
    if(f.devCode===undefined) f.devCode='';
    if(f.devName===undefined) f.devName='';
  });
  DB.borrows.forEach(function(b){
    if(b.inDate===undefined) b.inDate='';
    if(b.dept===undefined) b.dept='';
    if(b.purpose===undefined) b.purpose='';
    if(b.remark===undefined) b.remark='';
  });
}

/* ---------------- File System Access API 持久化（独立本地运行版） ----------------
   在 Chrome / Edge（Chromium 内核）下，首次点击「启用本地文件存储」授权目录后，
   会在 HTML 同目录自动创建 data.json；此后每次增删改都自动读/写该文件，
   刷新或重开页面会自动读回。一次授权、之后无感（目录句柄存 IndexedDB，下次免再次选择）。
--------------------------------------------------------------------------- */
var FSA = { active:false, dirHandle:null, fileHandle:null, fileName:'data.json' };
var fsaWriteChain = Promise.resolve();

function fsaSupported(){ return (typeof window.showDirectoryPicker === 'function'); }

/* IndexedDB：持久化目录句柄（Chrome 支持结构化克隆存储 FileSystemDirectoryHandle） */
var FSA_IDB='wb_school_fsa', FSA_STORE='dir', FSA_KEY='handle';
function fsaOpenDB(){
  return new Promise(function(res,rej){
    var r = indexedDB.open(FSA_IDB, 1);
    r.onupgradeneeded = function(){ var db=r.result; if(!db.objectStoreNames.contains(FSA_STORE)) db.createObjectStore(FSA_STORE); };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
function fsaPutHandle(h){
  return fsaOpenDB().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(FSA_STORE,'readwrite');
      tx.objectStore(FSA_STORE).put(h, FSA_KEY);
      tx.oncomplete=function(){ res(); };
      tx.onerror=function(){ rej(tx.error); };
    });
  });
}
function fsaGetHandle(){
  return fsaOpenDB().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(FSA_STORE,'readonly');
      var rq=tx.objectStore(FSA_STORE).get(FSA_KEY);
      rq.onsuccess=function(){ res(rq.result||null); };
      rq.onerror=function(){ rej(rq.error); };
    });
  });
}
async function fsaVerifyPermission(handle, readWrite){
  var opts={ writable:!!readWrite };
  try{ if((await handle.queryPermission(opts))==='granted') return true; }catch(e){}
  try{ if((await handle.requestPermission(opts))==='granted') return true; }catch(e){}
  return false;
}
async function fsaActivateFromHandle(handle){
  FSA.dirHandle = handle;
  FSA.active = true;
  try{ await fsaPutHandle(handle); }catch(e){ /* 句柄持久化失败不致命 */ }
  FSA.fileHandle = await FSA.dirHandle.getFileHandle(FSA.fileName, { create:true });
  var loaded = await fsaReadInto();
  if(!loaded){ await fsaWriteNow(); }   // 首次：把当前内存数据落盘
  save();                               // 镜像到 localStorage（非 Chromium 兜底）
  render();                             // 用文件数据刷新页面
  renderFsaBar();
  renderAlerts();
}
async function fsaReadInto(){
  try{
    var file = await FSA.fileHandle.getFile();
    if(file.size===0) return false;
    var txt = await file.text();
    var obj = JSON.parse(txt);
    if(!obj || typeof obj!=='object') return false;
    // 仅当 data.json 的保存时间不早于当前（localStorage）时才覆盖，避免「清空后旧文件被复活」
    if(DB.meta && DB.meta.savedAt && obj.meta && obj.meta.savedAt && obj.meta.savedAt < DB.meta.savedAt){ return false; }
    DB = { devices:obj.devices||[], flows:obj.flows||[], repairs:obj.repairs||[], borrows:obj.borrows||[], meta:obj.meta||{} };
    migrate();
    return true;
  }catch(e){ return false; }
}
function fsaWriteNow(){
  if(!FSA.fileHandle) return Promise.resolve();
  return FSA.fileHandle.createWritable().then(function(w){
    return w.write(JSON.stringify(DB, null, 2)).then(function(){ return w.close(); });
  });
}
function fsaScheduleWrite(){
  if(!FSA.active || !FSA.fileHandle) return;
  fsaWriteChain = fsaWriteChain.then(function(){ return fsaWriteNow(); }).catch(function(e){ console.warn('data.json 写入失败', e); });
}
function fsaFlush(){ fsaScheduleWrite(); return fsaWriteChain; }
async function fsaEnable(){
  if(!fsaSupported()){ toast('当前浏览器不支持本地文件存储，已使用浏览器内置存储'); return; }
  try{
    var h = await window.showDirectoryPicker({ mode:'readwrite' });
    var ok = await fsaVerifyPermission(h, true);
    if(!ok){ toast('未获得文件夹读写权限'); return; }
    await fsaActivateFromHandle(h);
    toast('已启用本地文件存储：数据自动保存到 data.json');
  }catch(e){
    if(e && e.name==='AbortError') return;   // 用户取消选择
    toast('启用失败：' + (e && e.message ? e.message : e));
  }
}
async function fsaRechoose(){
  if(!fsaSupported()){ toast('当前浏览器不支持本地文件存储'); return; }
  try{
    var h = await window.showDirectoryPicker({ mode:'readwrite' });
    var ok = await fsaVerifyPermission(h, true);
    if(!ok){ toast('未获得文件夹读写权限'); return; }
    await fsaActivateFromHandle(h);
    toast('已切换保存文件夹');
  }catch(e){
    if(!(e && e.name==='AbortError')) toast('切换失败：' + (e && e.message ? e.message : e));
  }
}
function renderFsaBar(){
  var bar = $('fsaBar'); if(!bar) return;
  if(!fsaSupported()){
    bar.className='fsa-bar fsa-unsupported';
    bar.innerHTML='本地文件存储：当前浏览器不支持（仅 Chrome / Edge 等 Chromium 内核可用）。已使用浏览器内置存储；如需 data.json 自动存档，请用 Chrome 或 Edge 打开本文件。';
    return;
  }
  if(FSA.active){
    bar.className='fsa-bar fsa-on';
    bar.innerHTML='✓ 本地文件存储已启用 · 数据自动保存到同目录 <b>'+esc(FSA.fileName)+'</b>（可随文件夹一起拷贝备份）'
      + '<button type="button" class="btn btn-line btn-sm" data-act="fsaRechoose">更换文件夹</button>';
  }else{
    bar.className='fsa-bar fsa-off';
    bar.innerHTML='<b>建议启用本地文件存储</b>：一次授权后，所有增删改自动读写同目录 <b>data.json</b>，刷新/重开自动读回，并可随文件夹整体拷贝备份。'
      + '<button type="button" class="btn btn-primary btn-sm" data-act="fsaEnable">启用本地文件存储</button>';
  }
}
/* 启动时尝试无感恢复已授权目录（一次授权后免再次选择） */
async function fsaAutoRestore(){
  if(!fsaSupported()){ renderFsaBar(); return; }
  try{
    var h = await fsaGetHandle();
    if(h){
      var ok = await fsaVerifyPermission(h, true);
      if(ok){ await fsaActivateFromHandle(h); return; }
    }
  }catch(e){ /* 忽略，回落到未启用状态 */ }
  renderFsaBar();
}

/* ---------------- 预置示例数据（seed:true 的可被"清空示例数据"一键清除） ---------------- */
function seed(){
  // 已按需清空示例数据：全新打开即为空白工作台，可直接录入真实设备/流水/工单/借用数据
  return { devices:[], flows:[], repairs:[], borrows:[], meta:{ createdAt:nowStr(), tipAt:0 } };
}

/* ---------------- 业务计算 ---------------- */
function devById(id){
  for(var i=0;i<DB.devices.length;i++){ if(DB.devices[i].id===id) return DB.devices[i]; }
  return null;
}
function devLabel(id){
  var d=devById(id);
  return d ? (d.code+' '+d.name) : '（设备已删除）';
}
function warnDevices(){   // 仅统计「距质保到期 60 天内且未过保」的设备（已过保不再提醒）
  return DB.devices.filter(function(d){
    var n=daysTo(d.warranty); return n!==null && n>=0 && n<=WARRANTY_DAYS;
  });
}
function brokenDevices(){ return DB.devices.filter(function(d){ return d.status==='故障'; }); }
function pendingRepairs(){ return DB.repairs.filter(function(r){ return r.status==='待处理'||r.status==='维修中'; }); }
function sum(arr,key){ var s=0; for(var i=0;i<arr.length;i++) s+=(+arr[i][key]||0); return s; }
function borrowStatus(b){ if(b.inDate) return '已归还'; if(b.expectDate && daysTo(b.expectDate)<0) return '逾期'; return '借出中'; }
function pendingBorrows(){ return DB.borrows.filter(function(b){ return borrowStatus(b)!=='已归还'; }); }
function overdueBorrows(){ return DB.borrows.filter(function(b){ return borrowStatus(b)==='逾期'; }); }
/* 按"被借用设备台数"统计：去重后的设备 ID 集合 */
function borrowDevIds(){ var s={}; DB.borrows.forEach(function(b){ if(borrowStatus(b)!=='已归还') s[b.devId]=1; }); return Object.keys(s); }
function overdueDevIds(){ var s={}; DB.borrows.forEach(function(b){ if(borrowStatus(b)==='逾期') s[b.devId]=1; }); return Object.keys(s); }
function borrowedDevCount(){ return borrowDevIds().length; }
function overdueDevCount(){ return overdueDevIds().length; }

/* ---------------- 图标（全部内联 SVG，不使用 emoji） ---------------- */
var ICON = {

/* ---------------- 导航渲染 ---------------- */
function renderNav(){
  var pend = pendingRepairs().length;
  var ov = overdueBorrows().length;
  var html = PAGES.map(function(p){
    var badge = '';
    if(p.k==='repair' && pend>0) badge = '<span class="nav-badge">'+pend+'</span>';
    else if(p.k==='borrow' && ov>0) badge = '<span class="nav-badge">'+ov+'</span>';
    return '<button type="button" class="nav-item'+(PAGE===p.k?' active':'')+'" data-act="go" data-page="'+p.k+'" title="'+p.t+'">'
         + p.i + '<span class="nav-label">'+p.t+'</span>' + badge + '</button>';
  }).join('');
  $('nav').innerHTML = html;
  var cur = PAGES.filter(function(p){return p.k===PAGE;})[0];
  $('pageTitle').textContent = cur.t;
  $('pageDesc').textContent = cur.d;
}

/* ---------------- 全局提醒栏（所有页面可见） ---------------- */
function renderAlerts(){
  var out = '';
  var wd = warnDevices();
  var bd = brokenDevices();
  var pr = pendingRepairs();
  var ov = overdueBorrows();

  if(bd.length || pr.length){
    var chips = bd.map(function(d){
      return '<span class="chip">'+esc(d.code)+' '+esc(d.name)+'（状态：故障·'+esc(d.loc)+'）</span>';
    }).join('');
    var rchips = pr.map(function(r){
      return '<span class="chip">'+esc(devLabel(r.devId))+'｜'+esc(r.status)+'</span>';
    }).join('');
    out += '<div class="alert alert-danger">'+ICON.warn+'<div><b>故障待维修提醒：</b>当前 '+bd.length+' 台设备处于故障状态，'+pr.length+' 张工单未闭环。<br>'
        + chips + rchips + '</div></div>';
  }
  if(wd.length){
    var wchips = wd.map(function(d){
      var n = daysTo(d.warranty);
      var txt = '还剩'+n+'天';
      return '<span class="chip">'+esc(d.code)+' '+esc(d.name)+'（'+esc(d.warranty)+'·'+txt+'）</span>';
    }).join('');
    out += '<div class="alert alert-warn">'+ICON.bell+'<div><b>质保到期提醒：</b>'+wd.length+' 项设备将在 '+WARRANTY_DAYS+' 天内过保，请提前安排续保/采购。<br>'
        + wchips + '</div></div>';
  }
  if(ov.length){
    var ochips = ov.map(function(b){
      return '<span class="chip">'+esc(b.person)+'｜'+esc(devLabel(b.devId))+'（应还 '+esc(b.expectDate)+'）</span>';
    }).join('');
    out += '<div class="alert alert-warn">'+ICON.bell+'<div><b>设备借用逾期提醒：</b>'+ov.length+' 笔借用已超过预计归还日期，请及时催收。<br>'+ochips+'</div></div>';
  }
  if(!bd.length && !pr.length && !wd.length && !ov.length){
    out += '<div class="alert" style="background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46">'+ICON.bell+'<div>当前无故障设备、无未闭环工单、无临期质保设备、无逾期借用，一切正常。</div></div>';
  }

  // 数据量备份提醒
  var cnt = totalCount();
  var step = Math.floor(cnt / BACKUP_TIP_STEP);
  if(step >= 1 && !DB.meta.tipHidden){
    out += '<div class="alert alert-tip" id="tipBar">'+ICON.warn+'<div><b>数据已累计 '+cnt+' 条</b>，建议点击右上角「导出备份」保存一份 JSON，避免清理浏览器时丢失。</div>'
        + '<button class="close" data-act="hideTip" title="今天不再提示">&times;</button></div>';
    if(step > (DB.meta.tipAt||0)){   // 每满 20 条主动弹一次
      DB.meta.tipAt = step; save();
      setTimeout(function(){ toast('数据已累计 '+cnt+' 条，建议导出一次备份'); }, 600);
    }
  }
  $('alerts').innerHTML = out;
}

/* ---------------- 主渲染 ---------------- */
function render(){
  renderNav();
  renderSideCalendar();
  renderAlerts();
  if(PAGE==='ledger') renderLedger();
  else if(PAGE==='flow') renderFlow();
  else if(PAGE==='borrow') renderBorrow();
  else if(PAGE==='repair') renderRepair();
  else renderDash();
  window.scrollTo(0,0);
}

/* ======================= 左侧日历：借出/出库日期视图 ======================= */
var calView = {y:0, m:0};
function calEnsure(){ if(!calView.y){ var d=new Date(); calView.y=d.getFullYear(); calView.m=d.getMonth(); } }
function calMaps(){
  var out={}, bw={};
  (DB.flows||[]).forEach(function(f){ if(f.type!=='out') return; var d=(f.time||'').slice(0,10); if(d) out[d]=(out[d]||0)+1; });
  (DB.borrows||[]).forEach(function(b){ var d=(b.outDate||'').slice(0,10); if(d) bw[d]=(bw[d]||0)+1; });
  return {out:out, bw:bw};
}
function calCell(d, inMonth, maps){
  var ds = fmtDate(d);
  var hasOut = maps.out[ds], hasBw = maps.bw[ds];
  var cls = 'sc-cell' + (inMonth?'':' muted') + (ds===today()?' today':'');
  var dots = (hasOut||hasBw) ? '<span class="sc-dots">'+(hasOut?'<i class="d-out"></i>':'')+(hasBw?'<i class="d-bw"></i>':'')+'</span>' : '';
  var act = (hasOut||hasBw) ? ' data-act="calDay" data-date="'+ds+'"' : '';
  return '<button type="button" class="'+cls+'"'+act+'>'+d.getDate()+dots+'</button>';
}
function calMonthBlock(y,m,maps){
  var first=new Date(y,m,1), lead=(first.getDay()+6)%7, start=new Date(y,m,1-lead), cells='';
  for(var i=0;i<42;i++){ var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i); cells+=calCell(d, d.getMonth()===m, maps); }
  var wk=['一','二','三','四','五','六','日'].map(function(w){return '<span>'+w+'</span>';}).join('');
  return '<div class="sc-wk">'+wk+'</div><div class="sc-grid">'+cells+'</div>';
}
function renderCalendarInto(box){
  calEnsure();
  var maps = calMaps(), y=calView.y, m=calView.m;
  box.innerHTML='<div class="sc-hd"><span class="sc-title">'+y+'年'+(m+1)+'月</span>'
    +'<span class="sc-nav"><button type="button" data-act="calPrev" aria-label="上个月">‹</button>'
    +'<button type="button" data-act="calNext" aria-label="下个月">›</button></span></div>'
    + calMonthBlock(y,m,maps)
    +'<div class="sc-legend"><span><i class="d-out"></i>出库（红）</span><span><i class="d-bw"></i>借出（橙）</span></div>';
}
function renderCalendars(){ ['sideCal','mobCal'].forEach(function(id){ var b=$(id); if(b) renderCalendarInto(b); }); }
function calRefresh(){ renderCalendars(); }
function renderSideCalendar(){ renderCalendars(); }
/* 手机端日历改用纯 CSS：侧栏 #sideCal 与 主区 #mobCal 双渲染，媒体查询控制显隐，不再依赖 DOM 移动 */
function calDayDetail(ds){
  var outs=(DB.flows||[]).filter(function(f){return f.type==='out' && (f.time||'').slice(0,10)===ds;});
  var bws=(DB.borrows||[]).filter(function(b){return b.outDate===ds;});
  var dm={}; (DB.devices||[]).forEach(function(d){dm[d.id]=d;});
  var html='<div style="font-size:14px;line-height:1.7"><h3 style="margin:0 0 8px">'+ds+'</h3>';
  if(!outs.length && !bws.length){ html+='<div class="muted">当日无借出/出库记录</div>'; }
  if(outs.length){
    html+='<div style="margin-bottom:10px"><b style="color:#dc2626">出库（借领用）'+outs.length+' 笔</b>';
    outs.forEach(function(f){ var d=dm[f.devId]||{}; html+='<div class="cal-row"><span class="tag tag-blue">出库</span> '+(f.time?f.time.slice(11):'')+' · '+(d.name||'未知设备')+'（'+(d.code||'-')+'） · '+esc(f.qty||1)+' 台 · '+esc(f.person||'-')+' / '+esc(f.dept||'-')+'</div>'; });
    html+='</div>';
  }
  if(bws.length){
    html+='<div><b style="color:#f59e0b">借出（设备借用）'+bws.length+' 笔</b>';
    bws.forEach(function(b){ var d=dm[b.devId]||{}; html+='<div class="cal-row"><span class="tag tag-orange">借出</span> '+(d.name||'未知设备')+'（'+(d.code||'-')+'） · '+esc(b.person||'-')+' / '+esc(b.dept||'-')+' · 预计还 '+esc(b.expectDate||'-')+' · '+borrowStatus(b)+'</div>'; });
    html+='</div>';
  }
  html+='</div>';
  openModal({ title:ds+' 借出/出库明细', narrow:false, okText:'关闭', body:html });
}

/* ======================= 模块1：设备台账总览 ======================= */
function devRowClass(d){
  if(d.status==='故障') return 'row-danger';
  var n=daysTo(d.warranty);
  if(n!==null && n>=0 && n<=WARRANTY_DAYS) return 'row-warn';
  return '';
}
function warrantyCell(d){
  var n=daysTo(d.warranty);
  if(n===null) return '<span class="muted">未填写</span>';
  if(n<0) return esc(d.warranty)+' <span class="muted">已过保</span>';
  if(n<=WARRANTY_DAYS) return '<span class="tag tag-orange">'+esc(d.warranty)+' 剩'+n+'天</span>';
  return esc(d.warranty);
}
function statusCell(d){ return statusDevTag(d.status); }
/* 设备台账列表「状态」列：保留可手动编辑的下拉，同时根据借用记录自动叠加关联状态
   （逾期未还→红色「逾期」、借出未还→橙色「借出中」），实现"关联匹配正确的状态" */
function devStatusCell(d){
  var b = DB.borrows.find(function(x){ return x.devId===d.id && borrowStatus(x)!=='已归还'; });
  if(b){
    /* 借出/逾期为派生状态：仅显示徽标，隐藏基础状态下拉，避免"在用 + 逾期"并存造成困惑 */
    return (borrowStatus(b)==='逾期')
      ? '<span class="tag tag-red">逾期</span>'
      : '<span class="tag tag-orange">借出中</span>';
  }
  var opts = STATUS_DEV.map(function(x){ return '<option'+(x===d.status?' selected':'')+'>'+x+'</option>'; }).join('');
  return '<select data-act="devStatus" data-id="'+d.id+'" style="width:auto;min-height:34px;font-size:13px;padding:5px 8px">'+opts+'</select>';
}
function isDeviceBorrowed(devId){
  return DB.borrows.some(function(b){ return b.devId===devId && borrowStatus(b)!=='已归还'; });
}
function devCodeColor(d){
  if(d.status==='已出库' || isDeviceBorrowed(d.id)) return '#dc2626';
  if(d.status==='在用') return '#16a34a';
  return '';
}
function filterDevices(){
  var kw = UI.kw.trim().toLowerCase();
  return DB.devices.filter(function(d){
    if(UI.cat && d.cat!==UI.cat) return false;
    if(UI.loc && d.loc!==UI.loc) return false;
    if(kw){
      var s = (d.name+' '+d.model+' '+d.code+' '+d.cat+' '+d.loc+' '+d.status+' '+(d.manager||'')+' '+(d.dept||'')+' '+(d.supplier||'')).toLowerCase();
      if(s.indexOf(kw)<0) return false;
    }
    return true;
  });
}
function devTable(list){
  if(!list.length) return '<div class="empty">'+ICON.empty+'没有匹配的设备记录</div>';
  var rows = list.map(function(d){
    var clr=devCodeColor(d);
    var cs=clr?' style="color:'+clr+'"':'';
    return '<tr class="'+devRowClass(d)+'">'
      + '<td data-label="资产编号"><b'+cs+'>'+esc(d.code)+'</b><span class="cellsub">'+esc(d.buyDate||'')+' 采购</span></td>'
      + '<td data-label="设备名称"><div>'+esc(d.name)+'<span class="cellsub">'+esc(d.model)+'</span></div></td>'
      + '<td data-label="类别"><span class="tag tag-teal">'+esc(d.cat)+'</span></td>'
      + '<td data-label="存放位置">'+esc(d.loc)+'</td>'
      + '<td data-label="机器编号"'+cs+'>'+esc(d.machineNo||'-')+'</td>'
      + '<td data-label="状态">'+devStatusCell(d)+'</td>'
      + '<td data-label="质保到期">'+warrantyCell(d)+'</td>'
      + '<td data-label="管理人员"><div>'+esc(d.manager||'-')+'<span class="cellsub">'+esc(d.dept||'')+'</span></div></td>'
      + '<td data-label="供应商"><div>'+esc(d.supplier||'-')+'<span class="cellsub">'+esc(d.remark||'')+'</span></div></td>'

      + '</div></td></tr>';
  }).join('');
  return '<div style="overflow-x:auto"><table><thead><tr>'
    + '<th>资产编号</th><th>设备名称/型号</th><th>类别</th><th>存放位置</th><th>机器编号</th><th>状态</th><th>质保到期</th><th>管理人员</th><th>供应商/备注</th><th>操作</th>'
    + '</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function devSubmit(id){
  if(!v('f_name') || !v('f_code')){ toast('设备名称和资产编号必填'); return false; }
  var obj = {
    name:v('f_name'), model:v('f_model'), code:v('f_code'), cat:v('f_cat'), loc:v('f_loc'),
    supplier:v('f_supplier'), status:v('f_status')||'在用', manager:v('f_manager'), dept:v('f_dept'), machineNo:v('f_machine'), serial:v('f_serial'),
    buyDate:v('f_buyDate'), warranty:v('f_warranty'), remark:v('f_remark')
  };
  if(obj.status==='已出库'){
    var _tid = id;
    if(!_tid){ toast('新登记的设备不能直接设为「已出库」，请先保存为在用，再到「出入库登记」登记出库。'); return false; }
    var _hasOut = DB.flows.some(function(f){ return f.type==='out' && f.devId===_tid; });
    if(!_hasOut){ toast('未找到该设备的出库（借领用）记录，不能手动设为「已出库」。请先在「出入库登记」中登记出库。'); return false; }
  }
  if(id){
    var d = devById(id);
    for(var k in obj) d[k]=obj[k];
  }else{
    obj.id = uid('dev');
    DB.devices.unshift(obj);
  }
  save(); render(); toast(id?'设备信息已更新':'设备已新增');
  return true;
}

function flowEdit(id){
  var f = DB.flows.filter(function(x){return x.id===id;})[0];
  if(!f) return;
  var isIn = f.type==='in';
  openModal({
    title: (isIn?'编辑入库记录':'编辑出库记录'),
    body: '<div class="muted" style="margin-bottom:10px">仅修正<b>本条记录</b>的内容（时间、经办人、编号、备注等）。为避免账实错乱，修改<b>不会联动改动设备台账数量</b>；若数量登记有误，请删除该记录后重新登记。</div>' + flowForm(f.type, f)
    + '<div style="margin-top:14px;border-top:1px dashed #eee;padding-top:12px">'
    + '<button class="btn btn-danger btn-sm" data-act="flowDelPwd" data-id="'+f.id+'" style="color:#fff;background:#dc2626;border-color:#dc2626">删除此出入库记录（需管理密码）</button>'
    + '<div class="muted" style="margin-top:6px">历史流水仅可新增与编辑，不可直接删除；如确需删除须输入管理密码，以保证账实可追溯。</div></div>',
    okText:'保存修改',
    onOk:function(){ return flowUpdate(f.id); }
  });
}
function flowUpdate(id){
  var f = DB.flows.filter(function(x){return x.id===id;})[0];
  if(!f) return false;
  f.time = (v('f_time')||nowStr()).replace('T',' ').slice(0,16);
  f.person = v('f_person');
  if(f.type==='in'){ f.source=v('f_source'); } else { f.dept=v('f_dept'); }
  f.purpose = v('f_purpose');
  f.remark = v('f_remark2');
  save(); render(); toast('流水记录已修改（不影响设备台账）');
  return true;
}
function flowSubmit(type){
  var isIn = type==='in';
  if(isIn){
    var devId=v('f_dev'); if(!devId){ toast('请选择要归还的设备'); return false; }
    var d=devById(devId); if(!d){ toast('设备不存在'); return false; }
    if(d.status!=='已出库'){ toast('该设备当前不是「已出库」状态，无需归还'); return false; }
    d.status='在用';
    DB.flows.unshift({id:uid('fl'),seed:false,type:'in',devId:devId,devCode:d.code,devName:d.name,qty:1,
      time:(v('f_time')||nowStr()).replace('T',' ').slice(0,16),person:v('f_person'),dept:'',source:'',
      ret:'已归还',machineNo:d.machineNo||'',serial:d.serial||'',purpose:'',remark:v('f_remark2')});
    save(); render(); toast('归还登记成功，设备已恢复「在用」');
    return true;
  } else {
    var devId=v('f_dev'); if(!devId){ toast('请选择要出库的设备'); return false; }
    var d=devById(devId); if(!d){ toast('设备不存在'); return false; }
    if(d.status==='已出库'){ toast('该设备已处于出库状态'); return false; }
    d.status='已出库';
    DB.flows.unshift({id:uid('fl'),seed:false,type:'out',devId:devId,devCode:d.code,devName:d.name,qty:1,
      time:(v('f_time')||nowStr()).replace('T',' ').slice(0,16),person:v('f_person'),dept:v('f_dept'),
      ret:'未归还',machineNo:d.machineNo||'',serial:d.serial||'',purpose:v('f_purpose'),remark:v('f_remark2')});
    save(); render(); toast('出库登记成功，设备已标记为「已出库」');
    return true;
  }
}
function flowReturn(id){
  var f = DB.flows.filter(function(x){return x.id===id;})[0];
  if(!f) return;
  openConfirm('登记归还','确认将「'+esc((f.devCode||'')+' '+(f.devName||''))+'」标记为「已归还」并恢复为「在用」状态？', function(){
    f.ret='已归还';
    var d=devById(f.devId);
    if(d){ d.status='在用'; }
    save(); render(); toast('已登记归还，设备恢复在用');
  });
}

function rpChangeStatus(id, st){
  var r = DB.repairs.filter(function(x){return x.id===id;})[0];
  if(!r || r.status===st) return;
  var old = r.status;
  var d = devById(r.devId);
  var apply = function(){
    r.status = st;
    var d = devById(r.devId);
    if(d){
      if(st==='已修复') d.status='在用';
      else if(st==='报废') d.status='报废';
      else d.status='故障';
    }
    save(); render(); toast('工单状态已更新为「'+st+'」');
  };

/* ======================= 模块4：统计分析看板（内联 SVG / CSS 绘图） ======================= */
var PALETTE = ['#0d9488','#0891b2','#14b8a6','#0e7490','#22d3ee','#f59e0b','#ef4444','#8b5cf6','#64748b','#84cc16'];

function pieSVG(data){   // data: [{label, value}]
  var total = data.reduce(function(s,x){return s+x.value;},0);
  if(!total) return '<div class="empty">'+ICON.empty+'暂无数据</div>';
  var cx=100, cy=100, r=80, acc=0, paths='';
  if(data.length===1){
    paths = '<circle cx="100" cy="100" r="80" fill="'+(data[0].color||PALETTE[0])+'"></circle>';
  }else{
    data.forEach(function(x,i){
      var a0 = acc/total*360, a1 = (acc+x.value)/total*360; acc+=x.value;
      paths += '<path d="'+arcPath(cx,cy,r,a0,a1)+'" fill="'+(x.color||PALETTE[i%PALETTE.length])+'" stroke="#fff" stroke-width="1.5"></path>';
    });
  }
  var legend = data.map(function(x,i){
    var pct = (x.value/total*100).toFixed(1);
    return '<div><i style="background:'+(x.color||PALETTE[i%PALETTE.length])+'"></i>'+esc(x.label)+' <b>'+x.value+'</b> <span class="muted">'+pct+'%</span></div>';
  }).join('');
  return '<div class="pie-box">'
    + '<svg viewBox="0 0 200 200" style="width:180px;height:180px;flex:none">'+paths
    + '<circle cx="100" cy="100" r="42" fill="#fff"></circle>'
    + '<text x="100" y="95" text-anchor="middle" font-size="12" fill="#6b7280">总台数</text>'
    + '<text x="100" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">'+total+'</text>'
    + '</svg><div class="legend">'+legend+'</div></div>';
}
function arcPath(cx,cy,r,a0,a1){
  var p0=polar(cx,cy,r,a0), p1=polar(cx,cy,r,a1);
  var large = (a1-a0)>180 ? 1 : 0;
  return 'M '+cx+' '+cy+' L '+p0.x.toFixed(2)+' '+p0.y.toFixed(2)+' A '+r+' '+r+' 0 '+large+' 1 '+p1.x.toFixed(2)+' '+p1.y.toFixed(2)+' Z';
}
function polar(cx,cy,r,deg){ var a=(deg-90)*Math.PI/180; return {x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)}; }

function hBars(data){    // 纯 CSS 水平柱状图，长标签也能看清
  if(!data.length) return '<div class="empty">'+ICON.empty+'暂无数据</div>';
  var max = Math.max.apply(null, data.map(function(x){return x.value;})) || 1;
  return data.map(function(x){
    var w = Math.max(2, x.value/max*100);
    return '<div class="bar-row"><div class="bar-top"><span>'+esc(x.label)+'</span><b>'+x.value+' 台</b></div>'
         + '<div class="bar-bg"><div class="bar-fill" style="width:'+w+'%"></div></div></div>';
  }).join('');
}
function vBarSVG(data){  // 内联 SVG 竖直柱状图（工单状态）
  var max = Math.max.apply(null, data.map(function(x){return x.value;})) || 1;
  var W=340, H=200, pad=30, bw=44, gap=(W-pad*2-bw*data.length)/(data.length+1);
  var bars='';
  data.forEach(function(x,i){
    var h = x.value/max*(H-70);
    var bx = pad+gap*(i+1)+bw*i, by = H-34-h;
    bars += '<rect x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+bw+'" height="'+Math.max(h,1).toFixed(1)+'" rx="5" fill="'+x.color+'"></rect>'

         +  '<text x="'+(bx+bw/2).toFixed(1)+'" y="'+(H-14)+'" text-anchor="middle" font-size="12" fill="#6b7280">'+esc(x.label)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:420px;height:auto">'
    + '<line x1="'+pad+'" y1="'+(H-34)+'" x2="'+(W-pad+10)+'" y2="'+(H-34)+'" stroke="#e5e7eb"></line>'
    + bars + '</svg>';
}

function csvCell(v){ if(v===null||v===undefined) v=''; v=String(v); if(/[",\r\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; return v; }
function csvNum(v){ var x=parseFloat(v); return isNaN(x)?0:x; }
function devMap(){ var m={}; DB.devices.forEach(function(d){ m[d.id]=d; }); return m; }
function downloadCSV(name, headers, rows){
  var lines=[headers.join(',')];
  rows.forEach(function(r){ lines.push(r.map(csvCell).join(',')); });

function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1); // 去 UTF-8 BOM
  var rows=[], row=[], field='', q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else q=false; }
      else field+=c;
    } else {
      if(c==='"') q=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\r'){ /* skip */ }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.length>1 || (r.length===1 && r[0].trim()!==''); });
}
function detectCSVType(head){
  var h=head.join('|');
  if(h.indexOf('预计归还')>=0||h.indexOf('借用人')>=0) return 'borrows';
  if(h.indexOf('报修时间')>=0||h.indexOf('故障描述')>=0||h.indexOf('维修状态')>=0) return 'repairs';
  if(h.indexOf('经办人')>=0||h.indexOf('领用部门')>=0||h.indexOf('归还状态')>=0||h.indexOf('入库')>=0||h.indexOf('出库')>=0) return 'flows';
  if(h.indexOf('使用状态')>=0||h.indexOf('资产编号')>=0||h.indexOf('质保到期')>=0) return 'devices';
  return null;
}
function doImportCSV(file, forceType){
  var fr=new FileReader();
  fr.onload=function(){
    var rows=parseCSV(fr.result||'');
    if(rows.length<2){ toast('CSV 内容为空或只有表头'); return; }
    var head=rows[0].map(function(h){ return h.trim(); });
    var type=forceType||detectCSVType(head);
    if(!type){ toast('无法识别该 CSV 类型：请使用本工具导出的格式（表头含「资产编号/使用状态」或「经办人/归还状态」或「报修时间」）'); return; }
    var map=CSV_MAP[type], idx={};
    head.forEach(function(h,i){ if(map[h]!=null) idx[map[h]]=i; });
    var dm=devMap(), added=0, skipped=0;
    if(type==='devices'){
      var seen={}; DB.devices.forEach(function(d){ seen[d.code]=1; });
      rows.slice(1).forEach(function(r){
        var code=(r[idx.code]||'').trim();
        if(!code||seen[code]){ skipped++; return; }
        var rawStatus=(r[idx.status]||'').trim();
        var normStatus = STATUS_DEV.indexOf(rawStatus)>=0 ? rawStatus : '在用';
        seen[code]=1;
        DB.devices.push({id:uid('dev'),seed:false,name:r[idx.name]||'',model:r[idx.model]||'',code:code,cat:r[idx.cat]||'',loc:r[idx.loc]||'',status:normStatus,manager:r[idx.manager]||'',dept:r[idx.dept]||'',machineNo:r[idx.machineNo]||'',serial:r[idx.serial]||'',buyDate:r[idx.buyDate]||'',warranty:r[idx.warranty]||'',supplier:r[idx.supplier]||'',remark:r[idx.remark]||''});
        added++;
      });
    } else if(type==='flows'){
      rows.slice(1).forEach(function(r){
        var dc=(r[idx.devCode]||'').trim(), devId='';
        for(var k in dm){ if(dm[k].code===dc){ devId=k; break; } }
        var tp=(r[idx.type]||'').indexOf('出')>=0?'out':'in';
        DB.flows.push({id:uid('fl'),seed:false,type:tp,devId:devId,qty:csvNum(r[idx.qty]),time:r[idx.time]||'',person:r[idx.person]||'',dept:r[idx.dept]||'',source:r[idx.source]||'',ret:r[idx.ret]||'',machineNo:r[idx.machineNo]||'',serial:r[idx.serial]||'',purpose:r[idx.purpose]||'',remark:r[idx.remark]||''});
        added++;
      });
    } else if(type==='repairs'){
      var seenId={}; DB.repairs.forEach(function(x){ seenId[x.id]=1; });
      rows.slice(1).forEach(function(r){
        var rid=(r[idx.id]||'').trim();
        if(seenId[rid]){ skipped++; return; }
        if(rid) seenId[rid]=1; else rid=uid('rp');
        var dc=(r[idx.devCode]||'').trim(), devId='';
        for(var k in dm){ if(dm[k].code===dc){ devId=k; break; } }
        DB.repairs.push({id:rid,seed:false,devId:devId,time:r[idx.time]||'',desc:r[idx.desc]||'',reporter:r[idx.reporter]||'',status:r[idx.status]||'待处理',worker:r[idx.worker]||'',result:r[idx.result]||'',cost:csvNum(r[idx.cost]),remark:r[idx.remark]||''});
        added++;
      });
    } else if(type==='borrows'){
      rows.slice(1).forEach(function(r){
        var dc=(r[idx.devCode]||'').trim(), devId='';
        for(var k in dm){ if(dm[k].code===dc){ devId=k; break; } }
        DB.borrows.push({id:uid('br'),seed:false,devId:devId,person:r[idx.person]||'',dept:r[idx.dept]||'',outDate:r[idx.outDate]||'',expectDate:r[idx.expectDate]||'',inDate:r[idx.inDate]||'',purpose:r[idx.purpose]||'',remark:r[idx.remark]||''});
        added++;
      });
    }
    if(added===0){ toast('导入完成：'+skipped+' 行因编号重复/缺失被跳过，无新增'); save(); render(); return; }
    openModal({ title:'导入 CSV 确认', narrow:true, okText:'确认追加',
      body:'识别为【'+TYPE_NAME[type]+'】数据，将<b>追加</b>到当前工作台：<br><br>新增 <b>'+added+'</b> 条'
        +(skipped?('，跳过 <b>'+skipped+'</b> 条（编号重复/缺失）'):'')
        +'<br><br><span style="color:var(--muted)">CSV 导入为追加模式，不会删除现有数据；如需整体替换请用「导入数据文件(JSON)」。</span>',
      onOk:function(){ save(); render(); toast('已追加导入 '+added+' 条（'+TYPE_NAME[type]+'）'); } });
  };
  fr.readAsText(file, 'utf-8');
}

/* 管理密码验证弹窗：删除出入库/借用流水时调用，输入正确才执行回调 */
function askAdminPwd(onPass, title){
  openModal({
    title: title||'管理密码验证', narrow:true, danger:true, okText:'确认删除',
    body:'<div style="margin-bottom:10px">该删除操作不可恢复，请输入管理密码以继续：</div>'
      + '<input id="pwdInput" type="password" class="inp" placeholder="请输入管理密码" style="font-size:16px;width:100%">'
      + '<div id="pwdHint" class="muted" style="margin-top:6px;color:#dc2626;min-height:18px"></div>',
    onOk:function(){
      if(v('pwdInput')!==ADMIN_PWD){ var h=$('pwdHint'); if(h) h.textContent='管理密码错误，已取消本次删除'; var el=$('pwdInput'); if(el) el.focus(); return false; }
      onPass&&onPass();
      return true;
    }
  });
  setTimeout(function(){ var el=$('pwdInput'); if(el) el.focus(); }, 60);
}
function flowDelPwd(id){
  var f = DB.flows.filter(function(x){return x.id===id;})[0];
  if(!f) return;
  askAdminPwd(function(){
    var _dev = f.devId;
    DB.flows = DB.flows.filter(function(x){return x.id!==id;});
    recalcDevStatus(_dev);
    save(); closeModal(); render(); toast('出入库记录已删除，设备状态已按流水重新核算');
  }, '删除出入库记录');
}
function borrowDelPwd(id){
  var b = DB.borrows.filter(function(x){return x.id===id;})[0];
  if(!b) return;
  askAdminPwd(function(){
    DB.borrows = DB.borrows.filter(function(x){return x.id!==id;});
    save(); closeModal(); render(); toast('借用记录已删除');
  }, '删除借用记录');
}
function wipeAll(){

    openConfirm('清空全部数据', '当前没有任何数据，确认清空？', function(){
      DB = { devices:[], flows:[], repairs:[], borrows:[], meta:{createdAt:nowStr(), tipAt:0} };
      save(); render(); toast('全部数据已清空');
    });
    return;
  }
  openModal({
    title:'清空全部数据（需先备份）', danger:true, okText:'确认清空',
    body:'<div style="line-height:1.7">'
      +'<p style="margin:0 0 8px">将删除本机保存的<b>全部</b>数据（设备台账、出入库流水、维修工单、借用记录），<span style="color:var(--danger)">清空后无法恢复</span>。</p>'
      +'<p style="margin:0 0 10px">为防止误删或清理浏览器导致数据<b>永久丢失</b>，系统要求清空前<b>必须先备一份</b>：</p>'
      +'<div style="margin:0 0 12px"><button class="btn btn-primary" id="wipeBackupBtn" type="button">① 导出备份 (JSON)</button>'
      +'<span id="wipeBackupState" class="muted" style="margin-left:10px" data-done="0">尚未备份</span></div>'
      +'<label style="display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14px"><input type="checkbox" id="wipeSkip"> 我已单独备份过，可跳过导出</label>'
      +'<input type="text" id="wipeType" class="inp" placeholder=\'请输入「确认清空」四个字\' style="font-size:16px;width:100%">'
      +'</div>',
    onOk:function(){
      var skip = $('wipeSkip') && $('wipeSkip').checked;
      var okBackup = $('wipeBackupState') && $('wipeBackupState').getAttribute('data-done')==='1';
      if(!skip && !okBackup){ toast('请先点「① 导出备份」，或勾选「我已单独备份过」'); return false; }
      if(($('wipeType').value||'').trim() !== '确认清空'){ toast('请在输入框输入「确认清空」四个字'); return false; }
      DB = { devices:[], flows:[], repairs:[], borrows:[], meta:{createdAt:nowStr(), tipAt:0} };
      save(); render();
      if(FSA.active && FSA.fileHandle){
        var okBtn = $('modalOk'); if(okBtn){ okBtn.disabled = true; okBtn.textContent = '正在写入本地文件…'; }
        fsaFlush().then(function(){
          closeModal(); toast('全部数据已清空（本地 data.json 已同步）');
        }).catch(function(){
          closeModal(); toast('已清空（本地文件写入失败，请检查文件夹权限）');
        });
        return false;   // 保持弹窗打开，等待本地文件写入完成，避免刷新后旧数据被复活
      }
      closeModal(); toast('全部数据已清空');
    }
  });
  var bb = $('wipeBackupBtn');
  if(bb) bb.onclick = function(){
    doExport();
    var st = $('wipeBackupState');

    bb.disabled = true; bb.textContent = '① 已备份';
  };
}

/* ======================= IMA 知识库备份（由小台代存） ======================= */
/* 说明：IMA 接口不开放浏览器跨域，纯静态页无法直接调 IMA；故由已接入你 IMA 知识库的
   小台（WorkBuddy）代你中转：你导出 JSON 发我 → 我存入 IMA；恢复时我取回发你 → 你导入。
   手动 JSON 导出/导入始终可用。 */
function copyText(str){
  function fb(){
    var ta=document.createElement('textarea'); ta.value=str; ta.style.position='fixed'; ta.style.top='-9999px';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok=false; try{ ok=document.execCommand('copy'); }catch(e){ ok=false; } ta.remove(); return ok;
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(str).then(function(){ toast('已复制备份内容，发给小台即可存入 IMA'); },
      function(){ if(fb()) toast('已复制备份内容，发给小台即可存入 IMA'); else toast('复制失败，请手动选择文本复制'); });
  } else { if(fb()) toast('已复制备份内容，发给小台即可存入 IMA'); else toast('复制失败，请手动选择文本复制'); }
}
function imaBackup(){
  var json = JSON.stringify(DB, null, 2);
  var total = DB.devices.length + DB.flows.length + DB.repairs.length + DB.borrows.length;
  var safe = json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  openModal({
    title:'IMA 知识库 · 云端保险',
    okText:'关闭',
    body:'<div style="line-height:1.7">'
      +'<p style="margin:0 0 10px">把所有数据备份到你的 <b>IMA 知识库</b>（由已接入你 IMA 的小台代存）。换手机 / 清浏览器后，找我要回即可还原。当前共 <b>'+total+'</b> 条数据。</p>'
      +'<div style="font-size:13px;color:var(--muted);margin:0 0 6px"><b>① 备份到 IMA 云</b></div>'
      +'<textarea id="imaJson" readonly class="inp" style="width:100%;height:150px;font-family:monospace;font-size:12px">'+safe+'</textarea>'
      +'<div style="margin:8px 0 14px;display:flex;gap:8px;flex-wrap:wrap">'
      +'<button class="btn btn-primary" id="imaCopy" type="button">复制全部内容</button>'
      +'<button class="btn btn-line" id="imaDl" type="button">下载 .json</button>'
      +'</div>'
      +'<div style="font-size:13px;color:var(--muted);margin:0 0 6px"><b>② 从 IMA 云恢复</b>（把小台发给你的 JSON 粘贴到下面）</div>'
      +'<textarea id="imaPaste" class="inp" placeholder="在此粘贴小台从 IMA 取回的备份 JSON…" style="width:100%;height:110px;font-family:monospace;font-size:12px"></textarea>'
      +'<div style="margin-top:8px"><button class="btn btn-primary" id="imaRestore" type="button">从粘贴内容恢复</button></div>'
      +'<p class="muted" style="margin:12px 0 0">流程：点「复制全部内容」→ 发给我（小台）→ 我存入 IMA；恢复时对我喊「从 IMA 恢复」→ 我把 JSON 发回 → 粘贴到上方点恢复。</p>'
      +'</div>'
  });
  var copyBtn=$('imaCopy'); if(copyBtn) copyBtn.onclick=function(){ copyText(json); };
  var dlBtn=$('imaDl'); if(dlBtn) dlBtn.onclick=function(){ doExport(); };
  var rsBtn=$('imaRestore'); if(rsBtn) rsBtn.onclick=function(){
    var t=($('imaPaste').value||'').trim();
    if(!t){ toast('请先粘贴备份内容'); return; }
    var obj; try{ obj=JSON.parse(t); }catch(e){ toast('粘贴内容不是有效的 JSON'); return; }
    importFromObject(obj);
  };
}
function imaDoBackup(){
  toast('正在备份到 IMA 知识库…');
  fetch('/api/ima/backup', {
    method:'POST', cache:'no-store',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ data: DB })
  }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(res){
      if(res.ok && res.j && res.j.ok){
        toast('已备份到 IMA 知识库（笔记：'+(res.j.note_title||'')+'）');
      } else {
        toast('IMA 备份失败：' + ((res.j&&res.j.msg)||'未知错误'));
      }
    }).catch(function(){ toast('IMA 备份请求失败，请确认代理服务运行中'); });
}
function imaOpenSetup(){
  openModal({
    title:'配置 IMA 知识库', narrow:true, okText:'保存并备份',
    body:'<div style="line-height:1.7">在 <a href="https://ima.qq.com/agent-interface" target="_blank" rel="noopener">ima.qq.com/agent-interface</a> 获取 <b>Client ID</b> 与 <b>API Key</b>，填写后仅保存在代理服务端（不会出现在浏览器）。</div>'
      + '<div style="margin-top:12px"><label class="fl">Client ID</label><input id="imaCid" type="text" placeholder="输入 Client ID" value=""></div>'
      + '<div style="margin-top:8px"><label class="fl">API Key</label><input id="imaKey" type="password" placeholder="输入 API Key" value=""></div>'
      + '<div class="muted" style="margin-top:10px">提示：此配置仅在使用本工具的 node 代理服务时生效；纯静态托管下不可用。</div>',
    onOk:function(){
      var cid=$('imaCid').value.trim(), key=$('imaKey').value.trim();
      if(!cid||!key){ toast('请填写 Client ID 与 API Key'); return false; }
      fetch('/api/ima/setup',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientId:cid,apiKey:key})})
        .then(function(r){ return r.json().then(function(j){return {ok:r.ok,j:j};}); })
        .then(function(res){
          if(res.ok && res.j && res.j.ok){ closeModal(); imaDoBackup(); }
          else { toast('配置失败：'+((res.j&&res.j.msg)||'代理未运行')); }
        }).catch(function(){ toast('保存失败，代理服务未运行'); });
      return false; // 异步完成后再关闭弹窗
    }
  });
}

function devSetStatus(id, st){
  var d = devById(id);
  if(!d){ return; }
  if(st==='借出' || st==='逾期'){
    toast('「借出」「逾期」为派生状态，不能在台账手动设置。请在「设备借用登记」中建立/归还借用记录，状态将自动叠加显示。');
    renderLedger(); return;
  }
  if(st==='已出库'){
    var _hasOut = DB.flows.some(function(f){ return f.type==='out' && f.devId===id; });
    if(!_hasOut){ toast('未找到该设备的出库（借领用）记录，不能手动设为「已出库」。请先在「出入库登记」中登记出库。'); renderLedger(); return; }
  }
  d.status = st;
  save(); render(); toast('状态已更新为「'+st+'」');
}
/* 删除出入库流水后，依据剩余流水重新核算设备「已出库/在用」状态。
   仅对当前处于这两态的设备生效，不动「闲置/故障/损坏」等手动状态。
   计算：净出库 = 出库(out)总数 -（被归还的out数 + 入库归还(in)数）；净出库>0 为已出库，否则在用 */
function recalcDevStatus(devId){
  var d = devById(devId);
  if(!d) return;
  if(d.status!=='已出库' && d.status!=='在用') return;
  var outN = DB.flows.filter(function(f){ return f.devId===devId && f.type==='out'; }).length;
  var retByReturn = DB.flows.filter(function(f){ return f.devId===devId && f.type==='out' && f.ret==='已归还'; }).length;
  var inN = DB.flows.filter(function(f){ return f.devId===devId && f.type==='in'; }).length;
  var netOut = outN - (retByReturn + inN);
  d.status = (netOut>0) ? '已出库' : '在用';
}

/* ======================= 事件委托 ======================= */

  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!el) return;
  var act = el.getAttribute('data-act');
  var id = el.getAttribute('data-id');

  if(act==='go'){ PAGE = el.getAttribute('data-page'); render(); }
  else if(act==='export'){ doExport(); }
  else if(act==='import'){ $('fileInput').click(); }
  else if(act==='exportCsv'){ exportCSV(); }
  else if(act==='importCsv'){ $('csvInput').click(); }
  else if(act==='imaBackup'){ imaBackup(); }
  else if(act==='snaps'){ openSnaps(); }
  else if(act==='fsaEnable'){ fsaEnable(); }
  else if(act==='fsaRechoose'){ fsaRechoose(); }
  else if(act==='snapRestore'){ restoreSnapshot(parseInt(el.getAttribute('data-i'),10)); closeModal(); }
  else if(act==='snapDel'){ deleteSnapshot(parseInt(el.getAttribute('data-i'),10)); }
  else if(act==='snapClear'){ clearSnapshots(); }
  else if(act==='wipeAll'){ wipeAll(); }
  else if(act==='hideTip'){ DB.meta.tipHidden=true; save(); renderAlerts(); }
  else if(act==='closeModal'){ closeModal(); }
  else if(act==='toggleGroup'){ UI.group=!UI.group; renderLedger(); }
  else if(act==='resetFilter'){ UI.kw=''; UI.cat=''; UI.loc=''; renderLedger(); }
  else if(act==='devNew'){ openModal({title:'新增设备台账', body:devForm(), onOk:function(){ return devSubmit(null); }}); }
  else if(act==='devEdit'){ var d=devById(id); openModal({title:'编辑设备 · '+d.code, body:devForm(d), onOk:function(){ return devSubmit(id); }}); }
  else if(act==='devQuickAdd'){ devQuickSubmit(); }
  else if(act==='importCsvDevice'){ $('csvDeviceInput').click(); }
  else if(act==='exportDeviceCsv'){ exportOne('devices'); }
  else if(act==='devDel'){
    var dd=devById(id);
    openConfirm('删除设备','确认删除「'+esc(dd.code+' '+dd.name)+'」？相关出入库与工单记录会保留但显示为已删除。', function(){
      DB.devices = DB.devices.filter(function(x){return x.id!==id;});
      save(); closeModal(); render(); toast('设备已删除');
    });
  }
  /* 设备使用状态通过台账列表中的下拉框修改（change 事件处理） */
  else if(act==='flowNew'){
    var tp = el.getAttribute('data-type');
    openModal({title: tp==='in'?'入库登记':'出库领用登记', body:flowForm(tp), onOk:function(){ return flowSubmit(tp); }});
  }
  else if(act==='flowReturn'){ flowReturn(id); }
  else if(act==='flowEdit'){ flowEdit(id); }
  else if(act==='flowDelPwd'){ flowDelPwd(id); }
  else if(act==='expFlows'){ exportOne('flows'); }
  else if(act==='flowReport'){ viewFlowReport(); }
  else if(act==='flowReportCsv'){ exportFlowReport(); }
  else if(act==='expRepairs'){ exportOne('repairs'); }
  else if(act==='rpReport'){ viewRepairReport(); }
  else if(act==='rpReportCsv'){ exportRepairReport(); }
  else if(act==='rpNew'){ openModal({title:'新建报修工单', body:rpForm(), onOk:function(){ return rpSubmit(null); }}); }
  else if(act==='rpEdit'){
    var r=DB.repairs.filter(function(x){return x.id===id;})[0];
    openModal({title:'编辑工单', body:rpForm(r), onOk:function(){ return rpSubmit(id); }});
  }
  else if(act==='rpFilter'){ UI.repairFilter = el.getAttribute('data-s'); renderRepair(); }
  else if(act==='borrowNew'){ openModal({title:'新建借用登记', body:borrowForm(), onOk:function(){ return borrowSubmit(null); }}); }
  else if(act==='borrowEdit'){ var bb=DB.borrows.filter(function(x){return x.id===id;})[0]; openModal({title:'编辑借用记录', body:borrowForm(bb), onOk:function(){ return borrowSubmit(id); }}); }

  else if(act==='borrowDelPwd'){ borrowDelPwd(id); }
  else if(act==='borrowFilter'){ UI.borrowFilter = el.getAttribute('data-s'); renderBorrow(); }
  else if(act==='borrowReport'){ viewBorrowReport(); }
  else if(act==='borrowReportCsv'){ exportBorrowReport(); }
  else if(act==='expBorrows'){ exportOne('borrows'); }
  else if(act==='calPrev'){ calView.m--; if(calView.m<0){ calView.m=11; calView.y--; } calRefresh(); }
  else if(act==='calNext'){ calView.m++; if(calView.m>11){ calView.m=0; calView.y++; } calRefresh(); }
  else if(act==='calDay'){ calDayDetail(el.getAttribute('data-date')); }
