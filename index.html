<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0071e3">
<title>教师办公工作台</title>
<style>
:root{
  /* Apple-inspired clean system */
  --teal:#0071e3; --teal-d:#0077ed; --teal-l:#e8f1fc; --teal-b:#b3d4f7;
  --blue:#0071e3; --blue-l:#e8f1fc;
  --danger:#ff3b30; --danger-l:#fff1f0; --danger-b:#ffc9c6;
  --warn:#ff9500; --warn-l:#fff8eb;
  --ok:#34c759; --ok-l:#eefbf1;
  --bg:#f5f5f7; --card:#ffffff; --line:#d2d2d7; --line-s:#ebebed;
  --text:#1d1d1f; --sub:#6e6e73; --muted:#86868b;
  --sh:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.03);
  --sh-h:0 2px 8px rgba(0,0,0,.06),0 12px 24px rgba(0,0,0,.06);
  --r:12px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.47;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.022em}
ul{margin:0;padding:0;list-style:none}
.hide{display:none !important}

/* ---------- 布局 ---------- */
.app{display:flex;min-height:100vh;min-height:100dvh}
.side{
  width:220px;flex:0 0 220px;background:rgba(251,251,253,.92);backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;z-index:20;
}
.brand{padding:18px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-s)}
.brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,#0071e3,#00c7be);display:flex;align-items:center;justify-content:center;flex:0 0 32px;box-shadow:0 2px 8px rgba(0,113,227,.25)}
.brand b{font-size:15px;display:block;line-height:1.25;letter-spacing:-.02em}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.nav{padding:10px 8px;flex:1;overflow:auto}
.nav button{
  width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
  color:var(--sub);font-size:14px;font-weight:500;margin-bottom:2px;text-align:left;transition:background .15s,color .15s;
}
.nav button:hover{background:rgba(0,0,0,.04);color:var(--text)}
.nav button.on{background:var(--teal-l);color:var(--teal);font-weight:600}
.nav button.on svg{stroke:var(--teal)}
.nav .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;min-width:18px;text-align:center}
.nav .badge.g{background:#e8e8ed;color:#6e6e73}
.side-foot{padding:12px;border-top:1px solid var(--line-s);display:flex;flex-direction:column;gap:7px}
/* ---------- 侧栏待办日历 ---------- */
.cal{padding:10px 12px 12px;border-top:1px solid var(--line-s);background:#fbfdfd}
.cal-h{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.cal-h .m{font-size:13.5px;font-weight:600;color:var(--text)}
.cal-h button{width:24px;height:24px;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:14px;line-height:1;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.cal-h button:hover{border-color:var(--teal-b);color:var(--teal)}
.cal-h .today{margin-left:auto;border:1px solid var(--teal-b);background:var(--teal-l);color:var(--teal);border-radius:7px;height:24px;padding:0 9px;font-size:11.5px;font-weight:700;cursor:pointer}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-bottom:3px}
.cal-dow span{font-size:10.5px;color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-d{position:relative;border-radius:7px;padding:3px 0 5px;text-align:center;cursor:pointer;background:#f6f8f8;min-height:30px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;transition:.12s}
.cal-d:hover{background:#eef6f5}
.cal-d .dn{font-size:12px;line-height:1;color:var(--sub);font-weight:500}
.cal-d.done{background:var(--ok-l)}
.cal-d.done .dn{color:var(--ok);font-weight:700}
.cal-d.has{background:var(--teal-l)}
.cal-d.has .dn{color:var(--text);font-weight:600}
.cal-d.od{background:#fdeaea}
.cal-d.od .dn{color:#c0392b;font-weight:800}
.cal-d.today{border:1.5px solid var(--teal);background:var(--teal-l);padding:1.5px 0 5px}
.cal-d.today .dn{color:var(--teal);font-weight:700}
.cal-d.other{background:transparent;cursor:default}
.cal-d.other .dn{color:#c2c8cc}
.cal-d .bar{width:72%;height:4px;border-radius:3px;background:#d8e2e0;margin-top:4px;overflow:hidden}
.cal-d .bar i{display:block;height:100%;background:var(--ok)}
.cal-d .bar i.ok{background:var(--ok)}
.cal-d .bar i.rem{background:var(--danger)}
.cal-d .plus{position:absolute;top:0;right:0;width:15px;height:15px;border:0;background:transparent;color:var(--teal);font-size:14px;line-height:15px;opacity:0;cursor:pointer;padding:0}
.cal-d:hover .plus{opacity:.75}
.cal-d .plus:hover{opacity:1}
.cal-sum{margin-top:9px;padding-top:9px;border-top:1px solid var(--line-s)}
.cal-sum .row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--sub)}
.cal-sum .row b{color:var(--text);font-weight:600}
.cal-sum .bar{height:6px;background:#e2e8e6;border-radius:4px;margin-top:6px;overflow:hidden}
.cal-sum .bar i{display:block;height:100%;background:var(--teal)}
.cal-sum .hint{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.cal-flt{display:flex;align-items:center;gap:8px;background:var(--teal-l);border:1px solid var(--teal-b);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:13.5px;color:var(--teal)}
.cal-flt .ct{font-weight:600}
.cal-flt .cn{color:var(--sub);font-size:12.5px}
.cal-flt .btn{margin-left:auto}
.main{flex:1;min-width:0;padding:0 0 60px}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}

/* ---------- 页头插画 ---------- */
.hero{position:relative;height:120px;overflow:hidden;background:linear-gradient(135deg,#1d1d1f 0%,#2c2c2e 55%,#0071e3 160%)}
.hero svg{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:.35}
.hero-txt{position:relative;max-width:1140px;margin:0 auto;padding:28px 24px;color:#fff}
.hero-txt h1{font-size:22px;letter-spacing:-.03em;font-weight:600}
.hero-txt p{margin:6px 0 0;font-size:13px;opacity:.72;font-weight:400}

/* ---------- 通用卡片 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.sec{margin-top:20px}
.sec-h{display:flex;align-items:center;gap:9px;margin:0 0 12px}
.sec-h h2{font-size:17px;letter-spacing:-.02em}
.sec-h .cnt{font-size:12px;color:var(--muted);background:#f5f5f7;padding:2px 9px;border-radius:20px}
.sec-h .sp{flex:1}
.pad{padding:16px 18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 16px;border-radius:980px;font-size:14px;font-weight:500;
  background:#fff;border:1px solid var(--line);color:var(--sub);transition:opacity .15s,background .15s;min-height:36px;
}
.btn:hover{background:#f5f5f7;color:var(--text)}
.btn.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.pri:hover{opacity:.9;color:#fff;background:var(--teal)}
.btn.dgr{color:var(--danger);border-color:var(--danger-b);background:#fff}
.btn.dgr:hover{background:var(--danger-l)}
.btn.sm{padding:4px 12px;font-size:12.5px;min-height:28px;border-radius:980px;font-weight:500}
.btn.blk{width:100%}
.btn svg{flex:0 0 auto}
.btn.ima{color:var(--teal);border-color:var(--teal-b);background:var(--teal-l)}
.btn.ima:hover{background:#d6e8fa;color:var(--teal)}
.ima-link{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--teal);text-decoration:none;background:var(--teal-l);border:1px solid var(--teal-b);padding:2px 8px;border-radius:20px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:980px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:6px 14px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--teal);color:#fff}
.fsel{height:34px;border:1px solid var(--line);border-radius:9px;padding:0 8px;font-size:13px;background:#fff;color:var(--sub);max-width:150px}
@media(max-width:600px){ .seg button{padding:6px 10px} }
.ima-link:hover{background:#d6e8fa}
.ima-link svg{width:11px;height:11px}

/* ---------- 表单 ---------- */
.f{display:grid;gap:10px}
.f label{font-size:12.5px;font-weight:600;color:var(--sub);display:block;margin-bottom:4px}
.f input,.f select,.f textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;
  font-size:16px;outline:none;transition:.15s;
}
.f textarea{resize:vertical;min-height:64px;line-height:1.55}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,113,227,.15)}
.frow{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.hint{font-size:12px;color:var(--muted)}

/* ---------- 徽标 ---------- */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;letter-spacing:.02em}
.p0{background:#fee2e2;color:#b91c1c}
.p1{background:#fef3c7;color:#a16207}
.p2{background:#e2e8f0;color:#475569}
.pt{background:var(--teal-l);color:var(--teal)}
.pb{background:var(--blue-l);color:#0369a1}
.pr{background:#fee2e2;color:#b91c1c}
.pg{background:var(--ok-l);color:var(--ok)}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:6px;background:#eef2f5;color:var(--sub);margin:2px 4px 2px 0;font-weight:500}
.tag.on{background:var(--teal);color:#fff}
.tag.cl{cursor:pointer;transition:.12s}
.tag.cl:hover{background:var(--teal-b)}

/* ---------- 今天要处理 ---------- */
.today{border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--sh);overflow:hidden;margin-top:-28px;position:relative;z-index:5}
.today-h{padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-s);background:#fff}
.today-h h2{font-size:16px;letter-spacing:-.02em}
.today-h .dt{font-size:12.5px;color:var(--muted);margin-left:auto}
.trow{
  display:flex;align-items:flex-start;gap:11px;padding:11px 18px;border-bottom:1px solid var(--line-s);
}
.trow:last-child{border-bottom:none}
.trow .bd{flex:1;min-width:0}
.trow .tt{font-size:14.5px;font-weight:600;line-height:1.45}
.trow .mt{font-size:12px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.trow.red{background:var(--danger-l)}
.trow.red .tt{color:#b91c1c}
.trow .acts{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:8px}
.dot.r{background:var(--danger)} .dot.t{background:var(--teal)} .dot.y{background:#f59e0b}
.empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:13.5px}
.empty svg{display:block;margin:0 auto 8px;opacity:.5}

/* ---------- 列表条目 ---------- */
.item{padding:13px 16px;border-bottom:1px solid var(--line-s);display:flex;gap:11px;align-items:flex-start}
.item:last-child{border-bottom:none}
.item:hover{background:#fafcfd}
.chk{
  width:22px;height:22px;flex:0 0 22px;border:2px solid #d2d2d7;border-radius:50%;margin-top:1px;
  display:flex;align-items:center;justify-content:center;transition:.15s;background:#fff;
}
.chk:hover{border-color:var(--teal)}
.chk.on{background:var(--teal);border-color:var(--teal)}
.item .bd{flex:1;min-width:0}
.item .tt{font-weight:600;font-size:14px;line-height:1.45;word-break:break-word}
.item.done .tt{text-decoration:line-through;color:var(--muted);font-weight:500}
.item .mt{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.item .acts{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.item .bd .note{font-size:12px;color:var(--sub);margin-top:5px;display:flex;gap:5px;align-items:flex-start;line-height:1.45;word-break:break-word}
.item .bd .note svg{flex:0 0 auto;margin-top:2px;color:var(--muted)}
.overdue{color:var(--danger) !important;font-weight:700}
.daygrp{padding:9px 16px;background:#f7fafb;border-bottom:1px solid var(--line-s);font-size:13px;font-weight:700;color:var(--sub);display:flex;gap:8px;align-items:center}
.daygrp .n{color:var(--muted);font-weight:500;font-size:12px}
.daygrp.rd{background:var(--danger-l);color:#b91c1c}

/* ---------- 统计卡 ---------- */
.stat{padding:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.stat .lb{font-size:12px;color:var(--muted);font-weight:500}
.stat .vl{font-size:28px;font-weight:600;line-height:1.2;letter-spacing:-.03em;margin-top:4px}
.stat .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.stat.t .vl{color:var(--teal)} .stat.r .vl{color:var(--danger)} .stat.b .vl{color:var(--blue)}

/* ---------- 进度条 ---------- */
.bar{height:6px;background:#f5f5f7;border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:20px;transition:width .35s ease}
.bar.rd i{background:var(--danger)}

/* ---------- 提醒条 ---------- */
.notice{
  display:flex;align-items:center;gap:10px;padding:11px 15px;border-radius:11px;margin-top:14px;
  background:var(--warn-l);border:1px solid #fde68a;color:#92400e;font-size:13.5px;font-weight:500;
}
.notice .sp{flex:1}
.notice button{color:#92400e}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
@media(min-width:640px){.mask{align-items:center;padding:20px}}
.modal{background:#fff;border-radius:16px 16px 0 0;max-width:520px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 -8px 40px rgba(0,0,0,.12)}
@media(min-width:640px){.modal{border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.18)}}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line-s);display:flex;align-items:center;gap:9px;position:sticky;top:0;background:#fff;z-index:1}
.modal-h h3{font-size:17px;flex:1;letter-spacing:-.02em}
.modal-b{padding:18px 20px}
.modal-f{padding:14px 20px 20px;border-top:1px solid var(--line-s);display:flex;gap:10px;justify-content:flex-end;background:#fff;position:sticky;bottom:0}

/* ---------- 移动端 ---------- */
.mtop{display:none}
.tabbar{display:none}
@media(max-width:860px){
  .side{display:none}
  .g4,.g3,.g2{grid-template-columns:1fr}
  .g4.keep2,.g2.keep2{grid-template-columns:repeat(2,1fr)}
  .wrap{padding:0 14px}
  .hero{height:100px}
  .hero-txt{padding:22px 14px}
  .hero-txt h1{font-size:19px}
  .main{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  .mtop{
    display:flex;align-items:center;gap:8px;padding:10px 14px;
    background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(16px);
    -webkit-backdrop-filter:saturate(180%) blur(16px);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;
  }
  .mtop b{font-size:16px;flex:1;letter-spacing:-.02em}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;
    background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:1px solid var(--line);
    z-index:40;padding-bottom:env(safe-area-inset-bottom);
    overflow-x:auto;-webkit-overflow-scrolling:touch;
  }
  .tabbar::-webkit-scrollbar{display:none}
  .tabbar button{
    flex:0 0 auto;min-width:64px;padding:8px 8px 6px;display:flex;flex-direction:column;
    align-items:center;gap:2px;font-size:10px;color:var(--muted);min-height:54px;font-weight:500;
  }
  .tabbar button.on{color:var(--teal)}
  .tabbar button.on svg{stroke:var(--teal)}
  .tabbar .bdot{position:absolute;top:6px;margin-left:18px;width:6px;height:6px;background:var(--danger);border-radius:50%}
  .btn{min-height:42px;padding:10px 16px;font-size:15px}
  .btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
  .chk{width:26px;height:26px;flex:0 0 26px}
  .item{padding:14px}
  .trow{padding:13px 14px}
  .pad{padding:14px}
  .modal-f{flex-direction:column-reverse}
  .modal-f .btn{width:100%}
  .stat .vl{font-size:24px}
}
@media(min-width:861px){ .m-only{display:none !important} }

/* ---------- 周课表网格 ---------- */
.wk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.wk-day{background:#f7fafb;border:1px solid var(--line-s);border-radius:11px;padding:9px 8px;display:flex;flex-direction:column;gap:7px;min-height:84px}
.wk-day.today{background:var(--teal-l);border-color:var(--teal-b)}
.wk-day h4{font-size:12.5px;font-weight:700;color:var(--sub);margin:0 0 2px;display:flex;align-items:center;gap:5px}
.wk-day.today h4{color:var(--teal)}
.sch-item{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;line-height:1.4}
.sch-item .t{font-weight:700;font-size:12.5px}
.sch-item .m{color:var(--muted);font-size:11px;margin-top:2px}
.sch-item.t-课{border-left:3px solid var(--teal)}
.sch-item.t-坐班{border-left:3px solid var(--blue)}
.sch-item.t-值班{border-left:3px solid #b45309}
.sch-item.t-教研{border-left:3px solid #7c3aed}
.sch-item.t-会议{border-left:3px solid #0891b2}
.sch-item.t-其他{border-left:3px solid #94a3b8}
/* ---------- 学生卡 ---------- */
.stu{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff}
.stu .nm{font-weight:600;font-size:14px}
.stu .ph{font-size:12px;color:var(--muted);margin-top:1px}
.stu .acts{margin-left:auto;display:flex;gap:5px}
/* ---------- 台账行 ---------- */
.led-row{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-s)}
.led-row:last-child{border-bottom:none}
.led-row .bd{flex:1;min-width:0}
.led-row .mt{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media(max-width:860px){ .wk-grid{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>

<div class="app">
  <!-- ============ 左侧导航 ============ -->
  <aside class="side">
    <div class="brand">
      <div class="logo">

/* ---------------- 工具 ---------------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return n<10?'0'+n:''+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return ymd(new Date());}
function shift(str,n){var p=str.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return ymd(d);}
function toDate(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function diffDays(a,b){return Math.round((toDate(a)-toDate(b))/86400000);}
function cnDate(s){if(!s||typeof s!=='string'||s.indexOf('-')<0)return'';var p=s.split('-');return (+p[1])+'月'+(+p[2])+'日';}
function weekName(s){if(!s||typeof s!=='string'||s.indexOf('-')<0)return'';return ['周日','周一','周二','周三','周四','周五','周六'][toDate(s).getDay()];}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function nl(s){return esc(s).replace(/\n/g,'<br>');}
function $(id){return document.getElementById(id);}
function weekStartOf(d){var x=new Date(d);var k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);x.setHours(0,0,0,0);return x;}
function parseTags(s){return String(s||'').split(/[,，、\s]+/).map(function(t){return t.trim();}).filter(Boolean).slice(0,8);}
function num(v){if(v===undefined||v===null||v==='')return null;var n=Number(v);return isNaN(n)?null:n;}
function nz(v){if(v===undefined||v===null||v==='')return undefined;v=String(v).trim();if(v==='')return undefined;var n=Number(v);return isNaN(n)?undefined:n;}
function nv(v){return (v===undefined||v===null||v==='')?'':v;}
function stuTotal(s){var a=num(s.att),u=num(s.usual),f=num(s.final);if(a===null||u===null||f===null)return null;return Math.round(a*0.1+u*0.4+f*0.5);}
function csvCell(v){v=String(v==null?'':v);if(v.indexOf(',')>=0||v.indexOf('"')>=0||v.indexOf('\n')>=0)return '"'+v.replace(/"/g,'""')+'"';return v;}
function parseCSV(text){
  text=String(text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  var rows=[],i=0,field='',row=[],inQ=false;
  while(i<text.length){
    var ch=text[i];
    if(inQ){
      if(ch==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQ=false;}
      else field+=ch;
    }else{
      if(ch==='"')inQ=true;
      else if(ch===','){row.push(field);field='';}
      else if(ch==='\n'){row.push(field);rows.push(row);row=[];field='';}
      else if(ch==='\t'){row.push(field);field='';}
      else field+=ch;
    }
    i++;
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows.filter(function(r){return r.length>1||(r.length===1&&r[0].trim()!=='');});
}

/* ---------------- 数据 ---------------- */
function seed(){
  // 默认打开即为干净页面，不预置任何示例数据
  return {
    ver:1, lastRoll:'', lastExport:'', noticeAt:0,
    projects:[], todos:[], meetings:[], ideas:[],
    sched:[], classes:[], students:[], attend:[], talks:[], assets:[], reports:[]
  };
}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw){DB=seed();save();return;}
    DB=JSON.parse(raw);
    ['projects','todos','meetings','ideas','sched','classes','students','attend','talks','assets','reports'].forEach(function(k){if(!Array.isArray(DB[k]))DB[k]=[];});
    /* 字段兜底：防止历史/异常数据缺字段导致渲染时整页崩溃（如 x.pri.toLowerCase()） */
    DB.todos.forEach(function(x){ if(!x||typeof x!=='object')return; if(!x.pri)x.pri='P2'; if(x.roll===undefined)x.roll=0; if(x.done===undefined)x.done=0; if(x.due===undefined)x.due=''; if(x.note===undefined)x.note=''; });
    DB.meetings.forEach(function(x){ if(!x||typeof x!=='object')return; if(!x.pri)x.pri='P2'; if(!x.date)x.date=''; if(x.content===undefined)x.content=''; if(!Array.isArray(x.tags))x.tags=[]; });
  }catch(e){DB=seed();}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(DB));}
  catch(e){alert('保存失败：浏览器存储空间可能已满。建议先导出备份，再清理一部分旧数据。');}
}
function total(){return DB.todos.length+DB.meetings.length+DB.ideas.length+DB.projects.length+DB.reports.length;}

/* ---------------- 自动顺延 ---------------- */
/* 昨天及更早未完成的任务，自动挪到今天，并累计顺延次数（不会消失） */
function autoRoll(){
  var t=today();
  if(DB.lastRoll===t) return 0;
  var n=0;
  DB.todos.forEach(function(x){
    if(!x.done && x.due && x.due<t){
      if(!x.origDue) x.origDue=x.due;
      x.roll=(x.roll||0)+1;
      x.due=t;
      n++;
    }
  });
  DB.lastRoll=t;
  save();
  return n;
}

/* ---------------- 派生 ---------------- */
function projById(id){for(var i=0;i<DB.projects.length;i++){if(DB.projects[i].id===id)return DB.projects[i];}return null;}
function projStat(pid){
  var all=DB.todos.filter(function(x){return x.pid===pid;});
  var d=all.filter(function(x){return x.done;}).length;
  return {all:all.length,done:d,pct:all.length?Math.round(d*100/all.length):0,list:all};
}
function overdueTodos(){ // 今天要处理里"标红"的：曾被顺延过、且仍未完成
  var t=today();
  return DB.todos.filter(function(x){return !x.done && (x.roll>0) && x.due<=t;});
}
function dueTodayTodos(){
  var t=today();
  return DB.todos.filter(function(x){return !x.done && x.due===t && !(x.roll>0);});
}
function blockedProjects(){
  return DB.projects.filter(function(p){return p.status==='blocked' || (p.blocker&&p.blocker.trim());});
}
function todayMeetings(){var t=today();return DB.meetings.filter(function(m){return m.date===t;});}
function allTags(arr){
  var m={};arr.forEach(function(x){(x.tags||[]).forEach(function(t){m[t]=(m[t]||0)+1;});});
  return Object.keys(m).sort(function(a,b){return m[b]-m[a];}).map(function(k){return {t:k,n:m[k]};});
}

/* ---------- 侧栏待办日历 ---------- */
var CAL={y:0,m:0};        // 当前查看的年月（m:1-12）
var TODO_DATE='';         // 待办按日期筛选；''=不过滤
var EDIT_TODO_ID='';       // 待办编辑中：正在改的那条 id；''=新增模式

function renderCalendar(){
  var box=$('calBox'); if(!box) return;
  if(!CAL.y){var nd=new Date();CAL.y=nd.getFullYear();CAL.m=nd.getMonth()+1;}
  var y=CAL.y, m=CAL.m, t=today();
  var first=new Date(y,m-1,1);
  var startDow=(first.getDay()+6)%7;                 // 周一为0
  var days=new Date(y,m,0).getDate();
  function stat(dstr){
    var all=DB.todos.filter(function(x){return x.due===dstr;});
    return {total:all.length, done:all.filter(function(x){return x.done;}).length};
  }
  var html='<div class="cal-h"><span class="m">'+y+'年'+m+'月</span>'+
    '<button onclick="calPrev()" aria-label="上个月">‹</button>'+
    '<button onclick="calNext()" aria-label="下个月">›</button>'+
    '<button class="today" onclick="calToday()">今</button></div>';
  html+='<div class="cal-dow"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>';
  html+='<div class="cal-grid">';
  var prevDays=new Date(y,m-1,0).getDate();
  for(var i=0;i<startDow;i++){ html+='<div class="cal-d other"><span class="dn">'+(prevDays-startDow+1+i)+'</span></div>'; }
  var monthDone=0, monthTotal=0;
  for(var d=1;d<=days;d++){
    var ds=ymd(new Date(y,m-1,d)), s=stat(ds);
    monthDone+=s.done; monthTotal+=s.total;
    var cls='cal-d';
    if(ds===t) cls+=' today';
    if(s.total){
      if(s.done===s.total) cls+=' done';        // 全部完成 -> 绿
      else if(ds<t) cls+=' od';                 // 逾期未完成 -> 红
      else cls+=' has';                         // 有未完成、未到期 -> 青
    }
    var bar='';
    if(s.total){
      if(s.done===s.total){
        bar='<div class="bar"><i class="ok" style="width:100%"></i></div>';
      }else{
        var rem=Math.round((s.total-s.done)/s.total*100);   // 未完成比例 -> 红色条
        bar='<div class="bar"><i class="rem" style="width:'+rem+'%"></i></div>';
      }
    }
    html+='<div class="'+cls+'" onclick="gotoTodoDate(\''+ds+'\')">'+
      '<button class="plus" onclick="event.stopPropagation();addTodoOn(\''+ds+'\')" title="添加这天任务">+</button>'+
      '<span class="dn">'+d+'</span>'+bar+'</div>';
  }
  var rem=(7-((startDow+days)%7))%7;
  for(var j=1;j<=rem;j++){ html+='<div class="cal-d other"><span class="dn">'+j+'</span></div>'; }
  html+='</div>';
  var pctM=monthTotal?Math.round(monthDone/monthTotal*100):0;
  html+='<div class="cal-sum"><div class="row"><span>本月完成</span><b>'+monthDone+' / '+monthTotal+' · '+pctM+'%</b></div>'+
    '<div class="bar"><i style="width:'+pctM+'%"></i></div>'+

/* ---------- 待办 ---------- */
function renderTodo(){
  var t=today();
  var df=TODO_DATE||t;
  var undone=DB.todos.filter(function(x){return !x.done;});
  var done=DB.todos.filter(function(x){return x.done;}).sort(function(a,b){return (b.doneAt||'')<(a.doneAt||'')?-1:1;});
  // 分组：逾期(顺延过) / 今天 / 明天 / 本周内 / 更远 / 未设日期
  var G={od:[],today:[],tmr:[],week:[],later:[],none:[]};
  undone.forEach(function(x){
    if(!x.due){G.none.push(x);return;}
    if(x.roll>0&&x.due<=t){G.od.push(x);return;}
    var d=diffDays(x.due,t);
    if(d<0)G.od.push(x); else if(d===0)G.today.push(x); else if(d===1)G.tmr.push(x);
    else if(d<=7)G.week.push(x); else G.later.push(x);
  });
  var pOrd={P0:0,P1:1,P2:2};
  Object.keys(G).forEach(function(k){G[k].sort(function(a,b){
    if(a.due!==b.due)return (a.due||'9999')<(b.due||'9999')?-1:1;
    return pOrd[a.pri]-pOrd[b.pri];});});

  var ed=EDIT_TODO_ID?(DB.todos.filter(function(x){return x.id===EDIT_TODO_ID;})[0]||null):null;
  var priOpts=[['P0','P0 紧急重要'],['P1','P1 重要'],['P2','P2 常规']].map(function(o){
    return '<option value="'+o[0]+'"'+(ed?(ed.pri===o[0]?' selected':''):(o[0]==='P1'?' selected':''))+'>'+o[1]+'</option>';
  }).join('');
  var opts='<option value="">不关联项目</option>'+DB.projects.map(function(p){
    return '<option value="'+p.id+'"'+(ed&&ed.pid===p.id?' selected':'')+'>'+esc(p.name)+'</option>';
  }).join('');
  var form='<div class="card pad"><div class="f">'+
    '<div><label>任务内容</label><input id="tdT" placeholder="要做什么，写清楚一点" value="'+esc(ed?ed.title:'')+'"></div>'+
    '<div class="frow">'+
      '<div><label>轻重缓急</label><select id="tdP">'+priOpts+'</select></div>'+
      '<div><label>截止日期</label><input id="tdD" type="date" value="'+esc(ed?ed.due:df)+'"></div>'+
      '<div><label>挂到项目下</label><select id="tdJ">'+opts+'</select></div>'+
    '</div>'+
    '<div><label>备注</label><textarea id="tdN" rows="2" placeholder="补充说明、链接、注意事项…">'+esc(ed?ed.note:'')+'</textarea></div>'+
    '<div class="frow" style="align-items:center">'+
      (ed
        ? '<button class="btn pri" onclick="saveTodoEdit()">'+ic('ok',15)+'保存修改</button><button class="btn" onclick="cancelTodoEdit()">'+ic('x',14)+'取消</button>'
        : '<button class="btn pri" onclick="addTodo()">'+ic('plus',15)+'添加任务</button>')+
    '</div>'+
  '</div></div>';

  function grp(title,list,red,note){
    if(!list.length)return '';
    return '<div class="daygrp'+(red?' rd':'')+'">'+(red?ic('warn',13):'')+'<span>'+title+'</span><span class="n">'+list.length+' 项'+(note?' · '+note:'')+'</span></div>'+list.map(row).join('');
  }
  function row(x){
    var p=x.pid?projById(x.pid):null;
    var late=x.roll>0&&!x.done;
    return '<div class="item'+(x.done?' done':'')+'">'+
      '<button class="chk'+(x.done?' on':'')+'" onclick="toggleTodo(\''+x.id+'\')" aria-label="完成">'+(x.done?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>':'')+'</button>'+
      '<div class="bd"><div class="tt">'+esc(x.title)+'</div><div class="mt">'+
        '<span class="pill '+x.pri.toLowerCase()+'">'+x.pri+'</span>'+
        (x.due?'<span class="'+(late?'overdue':'')+'">'+cnDate(x.due)+' '+weekName(x.due)+'</span>':'<span>未设日期</span>')+
        (late?'<span class="overdue">'+ic('warn',11)+' 已顺延 '+x.roll+' 次'+(x.origDue?'（原定 '+cnDate(x.origDue)+'）':'')+'</span>':'')+
        (p?'<span class="pill pt">'+ic('link',10)+' '+esc(p.name)+'</span>':'')+
        (x.done&&x.doneAt?'<span>完成于 '+cnDate(x.doneAt)+'</span>':'')+
      '</div>'+
      (x.note?'<div class="note">'+ic('note',12)+' <span>'+esc(x.note)+'</span></div>':'')+
      '</div>'+
      '<div class="acts">'+(x.done?'':'<button class="btn sm" onclick="postpone(\''+x.id+'\')" title="顺延到明天">'+ic('next',13)+'</button>')+
      '<button class="btn sm" onclick="editTodo(\''+x.id+'\')" title="修改">'+ic('edit',13)+'</button>'+
      '<button class="btn sm dgr" onclick="delItem(\'todos\',\''+x.id+'\')">'+ic('trash',13)+'</button></div></div>';
  }
  if(TODO_DATE){
    var ds=TODO_DATE;
    var all=DB.todos.filter(function(x){return x.due===ds;}).sort(function(a,b){
      if(a.done!==b.done)return a.done?1:-1;
      if(a.due!==b.due)return (a.due||'9999')<(b.due||'9999')?-1:1;
      return pOrd[a.pri]-pOrd[b.pri];});
    var banner='<div class="cal-flt"><span>'+ic('today',15,1.8)+'</span><span class="ct">'+cnDate(ds)+' '+weekName(ds)+' 的待办</span><span class="cn">'+all.length+' 项</span><button class="btn sm" onclick="clearTodoDate()">清除筛选</button></div>';
    var body=all.length?'<div class="card" style="overflow:hidden">'+all.map(row).join('')+'</div>':'<div class="card empty">'+ic('plus',24,1.6)+'这天还没有待办，点下方「添加任务」或左侧日历上的 + 加一条</div>';
    return '<div class="sec"><div class="sec-h">'+ic('todo',19,1.9)+'<h2>待办事项</h2><span class="cnt">未完成 '+undone.length+'</span></div>'+banner+form+body+'</div>';
  }
  var list='<div class="card" style="overflow:hidden">'+
    grp('逾期未完成（已自动挪到今天）',G.od,1,'昨天没做完的不会消失')+
    grp('今天',G.today)+grp('明天',G.tmr)+grp('未来 7 天',G.week)+grp('更远的计划',G.later)+grp('未设日期',G.none)+
    (undone.length?'':'<div class="empty">'+ic('ok',26,1.6)+'待办都清完了</div>')+
    '</div>';
  var dn=done.length?'<div class="sec"><div class="sec-h"><h2>已完成</h2><span class="cnt">'+done.length+'</span></div>'+
    '<div class="card" style="overflow:hidden">'+done.slice(0,40).map(row).join('')+'</div></div>':'';

  return '<div class="sec"><div class="sec-h">'+ic('todo',19,1.9)+'<h2>待办事项</h2><span class="cnt">未完成 '+undone.length+'</span></div>'+
    form+'<div class="sec">'+list+'</div>'+dn+'</div>';
}

/* ---- SVG 图表：环形 ---- */
function svgDonut(data,tot){
  if(!tot){return '<div class="empty" style="padding:34px 10px">'+ic('week',24,1.6)+'本周还没有完成的任务</div>';}
  var R=54,r=34,cx=70,cy=70,acc=-Math.PI/2,seg='';
  data.forEach(function(d){
    if(!d.v)return;
    var a=d.v/tot*Math.PI*2, e=acc+a, big=a>Math.PI?1:0;
    var x1=cx+R*Math.cos(acc),y1=cy+R*Math.sin(acc),x2=cx+R*Math.cos(e),y2=cy+R*Math.sin(e);
    var x3=cx+r*Math.cos(e),y3=cy+r*Math.sin(e),x4=cx+r*Math.cos(acc),y4=cy+r*Math.sin(acc);
    if(d.v===tot){
      seg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+((R+r)/2)+'" fill="none" stroke="'+d.c+'" stroke-width="'+(R-r)+'"/>';
    }else{
      seg+='<path d="M'+x1.toFixed(2)+' '+y1.toFixed(2)+' A'+R+' '+R+' 0 '+big+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+
           ' L'+x3.toFixed(2)+' '+y3.toFixed(2)+' A'+r+' '+r+' 0 '+big+' 0 '+x4.toFixed(2)+' '+y4.toFixed(2)+' Z" fill="'+d.c+'"/>';
    }
    acc=e;
  });
  var legend=data.map(function(d){
    var p=tot?Math.round(d.v*100/tot):0;
    return '<div style="display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0">'+
      '<span style="width:10px;height:10px;border-radius:3px;background:'+d.c+';flex:0 0 10px"></span>'+
      '<span style="flex:1;color:var(--sub)">'+d.n+'</span><b>'+d.v+'</b><span class="hint">'+p+'%</span></div>';
  }).join('');
  return '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">'+
    '<svg width="140" height="140" viewBox="0 0 140 140" style="flex:0 0 140px">'+seg+
    '<text x="70" y="66" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">'+tot+'</text>'+
    '<text x="70" y="84" text-anchor="middle" font-size="11" fill="#8291a3">件完成</text></svg>'+
    '<div style="flex:1;min-width:150px">'+legend+'</div></div>';
}
/* ---- SVG 图表：横向条 ---- */
function svgBars(arr){
  if(!arr.length)return '<div class="empty" style="padding:20px 10px">本周还没有完成的任务，无法统计精力分布</div>';
  var max=Math.max.apply(null,arr.map(function(a){return a.v;}));
  var tot=arr.reduce(function(s,a){return s+a.v;},0);
  var C=['#0d9488','#0284c7','#14b8a6','#0891b2','#22d3ee','#5eead4','#7dd3fc'];
  return '<div style="display:flex;flex-direction:column;gap:11px">'+arr.map(function(a,i){
    var w=Math.round(a.v*100/max), p=Math.round(a.v*100/tot);
    return '<div>'+
      '<div style="display:flex;font-size:13.2px;margin-bottom:4px"><span style="flex:1;color:var(--sub);font-weight:500">'+esc(a.n)+'</span><b>'+a.v+' 件</b><span class="hint" style="margin-left:7px">'+p+'%</span></div>'+
      '<svg width="100%" height="12" viewBox="0 0 100 12" preserveAspectRatio="none" style="display:block">'+
        '<rect x="0" y="1" width="100" height="10" rx="5" fill="#eef2f5"/>'+
        '<rect x="0" y="1" width="'+w+'" height="10" rx="5" fill="'+C[i%C.length]+'"/>'+
      '</svg></div>';
  }).join('')+'</div>';
}
/* ---- SVG 图表：一周柱状 ---- */
function svgWeekCols(days){
  var max=Math.max(1,Math.max.apply(null,days.map(function(d){return d.v;})));
  var W=320,H=140,pb=26,pt=14,bw=26,gap=(W-7*bw)/8;
  var t=today(),bars='',lbl='';
  days.forEach(function(d,i){
    var x=gap+i*(bw+gap), h=Math.round((H-pb-pt)*d.v/max), y=H-pb-h;
    var isT=d.d===t;
    bars+='<rect x="'+x.toFixed(1)+'" y="'+(d.v?y:H-pb-2)+'" width="'+bw+'" height="'+(d.v?h:2)+'" rx="4" fill="'+(isT?'#0d9488':(d.v?'#5eead4':'#e5eaee'))+'"/>';
    if(d.v)bars+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">'+d.v+'</text>';
    lbl+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="11" fill="'+(isT?'#0f766e':'#8291a3')+'" font-weight="'+(isT?'700':'400')+'">'+weekName(d.d).slice(1)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="150" preserveAspectRatio="xMidYMid meet">'+
    '<line x1="0" y1="'+(H-pb)+'" x2="'+W+'" y2="'+(H-pb)+'" stroke="#e5eaee" stroke-width="1"/>'+bars+lbl+'</svg>';
}
/* ---- SVG 图表：通用分桶柱状（月/年复盘用） ---- */
function svgBarChart(buckets){
  if(!buckets.length)return '<div class="empty">暂无数据</div>';
  var max=Math.max(1,Math.max.apply(null,buckets.map(function(b){return b.v;})));
  var n=buckets.length, W=Math.max(300,n*50), H=150, pb=24, pt=12;
  var bw=Math.min(40,Math.max(18,(W-30)/n-12)), gap=(W-bw*n)/(n+1);
  var t=today(),bars='',lbl='';
  buckets.forEach(function(b,i){
    var x=gap+i*(bw+gap), h=Math.round((H-pb-pt)*b.v/max), y=H-pb-h;
    var isT=(b.s<=t&&t<=b.e);
    bars+='<rect x="'+x.toFixed(1)+'" y="'+(b.v?y:H-pb-2).toFixed(1)+'" width="'+bw+'" height="'+(b.v?h:2)+'" rx="4" fill="'+(b.v?(isT?'#0d9488':'#5eead4'):'#e5eaee')+'"/>';
    if(b.v)bars+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">'+b.v+'</text>';
    lbl+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10.5" fill="#8291a3">'+esc(b.l)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="150" preserveAspectRatio="xMidYMid meet"><line x1="0" y1="'+(H-pb)+'" x2="'+W+'" y2="'+(H-pb)+'" stroke="#e5eaee" stroke-width="1"/>'+bars+lbl+'</svg>';
}
/* ---- 复盘区间：周 / 月 / 年 ---- */
function reviewRange(scope){
  var now=new Date(), y=now.getFullYear(), m=now.getMonth();
  if(scope==='month'){
    var wsS=ymd(new Date(y,m,1)), weS=ymd(new Date(y,m+1,0));
    var pm0=m-1, py=y; if(pm0<0){pm0=11;py--;}
    var ps=ymd(new Date(py,pm0,1)), pe=ymd(new Date(py,pm0+1,0));
    return {wsS:wsS,weS:weS,ps:ps,pe:pe,label:cnDate(wsS).replace(/^\d{4}年/,'')+' 起',title:'每月复盘',unit:'本月'};
  }
  if(scope==='year'){
    var wsS2=ymd(new Date(y,0,1)), weS2=ymd(new Date(y,11,31));
    var ps2=ymd(new Date(y-1,0,1)), pe2=ymd(new Date(y-1,11,31));
    return {wsS:wsS2,weS:weS2,ps:ps2,pe:pe2,label:y+' 年度',title:'年度复盘',unit:'本年'};
  }
  var ws=weekStartOf(now), wsS3=ymd(ws), weS3=shift(wsS3,6);
  var ps3=shift(wsS3,-7), pe3=shift(wsS3,-1);
  return {wsS:wsS3,weS:weS3,ps:ps3,pe:pe3,label:cnDate(wsS3)+' — '+cnDate(weS3),title:'每周复盘',unit:'本周'};
}
function setReviewScope(s){WKSCOPE=s;render();}

function exportStuCSV(cid){
  var c=classById(cid);if(!c)return;
  var stus=DB.students.filter(function(x){return x.cid===cid;});
  var head=['学号','姓名','性别','电话','状态','备注','考勤','平时成绩','期末成绩','总评'];
  var lines=[head.join(',')];
  stus.forEach(function(s){
    var t=stuTotal(s);
    lines.push([s.no||'',s.name||'',s.sex||'',s.phone||'',s.status||'',s.note||'',nv(s.att),nv(s.usual),nv(s.final),t===null?'':t].map(csvCell).join(','));
  });
  var csv='﻿'+lines.join('\r\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=(c.name||'班级')+'_学生成绩.csv';document.body.appendChild(a);a.click();
  setTimeout(function(){try{document.body.removeChild(a);}catch(e){}URL.revokeObjectURL(a.href);},120);
}
function importStuCSV(cid){
  var f=$('stuFile').files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(e){
    var rows=parseCSV(e.target.result);
    if(!rows.length){alert('文件是空的，没有可导入的数据行。');return;}
    var head=rows[0].map(function(h){return String(h||'').trim();});
    var hasHeader=head.some(function(h){var k=h.replace(/[（）()\s]/g,'').toLowerCase();return k.indexOf('学号')>=0||k.indexOf('姓名')>=0||k.indexOf('性别')>=0||k.indexOf('考勤')>=0||k.indexOf('平时')>=0||k.indexOf('期末')>=0||k.indexOf('电话')>=0||k.indexOf('状态')>=0||k.indexOf('备注')>=0;});
    var idx={}, dataRows;
    if(hasHeader){
      head.forEach(function(h,i){
        var k=h.replace(/[（）()\s]/g,'').toLowerCase();
        if(k.indexOf('学号')>=0||k==='no')idx.no=i;
        else if(k.indexOf('姓名')>=0||k.indexOf('名字')>=0||k==='name')idx.name=i;
        else if(k.indexOf('性别')>=0||k==='sex')idx.sex=i;
        else if(k.indexOf('电话')>=0||k.indexOf('手机')>=0)idx.phone=i;
        else if(k.indexOf('状态')>=0)idx.status=i;
        else if(k.indexOf('备注')>=0||k.indexOf('note')>=0)idx.note=i;
        else if(k.indexOf('考勤')>=0)idx.att=i;
        else if(k.indexOf('平时')>=0)idx.usual=i;
        else if(k.indexOf('期末')>=0||k.indexOf('终考')>=0)idx.final=i;
      });
      dataRows=rows.slice(1);
    }else{
      idx={no:0,name:1,sex:2,phone:3,status:4,note:5,att:6,usual:7,final:8};
      dataRows=rows;
    }
    if(idx.name===undefined)idx.name=0;
    var add=0,upd=0,skip=0;
    dataRows.forEach(function(r){
      var name=(idx.name!==undefined?r[idx.name]:r[0]||'').trim();
      if(!name){skip++;return;}
      var no=(idx.no!==undefined?r[idx.no]:'').trim();
      var ex=null;
      if(no)ex=DB.students.find(function(s){return s.cid===cid&&(s.no||'')===no;});
      if(!ex)ex=DB.students.find(function(s){return s.cid===cid&&s.name===name;});
      if(ex){upd++;}
      else{ex={id:uid(),cid:cid};DB.students.push(ex);add++;}
      ex.name=name;
      if(no)ex.no=no;
      if(idx.sex!==undefined)ex.sex=(r[idx.sex]||'').trim()||ex.sex||'男';
      if(idx.phone!==undefined)ex.phone=(r[idx.phone]||'').trim();
      if(idx.status!==undefined)ex.status=(r[idx.status]||'').trim()||ex.status||'在读';
      if(idx.note!==undefined)ex.note=(r[idx.note]||'').trim();
      if(idx.att!==undefined)ex.att=nz(r[idx.att]);
      if(idx.usual!==undefined)ex.usual=nz(r[idx.usual]);
      if(idx.final!==undefined)ex.final=nz(r[idx.final]);
    });
    save();$('stuFile').value='';
    alert('导入完成：新增 '+add+' 人，更新 '+upd+' 人，跳过 '+skip+' 行（缺姓名）。');
    render();
  };
  r.readAsText(f,'utf-8');
}

function delItem(coll,id){
  var name={todos:'这条待办',meetings:'这条会议记录',ideas:'这条灵感',projects:'这个项目',
    sched:'这项课表',classes:'这个班级',students:'这名学生',attend:'这条考勤',talks:'这条联系记录',assets:'这项资产',reports:'这条报送'}[coll];
  var extra='';
  if(coll==='projects'){
    var n=DB.todos.filter(function(x){return x.pid===id;}).length;
    if(n)extra='<div class="hint" style="margin-top:8px">该项目下有 '+n+' 条关联待办，删除后这些待办会变成"未关联"，不会被删掉。</div>';
  }
  if(coll==='classes'){
    var ns=DB.students.filter(function(x){return x.cid===id;}).length;
    if(ns)extra='<div class="hint" style="margin-top:8px;color:#b91c1c">该班级下有 '+ns+' 名学生，连同其考勤、谈话家校记录将一并清空且不可恢复。</div>';
  }
  modal('确认删除','<div>确定删除'+name+'吗？删了就找不回来了。</div>'+extra,
    [{t:'取消',c:'',f:'closeModal()'},{t:'确认删除',c:'dgr',f:'doDel(\''+coll+'\',\''+id+'\')'}]);
}
function doDel(coll,id){
  DB[coll]=DB[coll].filter(function(x){return x.id!==id;});
  if(coll==='projects')DB.todos.forEach(function(x){if(x.pid===id)x.pid='';});
  if(coll==='classes'){
    DB.students=DB.students.filter(function(x){return x.cid!==id;});
    DB.attend=DB.attend.filter(function(x){return x.cid!==id;});
    DB.talks=DB.talks.filter(function(x){return x.cid!==id;});
  }
  if(coll==='students'){
    DB.attend=DB.attend.filter(function(x){return x.sid!==id;});
    DB.talks=DB.talks.filter(function(x){return x.sid!==id;});
  }
  save();closeModal();render();
}

function doExport(){
  var data=JSON.parse(JSON.stringify(DB));
  data.exportedAt=new Date().toISOString();
  data.exportedBy='教师办公工作台 v1';
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='教师办公工作台备份_'+today().replace(/-/g,'')+'.txt';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  DB.lastExport=today();DB.noticeAt=total();DB.noticeHidden=0;save();renderNotice();
}
function pickImport(){$('fileIn').click();}
$('fileIn').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var d; try{ d=JSON.parse(r.result); }catch(err){ d=null; }
    if(!d){alert('这个文件不是有效的备份文件，解析失败了。\n请确认是「导出备份」生成的 .json 或 .txt 文件（里面是 JSON 文本即可）。');e.target.value='';return;}
    if(!d||(!Array.isArray(d.todos)&&!Array.isArray(d.meetings)&&!Array.isArray(d.ideas)&&!Array.isArray(d.projects))){
      alert('备份文件里没找到工作台数据，请确认选对了文件。');e.target.value='';return;
    }
    var cnt=(d.todos||[]).length+(d.meetings||[]).length+(d.ideas||[]).length+(d.projects||[]).length+
            (d.sched||[]).length+(d.classes||[]).length+(d.students||[]).length+(d.attend||[]).length+(d.talks||[]).length+(d.assets||[]).length+(d.reports||[]).length;
    window.__imp=d;
    var vd=d.version?(' · 版本 v'+d.version):'';
    var ed=d.exportedAt?(' · 导出于 '+(String(d.exportedAt).slice(0,10))):'';
    modal('导入备份','<div>备份文件里有 <b>'+cnt+'</b> 条数据（待办 '+(d.todos||[]).length+' · 会议 '+(d.meetings||[]).length+' · 灵感 '+(d.ideas||[]).length+' · 项目 '+(d.projects||[]).length+' · 课表 '+(d.sched||[]).length+' · 班级 '+(d.classes||[]).length+' · 学生 '+(d.students||[]).length+' · 台账 '+(d.assets||[]).length+'+'+(d.reports||[]).length+'）。</div>'+
      (vd||ed?'<div class="hint" style="margin-top:6px">来源：'+vd.slice(2)+ed+'</div>':'')+
      '<div class="hint" style="margin-top:10px">选「合并」会保留当前数据并追加不重复的条目；选「覆盖」会先清空当前设备上的数据。换手机搬家一般选覆盖。</div>',
      [{t:'取消',c:'',f:'closeModal()'},{t:'合并追加',c:'',f:'doImport(0)'},{t:'覆盖导入',c:'pri',f:'doImport(1)'}]);
    e.target.value='';
  };
  r.readAsText(f,'utf-8');
});
function doImport(overwrite){
  var d=window.__imp;if(!d)return;
  var keys=['todos','meetings','ideas','projects','sched','classes','students','attend','talks','assets','reports'];
  if(overwrite){
    keys.forEach(function(k){DB[k]=Array.isArray(d[k])?d[k]:[];});
    DB.lastRoll=d.lastRoll||'';DB.lastExport=d.lastExport||'';
  }else{
    keys.forEach(function(k){
      var have={};DB[k].forEach(function(x){have[x.id]=1;});
      (d[k]||[]).forEach(function(x){
        if(!x.id||have[x.id]){x=JSON.parse(JSON.stringify(x));x.id=uid();}
        DB[k].push(x);
      });
    });
  }
  keys.forEach(function(k){if(!Array.isArray(DB[k]))DB[k]=[];});
  window.__imp=null;save();closeModal();render();
  alert('导入完成，当前共 '+total()+' 条数据。');
}

function clearSample(){
  modal('清空示例数据','<div>会删掉初始自带的示例内容，你自己填的数据一条都不会动。</div>',
    [{t:'取消',c:'',f:'closeModal()'},{t:'确认清空示例',c:'pri',f:'doClearSample()'}]);
}
function doClearSample(){
  ['todos','meetings','ideas','projects'].forEach(function(k){
    DB[k]=DB[k].filter(function(x){return !x.sample;});
  });
  DB.todos.forEach(function(x){if(x.pid&&!projById(x.pid))x.pid='';});
  save();closeModal();render();
}
function clearAll(){
  modal('清空全部数据','<div style="color:#b91c1c;font-weight:600">这会删掉这台设备上工作台里的所有内容：待办、会议、灵感、项目，全部清空且无法撤销。</div>'+
    '<div class="hint" style="margin-top:10px">建议先点「导出备份」留一份再清。</div>',
    [{t:'取消',c:'',f:'closeModal()'},{t:'先导出备份',c:'',f:'doExport()'},{t:'我确定，清空',c:'dgr',f:'confirmClearAll()'}]);
}
function confirmClearAll(){
  closeModal();
  modal('再确认一次','<div>真的要清空全部数据吗？这是最后一次确认。</div>',
    [{t:'算了',c:'pri',f:'closeModal()'},{t:'确认清空',c:'dgr',f:'doClearAll()'}]);
}
function doClearAll(){
  DB={ver:1,lastRoll:today(),lastExport:DB.lastExport||'',noticeAt:0,todos:[],meetings:[],ideas:[],projects:[],
    sched:[],classes:[],students:[],attend:[],talks:[],assets:[],reports:[]};
  SELCLASS='';
  save();closeModal();render();
}

/* ==================================================================
   弹窗
   ================================================================== */
function modal(title,body,btns){
  var f=(btns||[]).map(function(b){return '<button class="btn '+(b.c||'')+'" onclick="'+b.f+'">'+b.t+'</button>';}).join('');
  $('modalRoot').innerHTML='<div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal">'+
    '<div class="modal-h"><h3>'+title+'</h3></div><div class="modal-b">'+body+'</div><div class="modal-f">'+f+'</div></div></div>';
}
function closeModal(){$('modalRoot').innerHTML='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

/* ==================================================================
   启动
   ================================================================== */
load();
(function(){var dl=document.getElementById('deptList');if(dl){dl.innerHTML=PROJDEPTS.map(function(d){return '<option value="'+esc(d)+'">';}).join('');}})();
render();
/* 跨天自动刷新（页面一直开着时，第二天打开也能正确顺延） */
setInterval(function(){
  if(DB.lastRoll!==today())render();
},60000);
</script>
</body>
